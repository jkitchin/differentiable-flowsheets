name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Superseded pull-request runs are cancelled; pushes to main are not. Pushing
# three times to a branch used to leave three full matrices running, and only
# the last one's answer was ever read. Main is left alone so its history has a
# result for every commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The whole suite, sharded three ways and run in parallel inside each shard.
  #
  # Two multipliers, because one is not enough. Run end to end in one process
  # the suite takes 50 minutes, nearly all of it XLA turning traced graphs
  # into machine code, and that work is per-process. So:
  #
  #  * `-n auto --dist loadfile` spends every core of the runner. Measured on
  #    a 4-core/16 GB box (what `ubuntu-latest` is), on the half of the suite
  #    this job used to run alone: 40:01 -> 14:30. That is 2.8x, not 4x, and
  #    the shortfall is not thread contention -- pinning XLA and BLAS to one
  #    thread each changed nothing (215s vs 212s over a six-file sample). It
  #    is the compiler itself.
  #
  #  * `--splits/--group` then cuts what is left across three jobs, which run
  #    concurrently. Balance comes from `.test_durations`, not from anyone's
  #    judgement -- and those durations are measured HERE, on the runner,
  #    not on a laptop (#315). A Mac is ~2.3x faster on this suite on
  #    average but far from uniformly: the crude-unit planning tests are
  #    ~7x, so Mac numbers put 27 minutes of runner work in one shard and
  #    8 in another. To re-record, run the suite on CI with
  #    `--store-durations --durations-path <file>` and upload the file as an
  #    artifact, once with `-m "not release"` and once with the release
  #    tier too (publish.yml splits on the same file).
  #
  #  * `-n auto` is 2 workers on `ubuntu-latest`, not 4: it counts physical
  #    cores, and the 4 vCPUs are 2 of them.
  #
  # Three *jobs* and not three pytest invocations in one job: each one re-pays
  # JAX/XLA startup and shares no compiled code with the others, which is dead
  # weight when it is serial (the reason core and bio were merged into a single
  # invocation here) and free when the three run on separate runners.
  #
  # `loadfile`, NOT the default `load`, is what makes the first one pay. A
  # worker has its own compilation cache, so scattering one module's tests
  # across four workers compiles the same graph four times; keeping a file
  # whole keeps the reuse the cache is there for. An earlier attempt at plain
  # `-n auto` is on record as having made the compile-bound tests *worse*
  # (17-33 min against ~11 serial, run 29622893782). It no longer reproduces
  # -- those same tests now go 598s -> 291s at `-n 4` -- most likely because
  # the memory that attempt ran into is what tests/conftest.py now bounds.
  #
  # This replaces a `-m "not slow"` / `-m slow` pair of jobs whose halves had
  # drifted to 2382s against 598s, so wall-clock was the fast half alone: 34
  # minutes. The `slow` marker still exists, and `make test` still skips it,
  # but CI no longer splits on it -- see the marker note in pyproject.toml.
  test:
    name: Tests (${{ matrix.python-version }}, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # A shard was ~7 minutes when this cap was 25, chosen to be short enough
    # to catch a hang, which was the problem with reading the old 45: at 34
    # minutes of real work, a cap that meant "this has hung" and a cap that
    # meant "this is slow today" were the same number, and run 34425803062
    # was cancelled at 81% with everything to that point passing.
    #
    # #315 took shards from 8-10 / 20-22 / 9 minutes back to ~13 each
    # (see `.test_durations` below and tests/conftest.py), so 25 is once
    # again roughly twice a shard: long enough not to fire on a slow
    # runner, short enough that reaching it means something has hung. If
    # a shard creeps toward it, rebalance before raising it.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # One interpreter on a pull request, both of them on main.
        #
        # The jobs run concurrently, so this does not make a pull request
        # finish sooner -- it costs the same wall-clock as one job. What it
        # saves is job-minutes, and this being a public repository those are
        # free. The reason to do it anyway is contention: the jobs draw on the
        # same runner pool as every other repository on the account, and two
        # of them have almost never been the ones to fail.
        #
        # Almost, not never. Every recorded exception was 3.10: over 134
        # full-matrix runs, three had 3.10 fail while 3.11 passed (all on
        # main, 2026-07-17/18), and 3.10 has since been dropped -- it was
        # pinned to jax 0.6.2 / lineax 0.1.0, a frozen stack three JAX
        # minors behind what 3.12 resolves, and the divergence was the
        # failure, not the Python version. 3.11 and 3.12 sit one minor
        # apart and have never disagreed here. If they start to, delete
        # the condition and keep the list.
        python-version: >-
          ${{ fromJSON(github.event_name == 'pull_request'
              && '["3.11"]' || '["3.11", "3.12"]') }}
        # Sharding costs job-minutes and buys wall-clock, and it buys less
        # of it each time: three shards are ~7 min against the ~14 min of an
        # unsharded parallel run, where a fourth would save under two more
        # minutes. If this list changes, `--splits` below has to change with
        # it -- they are the same number written twice, and nothing checks.
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # `solvers` is asdex, which is where difflow.solvers gets its sparsity
      # pattern. Without it as_nlp has only the coarse topology derivation to
      # fall back on, and tests/test_solvers_bridge.py exercises the default.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,solvers]"

      # `-m "not release"` is the point of this job: a commit is checked
      # against the tests that a typo, a rename or a bad merge can break, and
      # not against the ones that re-derive physics. The release tier runs in
      # release.yml -- see the marker note in pyproject.toml for where the
      # line is. `slow` is NOT filtered here; it is a cost label, and the
      # shards balance cost already.
      #
      # `-q`, because `-v` from four workers at once interleaves into
      # something nobody reads; a failure still prints its own name.
      #
      # `--no-loadscope-reorder` (pytest-xdist >= 3.8) keeps the order
      # tests/conftest.py gives the files -- longest recorded duration first.
      # xdist's own order is by test count, which handed shard 2's few-test,
      # many-minute refinery files out last, to run alone at the end (#315).
      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=short -m "not release" \
            -n auto --dist loadfile --no-loadscope-reorder \
            --splits 3 --group ${{ matrix.shard }}

  # Verify the package imports with NO optional dependencies installed. The job
  # this replaces installed ".[dev]" and re-ran the full suite, making it an
  # exact duplicate of test (3.11) rather than a minimal-install check.
  test-minimal:
    name: Test minimal install
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install with no extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import every shipped package and resolve the plugins
        run: |
          python -c "
          import difflow, difflow_bio, difflow_ree, difflow_cc, difflow_gas, difflow_power, difflow_refinery
          from importlib.metadata import entry_points
          eps = entry_points(group='difflow.plugins')
          assert {e.name for e in eps} == {'bio', 'ree', 'cc', 'gas', 'power', 'refinery'}, sorted(e.name for e in eps)
          for e in eps:
              e.load()
          print('difflow', difflow.__version__, '- all packages import, plugins resolve')
          "

      # docutils is the `gui` extra, and the inspector has to degrade to
      # plain text without it rather than break.
      - name: The editor answers with no docstring renderer
        run: |
          python -c "
          from difflow.gui import docs
          from difflow.gui.session import FlowsheetSession
          assert not docs.available(), 'docutils should not be installed here'
          answer = FlowsheetSession().docs('CSTR')
          assert answer['ok'] and answer['format'] == 'text', answer
          assert answer['html'].startswith('<pre>'), answer['html'][:80]
          assert answer['equations'], 'the equations do not need docutils'
          print('the inspector degrades to plain text')
          "

  # The editor front end. `src/difflow/gui/static/` is committed build output --
  # installing difflow must never need node -- so the one thing that can go
  # wrong is drift: someone edits the svelte source and forgets `make
  # gui-build`, and the served bundle silently stops matching it. This job
  # rebuilds from the lockfile and fails if the result differs from the commit.
  #
  # If it trips on a bundle nobody touched, the cause is a toolchain difference
  # rather than a source change: run `make gui-build` on the node version
  # pinned here and commit what it produces.
  gui-frontend:
    name: Editor front end
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/difflow/gui/frontend/package-lock.json

      - name: Install the toolchain from the lockfile
        run: npm ci
        working-directory: src/difflow/gui/frontend

      # The pure model functions (graph -> nodes/edges), under bare node.
      # tests/test_gui.py runs these same files when node is on PATH.
      - name: Test the model functions
        run: npm test
        working-directory: src/difflow/gui/frontend

      - name: Rebuild the bundle
        run: npm run build
        working-directory: src/difflow/gui/frontend

      # The assistant's retrieval index over `docs/` is committed build
      # output too, and it goes stale the moment anyone edits the prose.
      # Stdlib only, so it needs nothing installed.
      - name: Rebuild the documentation index
        run: python3 src/difflow/gui/docs_index.py

      # `git add` first, so a bundle that grew a NEW file counts as drift too
      # -- a plain `git diff` sees only tracked ones and would miss it.
      - name: Fail if the committed bundle is stale
        run: |
          git add -A src/difflow/gui/static
          git diff --cached --exit-code --stat src/difflow/gui/static
