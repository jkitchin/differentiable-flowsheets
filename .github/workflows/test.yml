name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Superseded pull-request runs are cancelled; pushes to main are not. Pushing
# three times to a branch used to leave three full matrices running, and only
# the last one's answer was ever read. Main is left alone so its history has a
# result for every commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast suite: everything except the `slow` (compile-bound) tests. Those run
  # in the `slow-tests` job below, concurrently, so total coverage is unchanged
  # and wall-clock is max(fast, slow) rather than the sum.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One interpreter on a pull request, all three on main.
        #
        # The three jobs run concurrently, so this does not make a pull
        # request finish sooner -- it costs the same wall-clock as one job.
        # What it saves is job-minutes, and this being a public repository
        # those are free. The reason to do it anyway is contention: the three
        # jobs draw on the same runner pool as every other repository on the
        # account, and two of them have almost never been the ones to fail.
        #
        # Almost, not never, and the exception is the cost of this change.
        # Over 134 full-matrix runs, three had 3.10 fail while 3.11 passed
        # (all on main, 2026-07-17/18). Under this split that break would
        # reach main before anything noticed, because a pull request no
        # longer runs 3.10 -- merges still run all three, so it is caught one
        # commit later rather than not at all. If that trade stops being
        # worth it, delete the condition and keep the list.
        python-version: >-
          ${{ fromJSON(github.event_name == 'pull_request'
              && '["3.11"]' || '["3.10", "3.11", "3.12"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # One invocation, not two. Splitting core and bio into separate pytest
      # processes meant the second one re-paid JAX/XLA startup and could not
      # reuse anything the first compiled. `tests/` already includes tests/bio.
      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short -m "not slow"

  # The compile-bound tests. Their cost is one-off JAX trace/compile of nested
  # solver graphs, so they do NOT benefit from xdist -- separate worker
  # processes have separate compilation caches and just recompile the same
  # graphs (measured: run 29622893782 went 17-33 min with `-n auto`, vs ~11
  # without). One job, one process, one compile each.
  slow-tests:
    name: Slow (compile-bound) tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run slow tests
        run: |
          python -m pytest tests/ -v --tb=short -m slow

  # Verify the package imports with NO optional dependencies installed. The job
  # this replaces installed ".[dev]" and re-ran the full suite, making it an
  # exact duplicate of test (3.11) rather than a minimal-install check.
  test-minimal:
    name: Test minimal install
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install with no extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import every shipped package and resolve the plugins
        run: |
          python -c "
          import difflow, difflow_bio, difflow_ree, difflow_cc, difflow_gas
          from importlib.metadata import entry_points
          eps = entry_points(group='difflow.plugins')
          assert {e.name for e in eps} == {'bio', 'ree', 'cc', 'gas'}, sorted(e.name for e in eps)
          for e in eps:
              e.load()
          print('difflow', difflow.__version__, '- all packages import, plugins resolve')
          "
