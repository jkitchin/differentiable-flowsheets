name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,visualization]"

      - name: Run core tests
        run: |
          python -m pytest tests/ -v --tb=short --ignore=tests/bio

      - name: Run bio module tests
        run: |
          python -m pytest tests/bio/ -v --tb=short

      - name: Run visualization tests
        run: |
          python -m pytest tests/test_visualization.py -v --tb=short

  test-minimal:
    name: Test minimal install (no visualization)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run core tests (no visualization)
        run: |
          python -m pytest tests/ -v --tb=short --ignore=tests/test_visualization.py --ignore=tests/bio

      - name: Run bio module tests
        run: |
          python -m pytest tests/bio/ -v --tb=short
