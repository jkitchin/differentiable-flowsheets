name: Publish

# Publishes to PyPI when a GitHub release is published.
# Uses PyPI Trusted Publishing (OIDC) -- no API token secret is stored in
# this repo. The one-time setup is documented in RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # The release tier, before anything is uploaded rather than after. Those
  # tests -- Monte Carlo refits, finite-difference agreement, EOS energy
  # balances, MATPOWER's published answers -- are deselected on every commit
  # (see the `release` marker in pyproject.toml), so a release is the first
  # time the physics is checked end to end. A gate that ran after publishing
  # would not be a gate.
  #
  # One interpreter and all three shards: the point here is coverage of the
  # tier, not of the matrix, which release-tests.yml sweeps nightly.
  full-suite:
    name: Full suite (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,solvers]"

      - name: Run the whole suite
        run: |
          python -m pytest tests/ -q --tb=short \
            -n auto --dist loadfile \
            --splits 3 --group ${{ matrix.shard }}

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: full-suite

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Verify all five packages are in the wheel
        run: |
          python -m zipfile -l dist/difflow-*.whl > wheel.txt
          for pkg in difflow difflow_bio difflow_ree difflow_cc difflow_gas; do
            grep -q "^ *$pkg/__init__.py" wheel.txt || { echo "MISSING: $pkg"; exit 1; }
          done
          echo "All five packages present."

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Trusted Publishing requires this environment to match the one
    # configured on PyPI, and needs id-token: write to mint the OIDC token.
    environment:
      name: pypi
      url: https://pypi.org/p/difflow
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
