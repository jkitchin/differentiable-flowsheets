name: Publish

# Publishes to PyPI when a GitHub release is published.
# Uses PyPI Trusted Publishing (OIDC) -- no API token secret is stored in
# this repo. The one-time setup is documented in RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Verify all five packages are in the wheel
        run: |
          python -m zipfile -l dist/difflow-*.whl > wheel.txt
          for pkg in difflow difflow_bio difflow_ree difflow_cc difflow_gas; do
            grep -q "^ *$pkg/__init__.py" wheel.txt || { echo "MISSING: $pkg"; exit 1; }
          done
          echo "All five packages present."

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Trusted Publishing requires this environment to match the one
    # configured on PyPI, and needs id-token: write to mint the OIDC token.
    environment:
      name: pypi
      url: https://pypi.org/p/difflow
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
