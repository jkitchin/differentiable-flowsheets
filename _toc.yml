format: jb-book
root: README
parts:
  - caption: Documentation
    chapters:
      - file: docs/index
      - file: docs/getting-started
      - file: docs/unit-operations-chemical
      - file: docs/unit-operations-bio
      - file: docs/unit-operations-ree
      - file: docs/unit-operations-carbon-capture
      - file: docs/unit-operations-gas
      - file: docs/thermodynamics
      - file: docs/technoeconomics
      - file: docs/parameter-estimation
      - file: docs/experiment-design
      - file: docs/data-reconciliation
      - file: docs/planning
      - file: docs/operability
      - file: docs/flexibility
      - file: docs/streams-and-flowsheets
      - file: docs/dynamic-modeling
      - file: docs/moving-horizon-estimation
      - file: docs/solvers-and-utilities
      - file: docs/external-solvers
      - file: docs/eo-solver

  - caption: About Flowsheets
    chapters:
      - glob: about-flowsheets/*

  - caption: JAX Tutorials
    chapters:
      - glob: jax-tutorials/*

  - caption: Literature
    chapters:
      - file: docs/literature/literature_review

  - caption: Examples
    chapters:
      - glob: examples/[0-9]*

  - caption: Bio Manufacturing Examples
    chapters:
      - glob: examples/bio/*

  - caption: Carbon Capture Examples
    chapters:
      - glob: src/difflow_cc/examples/*
