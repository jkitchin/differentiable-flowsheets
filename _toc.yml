# Table of contents
# Learn more at https://jupyterbook.org/customize/toc.html

format: jb-book
root: README
parts:
  - caption: Documentation
    chapters:
      - file: docs/index
      - file: docs/getting-started
      - file: docs/unit-operations-chemical
      - file: docs/unit-operations-bio
      - file: docs/unit-operations-ree
      - file: docs/thermodynamics
      - file: docs/technoeconomics
      - file: docs/streams-and-flowsheets
      - file: docs/solvers-and-utilities

  - caption: Tutorials
    chapters:
      - glob: tutorials/*

  - caption: Examples
    chapters:
      - glob: examples/[0-9]*

  - caption: Bio Manufacturing Examples
    chapters:
      - glob: examples/bio/*
