<h2 id="the-challenge-rare-earth-separation">The Challenge: Rare Earth Separation</h2>
<ul>
<li>U.S. depends on imports for <strong>critical REE</strong> (Nd, Dy, Pr) used in magnets, electronics, defense</li>
<li>REE are <strong>chemically near-identical</strong> — separation requires many stages of solvent extraction</li>
<li>Traditional simulators (Aspen, HYSYS) lack efficient optimization for these flowsheets</li>
<li>Process design today relies on <strong>trial-and-error</strong> experimentation and heuristics</li>
</ul>
<blockquote>
<p>Separating 10+ similar elements across 20+ stages with recycles is a combinatorial nightmare for conventional tools.</p>
</blockquote>
</section>

<h2 id="our-approach-differentiable-flowsheets">Our Approach: Differentiable Flowsheets</h2>
<ul>
<li>Built on <strong>JAX</strong> — every calculation is automatically differentiable</li>
<li>Gradients flow through the <strong>entire flowsheet</strong>: units, recycles, economics</li>
<li>Gradient-based optimization: <strong>orders of magnitude faster</strong> than derivative-free methods</li>
<li>Key insight: treat the whole process as a <strong>differentiable program</strong></li>
</ul>
<div>
<p><strong>Lab Data</strong> → <strong>Calibrated Model</strong> → <strong>Optimized Design</strong> → <strong>Economics</strong><br />
<em>All connected by automatic differentiation</em></p>
</div>

<h2 id="what-differentiable-means-in-practice">What &quot;Differentiable&quot; Means in Practice</h2>
<div>
<div>
<h3 id="traditional-approach">Traditional Approach</h3>
<ul>
<li>Perturb one variable, re-simulate</li>
<li><strong>N+1 simulations</strong> for N parameters</li>
<li>Finite-difference approximations</li>
<li>Slow, inaccurate for large systems</li>
</ul>
</div>
<div>
<h3 id="our-approach">Our Approach</h3>
<ul>
<li><strong>Exact gradients</strong> of any output w.r.t. any input — in one pass</li>
<li>Sensitivity, uncertainty, and optimization simultaneously</li>
<li>Scales to hundreds of parameters</li>
</ul>
</div>
</div>

<h2 id="ree-separation-capabilities">REE Separation Capabilities</h2>
<div>
<div>
<h3 id="elements--extractants">Elements &amp; Extractants</h3>
<ul>
<li><strong>10 REE elements</strong>: La, Ce, Pr, Nd, Sm, Eu, Gd, Tb, Dy, Y</li>
<li><strong>4 extractant systems</strong>: D2EHPA, PC88A, Cyanex272, TBP</li>
<li>pH-dependent equilibrium with temperature correction</li>
</ul>
</div>
<div>
<h3 id="unit-operations">Unit Operations</h3>
<ul>
<li>Multi-stage <strong>Extractor</strong> (Kremser equation)</li>
<li><strong>Mixer-Settler</strong> with efficiency</li>
<li><strong>Scrubber</strong> for impurity rejection</li>
<li><strong>Stripper</strong> for product recovery</li>
<li><strong>3 Precipitators</strong> (oxalate, carbonate, hydroxide)</li>
<li><strong>CeO₂ oxidizer</strong> for selective Ce removal</li>
</ul>
</div>
</div>
</section>

<h2 id="integrated-economics--all-differentiable">Integrated Economics — All Differentiable</h2>
<div>
<div>
<h3 id="500-tyear-plant">500 t/year Plant</h3>
<ul>
<li><strong>CAPEX</strong>: $3.6M</li>
<li><strong>OPEX</strong>: $10.3M/year</li>
<li><strong>Revenue</strong>: $48.1M/year</li>
<li><strong>ROI</strong>: 774%</li>
<li><strong>Payback</strong>: &lt; 1 year</li>
</ul>
</div>
<div>
<h3 id="what-differentiable-economics-enables">What Differentiable Economics Enables</h3>
<ul>
<li>Optimize directly for <strong>profit</strong> or <strong>minimum selling price</strong></li>
<li>Gradients of cost w.r.t. every design variable</li>
<li>Trade-off: purity vs. recovery vs. cost — quantified exactly</li>
<li>Risk-aware design under price uncertainty</li>
</ul>
</div>
</div>
</section>

<h2 id="parameter-estimation-from-lab-data">Parameter Estimation from Lab Data</h2>
<ul>
<li>Fit pH-dependent distribution coefficients to <strong>experimental concentration data</strong></li>
<li>7 pH values × 3 replicates → <strong>9 parameters</strong> fitted (a, b, c per element)</li>
<li>All parameters recovered within <strong>95% confidence intervals</strong></li>
<li><strong>R² &gt; 0.999</strong>, RMSE &lt; 1 mg/L</li>
</ul>
<blockquote>
<p>Closes the loop: <strong>lab data → calibrated model → optimized design</strong><br />
No manual parameter tuning required.</p>
</blockquote>
</section>

<h2 id="uncertainty-quantification">Uncertainty Quantification</h2>
<div>
<div>
<h3 id="four-built-in-methods">Four Built-In Methods</h3>
<ul>
<li><strong>Linear propagation</strong> — fast, first-order</li>
<li><strong>Monte Carlo</strong> — nonparametric sampling</li>
<li><strong>Sobol indices</strong> — global sensitivity</li>
<li><strong>Covariance propagation</strong> — full Jacobian</li>
</ul>
</div>
<div>
<h3 id="impact">Impact</h3>
<ul>
<li>Propagate experimental uncertainty through flowsheet to <strong>economic outputs</strong></li>
<li>Identify which parameters matter most</li>
<li><strong>Risk-aware optimization</strong>: maximize expected profit while controlling variance</li>
</ul>
</div>
</div>
</section>

<h2 id="what-makes-this-novel">What Makes This Novel</h2>
<ul>
<li><strong>First differentiable REE separation simulator</strong></li>
<li>Exact gradients through multi-stage counter-current extraction with recycles</li>
<li><strong>Unified framework</strong>: experiment → model → optimize → economics</li>
<li>Three domain plugins: REE extraction, bio manufacturing, carbon capture</li>
<li>Open, extensible Python framework — not a black-box commercial tool</li>
</ul>
<div>
<p>Traditional simulators <strong>simulate</strong>. Our framework <strong>optimizes</strong>.</p>
</div>
