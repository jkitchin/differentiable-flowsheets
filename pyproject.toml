[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "difflow"
version = "0.5.0"
description = "Differentiable flowsheet framework for chemical processes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "John R. Kitchin", email = "jkitchin@andrew.cmu.edu" },
]
maintainers = [
    { name = "John R. Kitchin", email = "jkitchin@andrew.cmu.edu" },
]
keywords = [
    "chemical engineering",
    "process simulation",
    "optimal power flow",
    "power systems",
    "automatic differentiation",
    "jax",
    "optimization",
    "technoeconomic analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "diffrax>=0.6.0",
    # 0.0.8's LU solver converts a traced bool to Python under current jax, so
    # every implicit diffrax solver (kvaerno5 on the Robertson example in
    # docs/dynamic-modeling.md) dies with TracerBoolConversionError. 0.1.0 is
    # the first release that does not.
    "lineax>=0.1.0",
    "optimistix>=0.0.6",
    # Not used directly -- it arrives under diffrax/lineax/optimistix, none of
    # which floor it high enough. jax 0.11.1 removed `jax.core.get_aval` and
    # `jax.core.mapped_aval`, which equinox 0.13.2 still calls from
    # `internal/_primitive.py`, so every implicitly-differentiated root find
    # (every flash, every recycle tear, every REE free-extractant solve) dies
    # with an AttributeError the moment a gradient is taken. 0.13.3 is the
    # first release that does not.
    "equinox>=0.13.3",
    "pyyaml>=6.0",
    # jax 0.11 removed `jax.core.get_opaque_trace_state` and `jax.core.Effect`,
    # which flax 0.12.2 still calls (flax/core/tracers.py, flax/nnx/variablelib.py),
    # so importing flax.nnx dies with an AttributeError. 0.12.9 is the first
    # release built against jax 0.11.1. Both need Python 3.12, so 3.11 keeps the
    # older jax and the older floor.
    "flax>=0.12.9; python_version >= '3.12'",
    "flax>=0.10.7; python_version < '3.12'",
    "gpjax>=0.12.2",
    # Not used directly -- it arrives under gpjax. jax 0.11 removed
    # `xla_pmap_p`, which numpyro 0.20.1 still imports in numpyro/ops/provenance.py,
    # so `import gpjax` dies with an ImportError. 0.21.0 is the first release
    # that does not.
    "numpyro>=0.21.0",
    "blackjax>=1.3",
    "matplotlib>=3.10.8",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    # The suite is compile-bound, so it parallelises across processes and not
    # across threads: `pytest -n 4` cut it from 40 to 14.5 minutes on a
    # 4-core box, where forcing XLA and BLAS to one thread each changed
    # nothing (215s vs 212s on a 6-file sample). `pytest-split` shards the
    # suite across CI jobs by measured duration -- see `.test_durations`.
    "pytest-xdist>=3.8",
    "pytest-split>=0.8",
    "jupyter-book<2.0",
    # tests/test_gaspype_import.py: pure Python on NumPy, so it is cheap to
    # carry and its adapter is tested against the real database.
    "gaspype>=1.1",
]
examples = [
    "matplotlib>=3.5.0",
    "jupyter>=1.0.0",
    "jaxopt>=0.8.0",
    "optax>=0.1.0",
    "tabulate>=0.9.0",
    # examples/22_ree_parameter_estimation and 44_particles_and_beds
    "pandas>=2.0",
]
visualization = [
    "ipycytoscape>=1.3.0",
    "networkx>=2.6.0",
]
pyglenn = [
    # NASA Glenn (CEA) thermodynamic database access for difflow.pyglenn_import
    "pyglenn",
]
gaspype = [
    # Gaspype's NASA-9 gas-phase database for difflow.gaspype_import
    "gaspype>=1.1",
]
dwsim = [
    # DWSIM thermodynamics via pythonnet for difflow.dwsim_import (also needs a
    # DWSIM 9 install and the .NET 8 runtime; see scripts/install_dwsim.sh)
    "pythonnet",
]
bio = [
    # Bio manufacturing operations are included in the main package
]
ree = [
    # Rare earth separation operations are included in the main package
]
cc = [
    # Carbon capture operations are included in the main package
]
gas = [
    # Gas transmission network operations are included in the main package
]
power = [
    # Electrical grid operations are included in the main package
]
refinery = [
    # Refinery operations (crude and vacuum units, blending) are
    # included in the main package
]
gui = [
    # Docstring rendering for an operation's documentation
    # (difflow.workspace.docs), which the book's browser editor shows in its
    # inspector. Without it the documentation is plain text, and nothing
    # else changes.
    "docutils>=0.19",
]
planning = [
    # Pyomo model emission for difflow.planning (LPModel.to_pyomo).
    # The planner itself solves with HiGHS via scipy and needs nothing extra.
    "pyomo>=6.0",
]
solvers = [
    # difflow.solvers: sparsity patterns for the external NLP/MINLP bridges.
    # asdex propagates index sets through the jaxpr, so the pattern it returns
    # is valid for every input -- unlike probing at a random point, which a
    # process model answers with nan and pounce then records as a structural
    # zero. The back ends themselves (pounce-solver[jax], discopt) stay
    # optional: install whichever one you solve with.
    #
    # The `python_version >= "3.11"` marker this carried is gone with 3.10:
    # asdex never published a 3.10 wheel, which is what the marker was for.
    "asdex>=0.5",
]
mcp = [
    # difflow.mcp: `difflow mcp` serves difflow.agent's tools to an agent
    # over stdio. Only difflow/mcp/server.py imports it; mcp 2 renamed
    # FastMCP to MCPServer, which is what that file is written against.
    "mcp>=2,<3",
]
cuda12 = [
    "jax[cuda12]>=0.4.0",
]
cuda11 = [
    "jax[cuda11_local]>=0.4.0",
]
all = [
    "difflow[dev,examples,visualization,bio,ree,cc,gas,power,refinery,solvers,mcp]",
]

[project.urls]
Homepage = "https://github.com/jkitchin/differentiable-flowsheets"
Documentation = "https://kitchingroup.cheme.cmu.edu/differentiable-flowsheets/"
Repository = "https://github.com/jkitchin/differentiable-flowsheets"
Issues = "https://github.com/jkitchin/differentiable-flowsheets/issues"

[project.entry-points."difflow.plugins"]
bio = "difflow_bio:register"
ree = "difflow_ree:register"
cc = "difflow_cc:register"
gas = "difflow_gas:register"
power = "difflow_power:register"
refinery = "difflow_refinery:register"

[project.entry-points."difflow.agent"]
# What each plugin adds to the agent tools (difflow.agent.plugins).
bio = "difflow_bio.agent:support"
ree = "difflow_ree.agent:support"
cc = "difflow_cc.agent:support"
gas = "difflow_gas.agent:support"
power = "difflow_power.agent:support"
refinery = "difflow_refinery.agent:support"

[project.scripts]
difflow = "difflow.cli:main"
difflow-mcp = "difflow.mcp.server:main"

[tool.hatch.build]
# No notebooks in either artifact. They are committed pre-executed with plot
# output embedded as base64 images, and nothing imports them at runtime. Some
# live inside the package tree (src/difflow_cc/examples/), so this has to be a
# global exclude rather than an sdist-only one. They stay on GitHub.
#
# The per-module CLAUDE.md notes are for working on the source, not for an
# install.
exclude = ["**/*.ipynb", "src/**/CLAUDE.md"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/difflow",
    "src/difflow_bio",
    "src/difflow_ree",
    "src/difflow_cc",
    "src/difflow_gas",
    "src/difflow_power",
    "src/difflow_refinery",
]

[tool.hatch.build.targets.sdist]
# Keep the sdist to what is needed to build and test the package. The notebook
# directories (jax-tutorials/, examples/, about-flowsheets/) are committed
# pre-executed, with plot output embedded as base64 images; including them adds
# ~15 MB to every download. They stay on GitHub instead.
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CITATION.cff",
]

[tool.pytest.ini_options]
# The suite checks correctness only (a unit runs, its outputs are finite and
# shaped right, its gradient is finite, the API and validation contracts
# hold), never the physics or a published answer. DIFFLOW_TEST_BUDGET
# (tests/conftest.py) keeps every test cheap.

[dependency-groups]
dev = [
    "ipycytoscape>=1.3.3",
    "ipykernel>=7.1.0",
    "nbconvert>=7.16.6",
]
