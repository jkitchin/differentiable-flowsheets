[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "difflow"
version = "0.1.0"
description = "Differentiable flowsheet framework for chemical processes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "John R. Kitchin", email = "jkitchin@andrew.cmu.edu" },
]
maintainers = [
    { name = "John R. Kitchin", email = "jkitchin@andrew.cmu.edu" },
]
keywords = [
    "chemical engineering",
    "process simulation",
    "automatic differentiation",
    "jax",
    "optimization",
    "technoeconomic analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "diffrax>=0.6.0",
    "lineax>=0.0.7",
    "optimistix>=0.0.6",
    "pyyaml>=6.0",
    "flax>=0.10.7",
    "gpjax>=0.12.2",
    "blackjax>=1.3",
    "matplotlib>=3.10.8",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "jupyter-book<2.0",
]
examples = [
    "matplotlib>=3.5.0",
    "jupyter>=1.0.0",
    "jaxopt>=0.8.0",
    "optax>=0.1.0",
    "tabulate>=0.9.0",
]
visualization = [
    "ipycytoscape>=1.3.0",
    "networkx>=2.6.0",
]
pyglenn = [
    # NASA Glenn (CEA) thermodynamic database access for difflow.pyglenn_import
    "pyglenn",
]
dwsim = [
    # DWSIM standalone thermodynamics via pythonnet for difflow.dwsim_import
    # (also requires a local DWSIM/DTL install providing the thermo DLL)
    "pythonnet",
]
bio = [
    # Bio manufacturing operations are included in the main package
]
ree = [
    # Rare earth separation operations are included in the main package
]
cc = [
    # Carbon capture operations are included in the main package
]
gas = [
    # Gas transmission network operations are included in the main package
]
planning = [
    # Pyomo model emission for difflow.planning (LPModel.to_pyomo).
    # The planner itself solves with HiGHS via scipy and needs nothing extra.
    "pyomo>=6.0",
]
cuda12 = [
    "jax[cuda12]>=0.4.0",
]
cuda11 = [
    "jax[cuda11_local]>=0.4.0",
]
all = [
    "difflow[dev,examples,visualization,bio,ree,cc,gas]",
]

[project.urls]
Homepage = "https://github.com/jkitchin/differentiable-flowsheets"
Documentation = "https://kitchingroup.cheme.cmu.edu/differentiable-flowsheets/"
Repository = "https://github.com/jkitchin/differentiable-flowsheets"
Issues = "https://github.com/jkitchin/differentiable-flowsheets/issues"

[project.entry-points."difflow.plugins"]
bio = "difflow_bio:register"
ree = "difflow_ree:register"
cc = "difflow_cc:register"
gas = "difflow_gas:register"

[project.scripts]
difflow = "difflow.report.cli:main"

[tool.hatch.build]
# No notebooks in either artifact. They are committed pre-executed with plot
# output embedded as base64 images, and nothing imports them at runtime. Some
# live inside the package tree (src/difflow_cc/examples/), so this has to be a
# global exclude rather than an sdist-only one. They stay on GitHub.
exclude = ["**/*.ipynb"]

[tool.hatch.build.targets.wheel]
packages = ["src/difflow", "src/difflow_bio", "src/difflow_ree", "src/difflow_cc", "src/difflow_gas"]

[tool.hatch.build.targets.sdist]
# Keep the sdist to what is needed to build and test the package. The notebook
# directories (jax-tutorials/, examples/, about-flowsheets/) are committed
# pre-executed, with plot output embedded as base64 images; including them adds
# ~15 MB to every download. They stay on GitHub instead.
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CITATION.cff",
]

[tool.pytest.ini_options]
markers = [
    "slow: test whose cost is the computation rather than the assertion -- usually a large one-off JAX trace/compile (nested solver graphs, implicit-diff backward passes), sometimes many repeated solves. Deselected from the default suite via `-m 'not slow'`; CI still runs them, in a separate concurrent job, so coverage is unchanged. Keep the two jobs roughly balanced: CI wall-clock is max(fast, slow), so moving work past the halfway point stops helping.",
]

[dependency-groups]
dev = [
    "ipycytoscape>=1.3.3",
    "ipykernel>=7.1.0",
    "nbconvert>=7.16.6",
]
