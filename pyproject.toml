[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "difflow"
version = "0.1.0"
description = "Differentiable flowsheet framework for chemical processes"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "diffrax>=0.6.0",
    "lineax>=0.0.7",
    "optimistix>=0.0.6",
    "pyyaml>=6.0",
    "flax>=0.10.7",
    "gpjax>=0.12.2",
    "blackjax>=1.3",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-xdist>=3.0",   # parallel test execution (-n auto)
    "pytest-timeout>=2.0",  # per-test timeout so hangs fail cleanly
    "jupyter-book<2.0",
]
examples = [
    "matplotlib>=3.5.0",
    "jupyter>=1.0.0",
    "jaxopt>=0.8.0",
    "optax>=0.1.0",
]
visualization = [
    "ipycytoscape>=1.3.0",
    "networkx>=2.6.0",
]
pyglenn = [
    # NASA Glenn (CEA) thermodynamic database access for difflow.pyglenn_import
    "pyglenn",
]
dwsim = [
    # DWSIM standalone thermodynamics via pythonnet for difflow.dwsim_import
    # (also requires a local DWSIM/DTL install providing the thermo DLL)
    "pythonnet",
]
bio = [
    # Bio manufacturing operations are included in the main package
]
ree = [
    # Rare earth separation operations are included in the main package
]
cc = [
    # Carbon capture operations are included in the main package
]
gas = [
    # Gas transmission network operations are included in the main package
]
cuda12 = [
    "jax[cuda12]>=0.4.0",
]
cuda11 = [
    "jax[cuda11_local]>=0.4.0",
]
all = [
    "difflow[dev,examples,visualization,bio,ree,cc,gas]",
]

[project.entry-points."difflow.plugins"]
bio = "difflow_bio:register"
ree = "difflow_ree:register"
cc = "difflow_cc:register"
gas = "difflow_gas:register"

[project.scripts]
difflow = "difflow.report.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/difflow", "src/difflow_bio", "src/difflow_ree", "src/difflow_cc", "src/difflow_gas"]

[tool.pytest.ini_options]
# Per-test timeout so a hung solve fails loudly (with a traceback) instead of
# silently stalling until the CI runner is SIGTERM'd. Slowest legitimate test
# is ~20s, so 180s is generous headroom. Parallelism (-n auto) is opt-in via
# the CI command / local flag, not forced here, to keep single-test runs clean.
timeout = 180

[dependency-groups]
dev = [
    "ipycytoscape>=1.3.3",
    "ipykernel>=7.1.0",
    "nbconvert>=7.16.6",
]
