[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "difflow"
version = "0.1.0"
description = "Differentiable flowsheet framework for chemical processes"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "jupyter-book<2.0",
]
examples = [
    "matplotlib>=3.5.0",
    "jupyter>=1.0.0",
]
visualization = [
    "ipycytoscape>=1.3.0",
    "networkx>=2.6.0",
]
bio = [
    # Bio manufacturing operations are included in the main package
]
ree = [
    # Rare earth separation operations are included in the main package
]
all = [
    "difflow[dev,examples,visualization,bio,ree]",
]

[project.entry-points."difflow.plugins"]
bio = "difflow_bio:register"
ree = "difflow_ree:register"

[tool.hatch.build.targets.wheel]
packages = ["src/difflow", "src/difflow_bio", "src/difflow_ree"]
