# Adsorbent Material Database for CO2 Capture
# All parameters from peer-reviewed literature
#
# References:
#   [1] Cavenati S et al. (2004). J Chem Eng Data 49:1095 - Zeolite 13X
#   [2] Caskey SR et al. (2008). J Am Chem Soc 130:10870 - Mg-MOF-74
#   [3] Millward AR, Yaghi OM (2005). J Am Chem Soc 127:17998 - MOFs
#   [4] Sevilla M, Fuertes AB (2011). Energy Environ Sci 4:1765 - Activated carbon
#   [5] Choi S et al. (2009). ChemSusChem 2:796 - Amine-functionalized
#   [6] Belmabkhout Y et al. (2009). Adsorption 15:318 - CALF-20
#   [7] Rege SU, Yang RT (1997). IEC Research 36:5358 - Zeolite 5A

adsorbents:
  # =========================================================================
  # ZEOLITES
  # =========================================================================
  Zeolite_13X:
    full_name: "Zeolite 13X (NaX)"
    type: "zeolite"
    framework: "FAU"  # Faujasite
    # Physical properties
    surface_area: 650.0  # m2/g BET
    pore_volume: 0.30  # cm3/g
    pore_diameter: 7.4  # Angstrom (window size)
    density_bulk: 650.0  # kg/m3
    density_particle: 1100.0  # kg/m3
    heat_capacity: 920.0  # J/(kg*K)
    thermal_conductivity: 0.15  # W/(m*K)
    # Isotherm parameters for CO2
    # Ref: Cavenati et al. (2004)
    isotherms:
      CO2:
        model: "toth"
        # q = q_sat * b*P / (1 + (b*P)^t)^(1/t)
        # Temperature dependence: b = b0*exp(Q/RT), t = t0 + alpha/T
        q_sat: 6.06  # mol/kg
        b0: 1.73e-9  # 1/Pa
        Q: 36000.0  # J/mol (isosteric heat)
        t0: 0.39
        alpha: 0.0
        T_ref: 298.15  # K
      N2:
        model: "langmuir"
        q_sat: 3.5  # mol/kg
        b0: 1.5e-10
        Q: 15800.0
        T_ref: 298.15
      H2O:
        model: "langmuir"
        q_sat: 12.0  # mol/kg - hydrophilic
        b0: 5.0e-7
        Q: 45000.0
        T_ref: 298.15
    # Performance metrics
    CO2_capacity_1bar_25C: 5.5  # mol/kg
    CO2_N2_selectivity: 62.0
    heat_of_adsorption_CO2: 34.65  # kJ/mol
    # Regeneration
    regen_temperature: 423.15  # K (150°C)
    desorption_pressure: 0.1  # bar (VSA)
    # Cost
    cost_usd_kg: 3.0

  Zeolite_5A:
    full_name: "Zeolite 5A (CaA)"
    type: "zeolite"
    framework: "LTA"
    surface_area: 550.0
    pore_volume: 0.25
    pore_diameter: 5.0
    density_bulk: 700.0
    density_particle: 1150.0
    heat_capacity: 900.0
    thermal_conductivity: 0.14
    isotherms:
      CO2:
        model: "dual_site_langmuir"
        # q = q1*b1*P/(1+b1*P) + q2*b2*P/(1+b2*P)
        # Ref: Rege & Yang (1997)
        q1: 2.5  # mol/kg (site 1)
        b1_0: 2.0e-8
        Q1: 42000.0
        q2: 3.0  # mol/kg (site 2)
        b2_0: 5.0e-10
        Q2: 28000.0
        T_ref: 298.15
      N2:
        model: "langmuir"
        q_sat: 2.8
        b0: 1.2e-10
        Q: 16500.0
        T_ref: 298.15
    CO2_capacity_1bar_25C: 4.2
    CO2_N2_selectivity: 45.0
    heat_of_adsorption_CO2: 38.0
    regen_temperature: 423.15
    desorption_pressure: 0.1
    cost_usd_kg: 4.0

  # =========================================================================
  # METAL-ORGANIC FRAMEWORKS
  # =========================================================================
  Mg_MOF_74:
    full_name: "Mg-MOF-74 (CPO-27-Mg)"
    type: "MOF"
    framework: "MOF-74"
    metal_center: "Mg"
    surface_area: 1174.0  # m2/g
    pore_volume: 0.57
    pore_diameter: 10.2
    density_bulk: 350.0
    density_particle: 870.0
    heat_capacity: 800.0
    thermal_conductivity: 0.10
    isotherms:
      CO2:
        model: "dual_site_langmuir"
        # Ref: Caskey et al. (2008), Queen et al. (2014)
        q1: 6.5
        b1_0: 5.0e-8
        Q1: 47000.0  # Open metal site
        q2: 3.5
        b2_0: 8.0e-10
        Q2: 32000.0
        T_ref: 298.15
      N2:
        model: "langmuir"
        q_sat: 2.0
        b0: 3.0e-11
        Q: 18000.0
        T_ref: 298.15
    CO2_capacity_1bar_25C: 8.61
    CO2_N2_selectivity: 160.0
    heat_of_adsorption_CO2: 42.0  # kJ/mol (open metal site)
    regen_temperature: 353.15  # K (80°C) - lower than zeolite
    desorption_pressure: 0.05
    water_stability: "moderate"  # Degrades with humidity
    cost_usd_kg: 50.0

  CALF_20:
    full_name: "CALF-20 (zinc-triazolate)"
    type: "MOF"
    framework: "CALF-20"
    metal_center: "Zn"
    # Ref: Belmabkhout et al. (2009)
    surface_area: 510.0
    pore_volume: 0.22
    pore_diameter: 5.5
    density_bulk: 450.0
    density_particle: 1200.0
    heat_capacity: 850.0
    thermal_conductivity: 0.12
    isotherms:
      CO2:
        model: "sips"
        # q = q_sat * (b*P)^n / (1 + (b*P)^n)
        q_sat: 4.5
        b0: 3.0e-8
        Q: 38000.0
        n: 0.85  # Heterogeneity parameter
        T_ref: 298.15
      N2:
        model: "langmuir"
        q_sat: 1.5
        b0: 2.0e-11
        Q: 15000.0
        T_ref: 298.15
    CO2_capacity_1bar_25C: 3.8
    CO2_N2_selectivity: 80.0
    heat_of_adsorption_CO2: 37.0
    regen_temperature: 363.15
    desorption_pressure: 0.05
    water_stability: "high"  # Stable to humidity
    cost_usd_kg: 80.0

  ZIF_8:
    full_name: "Zeolitic Imidazolate Framework-8"
    type: "MOF"
    framework: "SOD"
    metal_center: "Zn"
    surface_area: 1630.0
    pore_volume: 0.66
    pore_diameter: 3.4  # Window size
    density_bulk: 350.0
    density_particle: 950.0
    heat_capacity: 780.0
    thermal_conductivity: 0.08
    isotherms:
      CO2:
        model: "langmuir"
        q_sat: 2.8
        b0: 1.5e-9
        Q: 26000.0
        T_ref: 298.15
      CH4:
        model: "langmuir"
        q_sat: 2.5
        b0: 8.0e-10
        Q: 20000.0
        T_ref: 298.15
    CO2_capacity_1bar_25C: 2.5
    CO2_CH4_selectivity: 5.0  # Lower selectivity
    heat_of_adsorption_CO2: 25.0
    regen_temperature: 373.15
    desorption_pressure: 0.1
    water_stability: "high"
    cost_usd_kg: 100.0

  # =========================================================================
  # ACTIVATED CARBONS
  # =========================================================================
  AC_Coconut:
    full_name: "Activated Carbon (Coconut shell)"
    type: "activated_carbon"
    surface_area: 1100.0
    pore_volume: 0.45
    pore_diameter: 12.0  # Wide distribution
    density_bulk: 450.0
    density_particle: 850.0
    heat_capacity: 840.0
    thermal_conductivity: 0.20
    isotherms:
      CO2:
        model: "sips"
        # Ref: Sevilla & Fuertes (2011)
        q_sat: 3.5
        b0: 5.0e-9
        Q: 24000.0
        n: 0.78
        T_ref: 298.15
      N2:
        model: "langmuir"
        q_sat: 1.5
        b0: 3.0e-10
        Q: 12000.0
        T_ref: 298.15
    CO2_capacity_1bar_25C: 2.5
    CO2_N2_selectivity: 15.0
    heat_of_adsorption_CO2: 22.0
    regen_temperature: 393.15
    desorption_pressure: 0.1
    water_stability: "high"
    cost_usd_kg: 2.0

  AC_Nitrogen_Doped:
    full_name: "Nitrogen-doped Activated Carbon"
    type: "activated_carbon"
    surface_area: 1500.0
    pore_volume: 0.55
    pore_diameter: 10.0
    density_bulk: 400.0
    density_particle: 800.0
    heat_capacity: 850.0
    thermal_conductivity: 0.18
    isotherms:
      CO2:
        model: "sips"
        q_sat: 5.0
        b0: 8.0e-9
        Q: 30000.0
        n: 0.82
        T_ref: 298.15
      N2:
        model: "langmuir"
        q_sat: 1.8
        b0: 2.5e-10
        Q: 13000.0
        T_ref: 298.15
    CO2_capacity_1bar_25C: 4.2
    CO2_N2_selectivity: 35.0
    heat_of_adsorption_CO2: 28.0
    regen_temperature: 393.15
    desorption_pressure: 0.1
    water_stability: "high"
    cost_usd_kg: 5.0

  # =========================================================================
  # AMINE-FUNCTIONALIZED MATERIALS
  # =========================================================================
  PEI_Silica:
    full_name: "PEI-impregnated Mesoporous Silica"
    type: "amine_functionalized"
    support: "SBA-15"
    amine_loading: 0.50  # g PEI / g total
    # Ref: Choi et al. (2009)
    surface_area: 250.0  # Reduced due to PEI filling
    pore_volume: 0.35
    pore_diameter: 60.0  # Mesoporous
    density_bulk: 550.0
    density_particle: 1000.0
    heat_capacity: 1200.0  # Higher due to organic
    thermal_conductivity: 0.12
    isotherms:
      CO2:
        model: "dual_site_langmuir"
        # Chemical + physical sites
        q1: 2.5  # Chemisorption (amine sites)
        b1_0: 1.0e-5  # Very high affinity
        Q1: 75000.0  # High heat (reaction)
        q2: 1.0  # Physisorption
        b2_0: 5.0e-9
        Q2: 25000.0
        T_ref: 298.15
    CO2_capacity_1bar_25C: 3.0
    CO2_capacity_400ppm_25C: 2.0  # Good for DAC
    CO2_N2_selectivity: 500.0  # Very high due to chemisorption
    heat_of_adsorption_CO2: 70.0
    regen_temperature: 373.15
    desorption_pressure: 0.1
    water_stability: "moderate"
    humidity_effect: "positive"  # CO2 uptake increases with humidity
    cost_usd_kg: 15.0

  TEPA_Alumina:
    full_name: "TEPA-grafted Alumina"
    type: "amine_functionalized"
    support: "gamma-Al2O3"
    amine_loading: 0.30
    surface_area: 180.0
    pore_volume: 0.30
    pore_diameter: 80.0
    density_bulk: 600.0
    density_particle: 1100.0
    heat_capacity: 1100.0
    thermal_conductivity: 0.15
    isotherms:
      CO2:
        model: "dual_site_langmuir"
        q1: 2.0
        b1_0: 8.0e-6
        Q1: 72000.0
        q2: 0.8
        b2_0: 4.0e-9
        Q2: 23000.0
        T_ref: 298.15
    CO2_capacity_1bar_25C: 2.5
    CO2_capacity_400ppm_25C: 1.5
    CO2_N2_selectivity: 400.0
    heat_of_adsorption_CO2: 68.0
    regen_temperature: 378.15
    desorption_pressure: 0.1
    water_stability: "good"
    humidity_effect: "positive"
    cost_usd_kg: 12.0

# Isotherm model equations reference:
# Langmuir:          q = q_sat * b*P / (1 + b*P)
# Sips:              q = q_sat * (b*P)^n / (1 + (b*P)^n)
# Toth:              q = q_sat * b*P / (1 + (b*P)^t)^(1/t)
# Dual-site Langmuir: q = q1*b1*P/(1+b1*P) + q2*b2*P/(1+b2*P)
#
# Temperature dependence: b = b0 * exp(Q/(R*T))
# where R = 8.314 J/(mol*K)
