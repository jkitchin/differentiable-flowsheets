# Rare Earth Element Properties
#
# 15 elements: La, Ce, Pr, Nd, Sm, Eu, Gd, Tb, Dy, Ho, Er, Tm, Yb, Lu, Y.
# Pm is deliberately absent -- it has no stable isotope and no process role.
#
# WHERE THESE NUMBERS COME FROM
# Every field is tagged in the `provenance:` block at the foot of this file,
# and every tag resolves to a full citation in `sources.yaml`. Query it:
#
#     from difflow_ree.provenance import explain
#     explain("elements", "Dy.ionic_radius_pm")
#
# or, for the whole database at once:
#
#     python -m difflow_ree.provenance
#
# Tags used here: [S76] Shannon (1976) ionic radii; [CRC] CRC Handbook;
# [IUPAC] IUPAC atomic weights; [CALC] computed from other tagged fields;
# [EST] INDICATIVE ONLY, no identified source -- this covers every price.

elements:
  La:
    name: Lanthanum
    atomic_number: 57
    atomic_weight: 138.905  # g/mol
    ionic_radius_pm: 103.2  # pm, CN=6, 3+ oxidation
    density: 6.162  # g/cm³
    melting_point: 1193  # K
    oxidation_states: [3]
    group: light
    oxide_formula: La2O3
    oxide_mw: 325.81  # g/mol
    price_usd_kg: 5.0  # approximate, highly variable

  Ce:
    name: Cerium
    atomic_number: 58
    atomic_weight: 140.116
    ionic_radius_pm: 101.0  # Ce³⁺
    ionic_radius_4_pm: 87.0  # Ce⁴⁺ (unique among lanthanides)
    density: 6.770
    melting_point: 1068
    oxidation_states: [3, 4]  # Ce⁴⁺ is stable, enables selective separation
    group: light
    oxide_formula: CeO2
    oxide_mw: 172.12
    price_usd_kg: 2.0

  Pr:
    name: Praseodymium
    atomic_number: 59
    atomic_weight: 140.908
    ionic_radius_pm: 99.0
    density: 6.773
    melting_point: 1208
    oxidation_states: [3]
    group: light
    oxide_formula: Pr6O11
    oxide_mw: 1021.44
    price_usd_kg: 85.0

  Nd:
    name: Neodymium
    atomic_number: 60
    atomic_weight: 144.242
    ionic_radius_pm: 98.3
    density: 7.007
    melting_point: 1297
    oxidation_states: [3]
    group: light
    oxide_formula: Nd2O3
    oxide_mw: 336.48
    price_usd_kg: 120.0  # High demand for NdFeB magnets

  Sm:
    name: Samarium
    atomic_number: 62
    atomic_weight: 150.36
    ionic_radius_pm: 95.8
    density: 7.520
    melting_point: 1345
    oxidation_states: [2, 3]  # Sm²⁺ possible but rare
    group: middle
    oxide_formula: Sm2O3
    oxide_mw: 348.72
    price_usd_kg: 15.0

  Eu:
    name: Europium
    atomic_number: 63
    atomic_weight: 151.964
    ionic_radius_pm: 94.7
    density: 5.243
    melting_point: 1099
    oxidation_states: [2, 3]  # Eu²⁺ is stable, enables selective separation
    group: middle
    oxide_formula: Eu2O3
    oxide_mw: 351.93
    price_usd_kg: 35.0

  Gd:
    name: Gadolinium
    atomic_number: 64
    atomic_weight: 157.25
    ionic_radius_pm: 93.8
    density: 7.895
    melting_point: 1585
    oxidation_states: [3]
    group: middle
    oxide_formula: Gd2O3
    oxide_mw: 362.50
    price_usd_kg: 55.0

  Tb:
    name: Terbium
    atomic_number: 65
    atomic_weight: 158.925
    ionic_radius_pm: 92.3
    density: 8.229
    melting_point: 1629
    oxidation_states: [3, 4]
    group: heavy
    oxide_formula: Tb4O7
    oxide_mw: 747.70
    price_usd_kg: 1500.0  # High value, low abundance

  Dy:
    name: Dysprosium
    atomic_number: 66
    atomic_weight: 162.500
    ionic_radius_pm: 91.2
    density: 8.550
    melting_point: 1680
    oxidation_states: [3]
    group: heavy
    oxide_formula: Dy2O3
    oxide_mw: 373.00
    price_usd_kg: 450.0  # Critical for high-temp magnets

  Y:
    name: Yttrium
    atomic_number: 39
    atomic_weight: 88.906
    ionic_radius_pm: 90.0  # Similar to Ho, behaves as "heavy" REE
    density: 4.469
    melting_point: 1799
    oxidation_states: [3]
    group: heavy  # Chemically similar to heavy REE
    oxide_formula: Y2O3
    oxide_mw: 225.81
    price_usd_kg: 35.0

  # ---------------------------------------------------------------------
  # Ho, Er, Tm, Yb, Lu added for the naphthenic acid / yttrium separation.
  # That separation is Y against Ho/Er/Tm/Yb/Lu, so a database that stops at
  # Dy cannot express it. `extractants.yaml` has carried measured
  # naphthenic-acid coefficients for all five since before they were
  # reachable here.
  #
  # Physical properties are [S76] and [CRC]; see `sources.yaml`.
  # PRICES ARE INDICATIVE ONLY and tagged [EST] -- as are the prices of the
  # original ten. Read the provenance block at the foot of this file before
  # using any price in an economic calculation.
  # ---------------------------------------------------------------------

  Ho:
    name: Holmium
    atomic_number: 67
    atomic_weight: 164.930
    ionic_radius_pm: 90.1  # nearly identical to Y (90.0) -- see note in provenance
    density: 8.795
    melting_point: 1734
    oxidation_states: [3]
    group: heavy
    oxide_formula: Ho2O3
    oxide_mw: 377.86
    price_usd_kg: 70.0

  Er:
    name: Erbium
    atomic_number: 68
    atomic_weight: 167.259
    ionic_radius_pm: 89.0
    density: 9.066
    melting_point: 1802
    oxidation_states: [3]
    group: heavy
    oxide_formula: Er2O3
    oxide_mw: 382.52
    price_usd_kg: 30.0

  Tm:
    name: Thulium
    atomic_number: 69
    atomic_weight: 168.934
    ionic_radius_pm: 88.0
    density: 9.321
    melting_point: 1818
    oxidation_states: [3]
    group: heavy
    oxide_formula: Tm2O3
    oxide_mw: 385.87
    price_usd_kg: 700.0  # thin market; the least reliable price in this file

  Yb:
    name: Ytterbium
    atomic_number: 70
    atomic_weight: 173.045
    ionic_radius_pm: 86.8
    density: 6.965  # anomalously low: divalent character in the metal
    melting_point: 1097  # anomalously low, same reason
    oxidation_states: [2, 3]  # Yb2+ is accessible, as for Sm and Eu
    group: heavy
    oxide_formula: Yb2O3
    oxide_mw: 394.09
    price_usd_kg: 20.0

  Lu:
    name: Lutetium
    atomic_number: 71
    atomic_weight: 174.967
    ionic_radius_pm: 86.1  # smallest of the series
    density: 9.841
    melting_point: 1925
    oxidation_states: [3]
    group: heavy
    oxide_formula: Lu2O3
    oxide_mw: 397.93
    price_usd_kg: 700.0

# Element groups for process design
groups:
  light:
    elements: [La, Ce, Pr, Nd]
    description: "Light rare earths - easier to extract, lower K values"

  middle:
    elements: [Sm, Eu, Gd]
    description: "Middle rare earths - intermediate behavior"

  heavy:
    elements: [Tb, Dy, Ho, Er, Tm, Yb, Lu, Y]
    description: "Heavy rare earths + Y - higher K values, more valuable"

# Lanthanide contraction factor
# Ionic radius decreases ~0.5 pm per atomic number increase
lanthanide_contraction:
  description: "Systematic decrease in ionic radius across lanthanide series"
  effect: "Heavier REE have higher charge density, stronger extraction"

# ---------------------------------------------------------------------------
# PROVENANCE
#
# One rule per field. `pattern` is a dotted path into this file with `*` as a
# single-segment wildcard; the MOST SPECIFIC matching rule wins (a rule with
# more literal segments beats one with more wildcards; ties break on length).
# `source` is a key in sources.yaml. Resolve with:
#
#     python -m difflow_ree.provenance
#     >>> from difflow_ree.provenance import explain
#     >>> explain("elements", "elements.Dy.ionic_radius_pm")
#
# Every leaf below `elements:` must match a rule; the test suite enforces it,
# so a new field added without a rule fails CI rather than passing silently.
# ---------------------------------------------------------------------------
provenance:
  rules:
    # --- definitional -----------------------------------------------------
    - {pattern: "elements.*.name",             source: DEF}
    - {pattern: "elements.*.atomic_number",    source: DEF}
    - {pattern: "elements.*.oxidation_states", source: DEF,
       note: "Common states in hydrometallurgical process conditions. Ce(IV)
              and Eu(II) are real and matter, but are handled in the redox
              modules, not here."}
    - {pattern: "elements.*.oxide_formula",    source: DEF}

    # --- standard reference data -----------------------------------------
    - {pattern: "elements.*.atomic_weight",  source: IUPAC,
       locus: "Standard atomic weights 2021"}
    - {pattern: "elements.*.ionic_radius_pm", source: S76,
       locus: "Table 1; coordination number 6, oxidation state 3+"}
    - {pattern: "elements.*.ionic_radius_4_pm", source: S76,
       locus: "Table 1; coordination number 6, oxidation state 4+",
       note: "Ce only. Ce(IV) is markedly smaller than Ce(III) (87 vs 101 pm),
              which is why oxidative Ce removal ahead of the cascade works at
              all, and is used by the redox modules rather than here."}
    - {pattern: "elements.*.density",        source: CRC,
       locus: "Physical Constants of Inorganic Compounds; g/cm3 at 298 K"}
    - {pattern: "elements.*.melting_point",  source: CRC,
       locus: "Physical Constants of Inorganic Compounds; degrees C"}

    # --- computed ---------------------------------------------------------
    - {pattern: "elements.*.oxide_mw", source: CALC,
       note: "n_M * atomic_weight + n_O * 15.999, from this file's own
              atomic_weight and oxide_formula. Reproduced to within
              0.02 g/mol by test_oxide_mw_is_consistent."}

    # --- no source --------------------------------------------------------
    - {pattern: "elements.*.price_usd_kg", source: EST,
       note: "*** NOT A SOURCED PRICE. *** Indicative oxide values of the
              order that circulated in the late 2010s. REE prices move by
              factors of several within a year and the thin-market elements
              (Tm, Lu) have no public price at all. Any economic conclusion
              that survives only at these numbers is an artifact."}

    # --- difflow convention ----------------------------------------------
    - {pattern: "elements.*.group",     source: CONV}
    - {pattern: "groups.*.elements",    source: CONV}
    - {pattern: "groups.*.description", source: CONV}
    - {pattern: "lanthanide_contraction.*", source: S76,
       note: "Prose restatement of the trend visible in the ionic_radius_pm
              column above. Carries no numbers."}
