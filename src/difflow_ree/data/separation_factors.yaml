# Separation Factors for REE Pairs
#
# Separation Factor SF(i/j) = D_i / D_j
#   where D = distribution coefficient
#
# SF > 1 means element i extracts preferentially
# SF close to 1 means difficult separation (many stages needed)
#
# THE NUMBERS ARE NOT IN THIS FILE (#265)
# ---------------------------------------
# This file used to tabulate an SF for every pair, authored by hand. So does
# `extractants.yaml`, in a different form: log10(D) = a + b*pH + c*pH^2 gives
# any pair's SF by subtraction. Two hand-tuned descriptions of the same
# physics, written at different times and never reconciled, and they disagreed
# by up to 8x -- the coefficients running 1.3-2.8x high on 24 of 27 pairs, and
# the three Y/Dy pairs running 4-8x LOW, which is a disagreement about that
# pair rather than a calibration offset. A user got a different answer
# depending on which API they reached for, with nothing warning them.
#
# Neither set was measured, so there was no right one to keep. What settles it
# is that `ph_coefficients` is what every unit operation actually computes D
# from: a separation factor derived from it describes the simulator, and one
# authored here describes nothing else in the package. So this file now
# declares WHICH pairs are worth reporting and AT WHAT CONDITIONS, and
# `SeparationFactorDatabase` computes the values from the coefficient block of
# the same extractant, through the same `get_separation_factor` the rest of
# difflow_ree uses.
#
# A pair whose value is a mapping rather than a list entry is an authored
# override, used as given. There are none here on purpose: an override is a
# claim that a measured number exists which the coefficients cannot reproduce,
# and no such number ships with this package today. Anything added here needs
# a citation beside it.
#
# `conditions` is not decoration -- it is the point at which the coefficients
# are evaluated, so changing it changes every factor below it.
#
# WHERE Y SITS IS A PROPERTY OF THE EXTRACTANT, NOT OF YTTRIUM
# -----------------------------------------------------------
# Y(III) has no f electrons, so its position in an extraction series is not
# fixed by the lanthanide contraction the way a lanthanide's is. It moves,
# by a lot, with the donor:
#
#   PC88A / EHEHPA       Y extracts BETWEEN Dy and Ho -- beta(Y/Dy) > 1.
#                        Measured here: 3.14, from Tanaka (2021), whose own
#                        printed log Ke has Y at 2.24 against Dy's 1.67.
#   D2EHPA               Y again sits in the heavy group, near Ho/Er.
#   Cyanex 272           Y falls a long way DOWN the series, out among the
#                        light-middle lanthanides. This is the well-known
#                        anomaly that makes Cyanex 272 the reagent of choice
#                        for pulling Y out of a heavy concentrate.
#
# So a single sentence about "where Y goes" is wrong by construction, and the
# one that used to sit on the D2EHPA Y_Dy line below was doing exactly that.
#
# Read the derived Y_Dy factors with that in mind AND with the caveat in
# extractants.yaml: only PC88A's coefficients are measured. D2EHPA's and
# Cyanex272's are hand-tuned, and both of them put Y BELOW Dy -- right for
# Cyanex 272, backwards for D2EHPA. Fixing that needs a D2EHPA dataset, which
# `dcdb` does not have yet; it is not fixable by editing this file, because
# this file no longer holds any separation factors (#265, #270).

# Pairs to report, by extractant.
# Format: heavier_lighter (SF > 1 means the heavier one extracts better)
separation_factors:
  D2EHPA:
    # At pH 3.0, 25°C, 0.5M D2EHPA
    conditions:
      pH: 3.0
      temperature_K: 298
      concentration_M: 0.5

    adjacent_pairs:
      - Ce_La   # Ce/La
      - Pr_Ce   # Pr/Ce
      - Nd_Pr   # Nd/Pr - difficult separation
      - Sm_Nd   # Sm/Nd - gap between light and middle
      - Eu_Sm   # Eu/Sm
      - Gd_Eu   # Gd/Eu
      - Tb_Gd   # Tb/Gd - gap between middle and heavy
      - Dy_Tb   # Dy/Tb
      - Y_Dy   # Y/Dy - see the note on Y in the header. The value this
               # derives (0.21) is a HAND-TUNED record's opinion, and it
               # puts Y below Dy, which is backwards for D2EHPA.

    # Non-adjacent pairs (useful for group separations)
    group_pairs:
      - Nd_La   # Light REE spread
      - Sm_La   # Light to middle
      - Dy_La   # Light to heavy
      - Dy_Nd   # Middle range
      - Gd_Nd   # Nd to Gd

  PC88A:
    # At pH 1.33, 25 C, 0.5 M PC88A (as the dimer).
    #
    # It was pH 3.5 until #270, which is now outside this record's
    # `valid_ph_range` of [0.1, 2.5] -- the span Tanaka (2021) actually
    # measured -- so every factor below it was an extrapolation, and loading
    # the database warned about it. 1.33 and 0.5 M are the record's own
    # `reference_pH` and `reference_concentration`, i.e. the point its fit is
    # centred on.
    #
    # It happens not to matter to the NUMBERS. Since #270 every element on
    # this record shares one slope, b = 3, the stoichiometric value the
    # mass-action equilibrium requires and the value T21 fits its own data
    # with. With a common slope, log10 beta = a_i - a_j exactly, so every
    # factor in this block is independent of pH, of temperature and of
    # extractant concentration. Moving the conditions moves D, not beta.
    # (Verified: Y_Dy is 3.13545086914 at pH 1.0 and at pH 2.0.)
    conditions:
      pH: 1.33
      temperature_K: 298
      concentration_M: 0.5

    adjacent_pairs:
      - Ce_La
      - Pr_Ce
      - Nd_Pr   # 2.14, and Pr is one of the five INTERPOLATED elements
                # on this record (T21 measured La/Nd/Sm/Dy/Y only), so
                # it is the weakest kind of entry here. It used to claim
                # to beat D2EHPA; on the shipped records it does not
                # (D2EHPA derives 2.51) -- but D2EHPA's is hand-tuned,
                # so that comparison means nothing either way.
      - Sm_Nd
      - Eu_Sm
      - Gd_Eu
      - Tb_Gd
      - Dy_Tb
      - Y_Dy

    group_pairs:
      - Nd_La
      - Sm_La
      - Dy_La
      - Dy_Nd
      - Gd_Nd

  Cyanex272:
    # At pH 5.0, 25°C, 0.3M Cyanex 272
    conditions:
      pH: 5.0
      temperature_K: 298
      concentration_M: 0.3

    adjacent_pairs:
      - Ce_La
      - Pr_Ce
      - Nd_Pr
      - Sm_Nd
      - Eu_Sm
      - Gd_Eu
      - Tb_Gd
      - Dy_Tb
      - Y_Dy

    group_pairs:
      - Nd_La
      - Sm_La
      - Dy_La
      - Dy_Nd
      - Gd_Nd

  TBP:
    # At [NO3-] = 3M, 25°C, 30% TBP
    conditions:
      nitrate_M: 3.0
      temperature_K: 298
      concentration_vol_pct: 30

    adjacent_pairs:
      - Ce_La
      - Pr_Ce
      - Nd_Pr
      - Sm_Nd
      - Eu_Sm
      - Gd_Eu
      - Tb_Gd
      - Dy_Tb
      - Y_Dy

    group_pairs:
      - Nd_La
      - Sm_La
      - Dy_La
      - Dy_Nd
      - Gd_Nd

# STAGES FOR 99% PURITY ARE DERIVED TOO (#270)
# -------------------------------------------
# There used to be a `stages_for_99_purity:` table here, 18 hand-authored
# integers for D2EHPA and PC88A. It went the way the separation factors went
# in #265, and for the same reason plus one more:
#
#   * It was a second description of something the package already computes.
#     Stages follow from beta by Fenske, and beta is now derived, so the
#     table could only ever be a snapshot of betas that had since moved.
#   * It matched NO beta in the package -- not the coefficients', not the
#     deleted table's. Solving Fenske backwards out of its own entries gives
#     betas spanning 1.17-3.15 on the 99/99 convention, or 1.08-1.78 on the
#     one-product one, in an order that tracks neither set. Its two comments
#     ("Very difficult" on Nd/Pr, "Much better than D2EHPA") disagreed with
#     both descriptions as well.
#   * Its Y_Dy entries were undefined: at the coefficients' beta of 0.21 the
#     pair separates in the OTHER direction, and 40 stages of it is not a
#     statement about anything.
#
# `SeparationFactorDatabase.get_stages_needed` now computes it, from the same
# derived beta as everything else:
#
#     N_min = 2 ln(99) / |ln beta|
#
# Fenske for a 99%/99% split of an equimolar binary. It is a THERMODYNAMIC
# FLOOR at total reflux -- a real cascade at a finite solvent ratio needs
# several times more -- and it inherits every weakness of the beta beneath
# it. An authored value, via `add_pair(..., stages_99=...)` or a mapping in
# your own YAML, still wins.

# Temperature effects on separation factor
# SF generally decreases slightly with temperature
temperature_sensitivity:
  description: "d(ln SF)/dT is typically -0.005 to -0.01 K⁻¹"
  typical_coefficient: -0.007  # K⁻¹

# pH effects on separation factor
# SF can vary significantly with pH
ph_sensitivity:
  description: "SF may increase or decrease with pH depending on speciation"
  note: "Use pH-dependent D values from extractants.yaml for accurate calculation"

# Loading effects
# At high REE loading, SF tends to decrease
loading_effects:
  description: "SF decreases as extractant approaches saturation"
  typical_decrease_pct: 20  # % decrease at 80% loading

# Industrial separation sequences
# Recommended order for full REE separation
industrial_sequences:
  bastnasite_concentrate:
    description: "Typical processing of bastnasite (Ce-La-Nd rich)"
    steps:
      - "Remove Ce by oxidation (Ce4+ precipitation)"
      - "D2EHPA: Separate heavy REE from light"
      - "PC88A: Separate Nd from Pr"
      - "Further splits as needed"

  monazite_concentrate:
    description: "Typical processing of monazite (Th-U bearing)"
    steps:
      - "Caustic crack or acid leach"
      - "Remove radioactive elements"
      - "Group separation: light / middle / heavy"
      - "Individual element separation"

  ion_adsorption_clay:
    description: "South China ion-adsorption deposits (heavy REE rich)"
    steps:
      - "Ammonium sulfate leach"
      - "Oxalate precipitation"
      - "Solvent extraction separation"

# ---------------------------------------------------------------------------
# PROVENANCE
#
# `pattern` is a dotted path with `*` as a single-segment wildcard; the MOST
# SPECIFIC matching rule wins; `source` is a key in sources.yaml. Resolve with
# `from difflow_ree.provenance import explain, audit`.
#
# *** THIS FILE NO LONGER CARRIES SEPARATION FACTORS. ***
# It used to, and they disagreed with extractants.yaml by up to 8x; the
# header at the top of this file records that disagreement and why it was
# settled the way it was (#265). What is left here is a SELECTION -- which
# pairs to report, at which conditions -- so the entries below are tagged
# for what they now are, and the factors themselves inherit the provenance
# of the `ph_coefficients` they are computed from.
# ---------------------------------------------------------------------------
provenance:
  rules:
    # The lists are a selection of pairs, not values: `adjacent_pairs` and
    # `group_pairs` name which pairs to report and the factor is computed
    # from the extractant's own `ph_coefficients` (#265). So the provenance
    # of a reported number is that of the coefficient block, in
    # extractants.yaml, and what is tagged here is the choice of pairs.
    - {pattern: "separation_factors.*.adjacent_pairs", source: CALC,
       note: "Which adjacent pairs to report. Each factor is derived as
              D_i/D_j from extractants.yaml:ph_coefficients at the
              `conditions` in this block -- see that file for the
              provenance of the numbers themselves."}
    - {pattern: "separation_factors.*.group_pairs", source: CALC,
       note: "Which non-adjacent (group-separation) pairs to report;
              derived the same way as adjacent_pairs."}
    # An authored override is written as a mapping rather than a list entry.
    # There are none today, on purpose. Should one be added it lands here
    # rather than going untagged -- and SF_APPROX is the worst assumption,
    # which is the right default for a number with no citation beside it.
    - {pattern: "separation_factors.*.adjacent_pairs.*", source: SF_APPROX}
    - {pattern: "separation_factors.*.group_pairs.*",    source: SF_APPROX}
    - {pattern: "separation_factors.*.conditions.*",     source: CONV,
       note: "The point at which the coefficients are evaluated, so
              changing one of these changes every factor in its block."}

    # `stages_for_99_purity` is no longer a key in this file (#270); the
    # rule stays so that a caller's own YAML, or a value added through
    # `add_pair(..., stages_99=...)`, is still tagged rather than untagged.
    # A number that appears there is AUTHORED -- the derived one is computed
    # on access and inherits the provenance of the beta it came from.
    - {pattern: "stages_for_99_purity.*.*", source: SF_APPROX,
       note: "An authored stage count, overriding the Fenske minimum
              N_min = 2 ln(99)/|ln beta| that `get_stages_needed` derives
              from the extractant's own coefficients. Nothing ships here."}

    - {pattern: "temperature_sensitivity.*", source: SF_APPROX}
    - {pattern: "ph_sensitivity.*",          source: SF_APPROX}
    - {pattern: "loading_effects.*",         source: SF_APPROX}
    - {pattern: "industrial_sequences.*.*",  source: CONV,
       note: "Prose descriptions of the conventional processing routes.
              No numbers."}
