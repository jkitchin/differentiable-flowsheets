# Separation Factors for REE Pairs
#
# Separation Factor SF(i/j) = D_i / D_j
#   where D = distribution coefficient
#
# SF > 1 means element i extracts preferentially
# SF close to 1 means difficult separation (many stages needed)
#
# THE NUMBERS ARE NOT IN THIS FILE (#265)
# ---------------------------------------
# This file used to tabulate an SF for every pair, authored by hand. So does
# `extractants.yaml`, in a different form: log10(D) = a + b*pH + c*pH^2 gives
# any pair's SF by subtraction. Two hand-tuned descriptions of the same
# physics, written at different times and never reconciled, and they disagreed
# by up to 8x -- the coefficients running 1.3-2.8x high on 24 of 27 pairs, and
# the three Y/Dy pairs running 4-8x LOW, which is a disagreement about that
# pair rather than a calibration offset. A user got a different answer
# depending on which API they reached for, with nothing warning them.
#
# Neither set was measured, so there was no right one to keep. What settles it
# is that `ph_coefficients` is what every unit operation actually computes D
# from: a separation factor derived from it describes the simulator, and one
# authored here describes nothing else in the package. So this file now
# declares WHICH pairs are worth reporting and AT WHAT CONDITIONS, and
# `SeparationFactorDatabase` computes the values from the coefficient block of
# the same extractant, through the same `get_separation_factor` the rest of
# difflow_ree uses.
#
# A pair whose value is a mapping rather than a list entry is an authored
# override, used as given. There are none here on purpose: an override is a
# claim that a measured number exists which the coefficients cannot reproduce,
# and no such number ships with this package today. Anything added here needs
# a citation beside it.
#
# `conditions` is not decoration -- it is the point at which the coefficients
# are evaluated, so changing it changes every factor below it.

# Pairs to report, by extractant.
# Format: heavier_lighter (SF > 1 means the heavier one extracts better)
separation_factors:
  D2EHPA:
    # At pH 3.0, 25°C, 0.5M D2EHPA
    conditions:
      pH: 3.0
      temperature_K: 298
      concentration_M: 0.5

    adjacent_pairs:
      - Ce_La   # Ce/La
      - Pr_Ce   # Pr/Ce
      - Nd_Pr   # Nd/Pr - difficult separation
      - Sm_Nd   # Sm/Nd - gap between light and middle
      - Eu_Sm   # Eu/Sm
      - Gd_Eu   # Gd/Eu
      - Tb_Gd   # Tb/Gd - gap between middle and heavy
      - Dy_Tb   # Dy/Tb
      - Y_Dy   # Y/Dy - Y behaves between Dy and Ho

    # Non-adjacent pairs (useful for group separations)
    group_pairs:
      - Nd_La   # Light REE spread
      - Sm_La   # Light to middle
      - Dy_La   # Light to heavy
      - Dy_Nd   # Middle range
      - Gd_Nd   # Nd to Gd

  PC88A:
    # At pH 3.5, 25°C, 0.5M PC88A
    conditions:
      pH: 3.5
      temperature_K: 298
      concentration_M: 0.5

    adjacent_pairs:
      - Ce_La
      - Pr_Ce
      - Nd_Pr   # Better Nd/Pr separation than D2EHPA
      - Sm_Nd
      - Eu_Sm
      - Gd_Eu
      - Tb_Gd
      - Dy_Tb
      - Y_Dy

    group_pairs:
      - Nd_La
      - Sm_La
      - Dy_La
      - Dy_Nd
      - Gd_Nd

  Cyanex272:
    # At pH 5.0, 25°C, 0.3M Cyanex 272
    conditions:
      pH: 5.0
      temperature_K: 298
      concentration_M: 0.3

    adjacent_pairs:
      - Ce_La
      - Pr_Ce
      - Nd_Pr
      - Sm_Nd
      - Eu_Sm
      - Gd_Eu
      - Tb_Gd
      - Dy_Tb
      - Y_Dy

    group_pairs:
      - Nd_La
      - Sm_La
      - Dy_La
      - Dy_Nd
      - Gd_Nd

  TBP:
    # At [NO3-] = 3M, 25°C, 30% TBP
    conditions:
      nitrate_M: 3.0
      temperature_K: 298
      concentration_vol_pct: 30

    adjacent_pairs:
      - Ce_La
      - Pr_Ce
      - Nd_Pr
      - Sm_Nd
      - Eu_Sm
      - Gd_Eu
      - Tb_Gd
      - Dy_Tb
      - Y_Dy

    group_pairs:
      - Nd_La
      - Sm_La
      - Dy_La
      - Dy_Nd
      - Gd_Nd

# Stages required for 99% purity
# Approximate stages needed for adjacent pair separation to 99% purity
# Using counter-current extraction at S/F = 1.5x minimum
stages_for_99_purity:
  D2EHPA:
    Ce_La: 15
    Pr_Ce: 20
    Nd_Pr: 60   # Very difficult
    Sm_Nd: 10
    Eu_Sm: 25
    Gd_Eu: 30
    Tb_Gd: 15
    Dy_Tb: 20
    Y_Dy: 40

  PC88A:
    Ce_La: 12
    Pr_Ce: 15
    Nd_Pr: 25   # Much better than D2EHPA
    Sm_Nd: 8
    Eu_Sm: 22
    Gd_Eu: 25
    Tb_Gd: 12
    Dy_Tb: 18
    Y_Dy: 35

# Temperature effects on separation factor
# SF generally decreases slightly with temperature
temperature_sensitivity:
  description: "d(ln SF)/dT is typically -0.005 to -0.01 K⁻¹"
  typical_coefficient: -0.007  # K⁻¹

# pH effects on separation factor
# SF can vary significantly with pH
ph_sensitivity:
  description: "SF may increase or decrease with pH depending on speciation"
  note: "Use pH-dependent D values from extractants.yaml for accurate calculation"

# Loading effects
# At high REE loading, SF tends to decrease
loading_effects:
  description: "SF decreases as extractant approaches saturation"
  typical_decrease_pct: 20  # % decrease at 80% loading

# Industrial separation sequences
# Recommended order for full REE separation
industrial_sequences:
  bastnasite_concentrate:
    description: "Typical processing of bastnasite (Ce-La-Nd rich)"
    steps:
      - "Remove Ce by oxidation (Ce4+ precipitation)"
      - "D2EHPA: Separate heavy REE from light"
      - "PC88A: Separate Nd from Pr"
      - "Further splits as needed"

  monazite_concentrate:
    description: "Typical processing of monazite (Th-U bearing)"
    steps:
      - "Caustic crack or acid leach"
      - "Remove radioactive elements"
      - "Group separation: light / middle / heavy"
      - "Individual element separation"

  ion_adsorption_clay:
    description: "South China ion-adsorption deposits (heavy REE rich)"
    steps:
      - "Ammonium sulfate leach"
      - "Oxalate precipitation"
      - "Solvent extraction separation"
