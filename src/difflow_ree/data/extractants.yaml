    # ======================================================================
    # (2c) LITERATURE-DERIVED -- Cyanex272 pH block, refitted for #270
    #
    # Two sources that measure different things: L14 for the LEVEL (six
    # Pr/Nd rows with MEASURED equilibrium pH, in kerosene) and ZL93 via Z1
    # Table 4.25 for the SHAPE (fifteen elements, but the extractant charge
    # is not printed anywhere, so it can set no level). LD19 Fig. 4 is a
    # cross-check on the shape and supplies no shipped number.
    # ======================================================================
    - {pattern: "extractants.Cyanex272.ph_coefficients.*.*",  source: CALC}
    - {pattern: "extractants.Cyanex272.ph_coefficients.*.a",  source: CALC,
       note: "DERIVED, not measured. LEVEL: a_Nd = -6.4041, a one-parameter
              least-squares fit over L14's six charges (rms 0.215; the two
              rows bracketing the reference charge give -6.4227 and -6.4139).
              SHAPE: ZL93's separation factors against La, applied relative
              to Nd. The join is testable, because L14 measures Pr too:
              ZL93 gives beta(Nd/Pr) = 1.295 against L14's measured 1.51-1.86,
              so the shipped a_Pr sits 0.093 decades above L14's direct
              -6.6091. Sm is two steps from Nd across Pm; Y is printed
              between Ho and Er. See the record for the full arithmetic and
              for why n = 3 is imposed against L14's best-fit 2.40."}
    - {pattern: "extractants.Cyanex272.ph_coefficients.Nd.a", source: L14,
       locus: "Tables 1 and 2, single-extractant rows",
       note: "The element whose ABSOLUTE level is measured. L14 reports both
              E% and the MEASURED equilibrium pH at the same six charges,
              which is what makes this a level rather than an inference --
              and is also the dataset that validates Z1 Eq. (4.12) to within
              0.17 pH units, the warrant for using that balance on D2EHPA."}
    - {pattern: "extractants.Cyanex272.ph_coefficients.*.b",  source: Z1,
       locus: "Eqs. (4.27)-(4.31), p. 124; Sec. 4.3.1, p. 138",
       note: "PINNED at 3.0, the stoichiometric slope this record declares,
              and the model ZL93's purified HBTMPP-octane-HCl system follows.
              NOT UNCONTESTED: L14 proposes RE3+ + Cl- + 2(H2A2) =
              REClA2.2HA + 2H+ for single Cyanex 272 in chloride, i.e. two
              protons and a chloride. b and the concentration exponent cannot
              be separated from L14's series (r = -0.992 between pH_eq and
              lg[HA]), so that proposal is recorded rather than adopted."}
    - {pattern: "extractants.Cyanex272.ph_coefficients.*.c",  source: CONV,
       note: "Zero by declaration. The old blanket 0.005 was hand-tuned."}
    - {pattern: "extractants.Cyanex272.ph_coefficients.*.d",  source: CONV,
       note: "Zero because the temperature term lives in
              temperature_coefficients, not because a temperature dependence
              was measured to be absent."}
    - {pattern: "extractants.Cyanex272.valid_ph_range",       source: L14,
       locus: "Table 2, single Cyanex 272 column",
       note: "[1.5, 3.5]. The lower bound is 0.3 units below L14's lowest
              MEASURED equilibrium pH (1.82); all six of its rows equilibrate
              between 1.82 and 2.35, which is BELOW the old window's lower
              bound of 3.0 entirely. The upper bound sits above ZL93's
              pH 2.8 and at the point where D(La) reaches 243, i.e.
              quantitative extraction of the least extracted element. The
              old 7.0 put D(La) at 1e13. Cyanex 272 IS run near pH 5 in
              practice, but saponified and heavily loaded -- that is what
              solve_free_extractant and the saponification block are for,
              not an extrapolation of this correlation."}
    - {pattern: "extractants.Cyanex272.reference_pH",         source: L14,
       locus: "Table 2, single Cyanex 272 column",
       note: "2.0, between the mean of L14's six measured equilibrium pH
              values (1.977) and this block's pH50 for Nd (2.135), and
              inside every source's window. Everything derived from this
              correlation is evaluated here (#268). Was 5.0, outside the new
              window entirely."}

