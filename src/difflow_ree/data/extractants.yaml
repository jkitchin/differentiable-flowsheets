# Extractant Properties and Distribution Correlations
#
# EXTRACTION MECHANISM (#195)
# Every extractant declares a normalized `mechanism:` key. It is the mechanism,
# not the code, that decides which coefficient block drives D:
#
#   mechanism: cation_exchange -> driven by `ph_coefficients`
#     RE3+ + p(HA)2 <-> RE(HA2)p + p H+
#   mechanism: solvating       -> driven by `nitrate_coefficients`
#     RE(NO3)3 + m S <-> RE(NO3)3.mS   (no protons released)
#
# The mapping from the free-form `type:` field is:
#   acidic_phosphoric / acidic_phosphonic / acidic_phosphinic /
#   acidic_carboxylic  -> cation_exchange
#   solvating_neutral  -> solvating
# `mechanism:` is stated explicitly on every record so it is data rather than
# an inference; difflow_ree.database.normalize_mechanism reproduces the mapping
# for records that omit it.
#
# CATION-EXCHANGE MODEL (`ph_coefficients`):
#   log10(D) = a + b*pH + c*pH^2 + d*(1/T - 1/Tref)
#
# where:
#   D = [REE]_org / [REE]_aq
#   pH = -log10([H+])       <- CONCENTRATION SCALE, not the activity scale (#194)
#   T = temperature (K)
#
# pH SCALE AND ACTIVITY CONVENTION (#194)
# `pH` here is -log10 of the free proton *concentration*. These are conditional
# correlations: the a/b/c coefficients are fitted at the ionic strength of the
# reported experiments and already absorb the activity coefficients at that
# ionic strength. Consequently:
#   - The defensible default is NO activity correction at all
#     (REEDistribution(..., ionic_strength=None)), i.e. a conditional constant
#     used at the ionic strength it was fitted at. This is the right choice for
#     a 2-4 M chloride leach liquor.
#   - If a correction to a different ionic strength is requested, it must be
#     gamma_RE / gamma_H**p on the concentration scale, with p =
#     stoichiometry.protons_released, NOT gamma_RE alone. Davies is only valid
#     for I < 0.5 M and difflow_ree reports outside that range.
#   - Davies does not merely lose accuracy above 0.5 M. Its bracket
#     f(I) = sqrt(I)/(1+sqrt(I)) - 0.3 I changes SIGN at I = 1.940363884733242 M
#     (the root of 0.3 I + 0.3 sqrt(I) - 1 = 0), above which
#     gamma_RE/gamma_H**3 = 10**(-6 A f) exceeds 1 and the correction
#     MULTIPLIES D: 0.228 at I = 0.1 M, 0.245 at 1.0 M, 6.49 at 3.0 M, 42.5 at
#     4.0 M. difflow_ree therefore clamps the ionic strength it feeds the
#     activity model at the model's documented limit, so the correction
#     saturates rather than inverting, unless the caller explicitly passes
#     extrapolate_activity_model=True (#194).
#
# SOLVATING MODEL (`nitrate_coefficients`):
#   log10(D) = a + b*log10([NO3-]/reference_nitrate)
#              + c*log10([NO3-]/reference_nitrate)^2
#              + d*(1/T - 1/Tref)
#
# so `a` is log10(D) AT the reference nitrate concentration and `b` is the
# nitrate slope d log10(D) / d log10([NO3-]). There is no pH term.
#
# PROVENANCE OF THE COEFFICIENTS -- TWO DIFFERENT KINDS OF NUMBER
#
# This file now contains coefficient blocks of two DIFFERENT provenances. They
# must not be mistaken for one another:
#
#   (1) HAND-TUNED, NO SOURCE  -- the `ph_coefficients` and
#       `temperature_coefficients` of D2EHPA, PC88A and Cyanex272.
#       These were chosen to give plausible-looking D values:
#         - At pH 2.0: D typically 0.001-0.1 for LREE, 0.1-1 for HREE
#         - At pH 3.0: D typically 0.05-1 for LREE, 1-30 for HREE
#         - At pH 4.0: D typically 1-20 for LREE, 50-500 for HREE
#         - Separation factors between adjacent REE: 1.5-4
#       No fit, dataset or table is recorded for any of them anywhere in this
#       repository. They are illustrative, not measured. Do not cite them, do
#       not regress equilibrium constants against them, and do not use them
#       for design numbers.
#
#   (2) LITERATURE-DERIVED    -- TBP's `nitrate_coefficients` and
#       `temperature_coefficients` ONLY.
#       Refitted from named, retrievable primary sources; the fit basis, the
#       correction arithmetic, the per-element provenance (measured vs
#       interpolated vs assumed), the validity window and the known gaps are
#       all written out on the TBP record below. Read that block before using
#       any TBP number.
#
# Nothing else in this file is literature-derived. In particular, TBP's
# nitrate block being fitted says NOTHING about the three acidic extractants.
#
# Background reading behind the hand-tuned blocks (consulted qualitatively;
# NOT the source of any specific number here):
# - Gupta & Krishnamurthy (2005) Extractive Metallurgy of Rare Earths
# - Xie, Zhang, Dreisinger & Doyle (2014) Miner. Eng. 56, 10
# - Peppard et al. (1957) J. Inorg. Nucl. Chem.

# SAPONIFICATION (#197)
#
# Every acidic (cation-exchange) record below carries a `saponification:`
# block. Industrial rare-earth circuits neutralize 30 to 50% of the acidic
# extractant BEFORE it enters the cascade,
#
#     HA_org + NaOH -> NaA_org + H2O
#
# so extraction is a counter-ion exchange rather than a proton exchange:
#
#     RE3+ + 3 NaA_org <-> RE(A)3_org + 3 Na+
#
# `degree` is a DEFAULT OPERATING POINT, not a property of the molecule: it is
# the primary manipulated variable of the circuit, and a Saponifier, a section
# or an optimizer overrides it. 0.30-0.50 is the industrial range; 0.35 is used
# here as the mid-range default. `counter_ion` decides which effluent the plant
# produces -- ammonium nitrogen (NH4) or a saline raffinate (Na, Mg).
#
# `log10_K: null` means "calibrate at build time", exactly as it does in
# reaction_networks.yaml: NO MEASURED SAPONIFICATION CONSTANT SHIPS HERE.
# difflow_ree.equilibrium.saponification.saponification_log_K inverts
#
#     K = S/(1-S) * [H+]/[M+]
#
# at the stated `reference_pH` and `reference_counter_ion`, so the constant is
# a restatement of the declared degree at a declared condition rather than a
# number from a paper. Supply a measured constant for design numbers.
#
# Background: Banda, Jeon & Lee, J. Ind. Eng. Chem. 21 (2015) 436,
# doi:10.1016/j.jiec.2014.03.002 (Nd/Pr separation with saponified PC-88A);
# Liao et al., J. Rare Earths 31 (2013) 331, doi:10.1016/S1002-0721(12)60281-6
# (clean separation technologies and the effluent consequences of the
# saponification route). Consulted qualitatively for the 30-50% range and the
# effluent argument; NOT the source of any number in this file.

extractants:
  D2EHPA:
    full_name: "Di-2-ethylhexyl phosphoric acid"
    formula: "(C8H17O)2PO2H"
    molecular_weight: 322.43  # g/mol
    density: 0.975  # g/mL
    pKa: 3.24  # in aqueous
    type: acidic_phosphoric
    mechanism: cation_exchange  # normalized from type (#195)
    diluents: [kerosene, n-heptane, Shellsol_D70]
    typical_concentration: 0.5  # M in organic phase

    # Extraction mechanism: REE³⁺ + 3(HA)₂ ⇌ REE(HA₂)₃ + 3H⁺
    # basis: dimer -> extractant_molecules counts (HA)₂ dimers, so the
    # capacity in monomer equivalents is 3 * 2 = 6 mol D2EHPA per mol REE
    # (max_loading = 1/6). D2EHPA is dimeric in aliphatic diluents at the low
    # to moderate loadings these correlations cover; the monomeric (m = 3)
    # stoichiometry is reported at high loading and in polar diluents. See #191.
    stoichiometry:
      protons_released: 3
      extractant_molecules: 3  # as dimers
      basis: dimer

    # pH correlation coefficients: log10(D) = a + b*pH + c*pH²
    # Valid range: pH 1-5, T = 298K, [D2EHPA] = 0.5M
    #
    # EXPECTED D VALUES at pH 3.0:
    #   La: 0.05, Ce: 0.12, Pr: 0.30, Nd: 0.70
    #   Sm: 2.5, Eu: 4.5, Gd: 8.0, Tb: 14, Dy: 25, Y: 10
    #
    # Element-specific pH slopes create pH-dependent separation factors
    # The slope (b) increases slightly across the series (lanthanide contraction effect)
    ph_coefficients:
      La: {a: -8.50, b: 2.30, c: 0.010, d: 0.0}
      Ce: {a: -8.25, b: 2.35, c: 0.010, d: 0.0}
      Pr: {a: -7.95, b: 2.40, c: 0.010, d: 0.0}
      Nd: {a: -7.70, b: 2.45, c: 0.010, d: 0.0}
      Sm: {a: -7.35, b: 2.55, c: 0.010, d: 0.0}
      Eu: {a: -7.18, b: 2.60, c: 0.010, d: 0.0}
      Gd: {a: -7.05, b: 2.65, c: 0.010, d: 0.0}
      Tb: {a: -6.90, b: 2.72, c: 0.010, d: 0.0}
      Dy: {a: -6.78, b: 2.80, c: 0.010, d: 0.0}
      Y:  {a: -7.00, b: 2.65, c: 0.010, d: 0.0}

    # Temperature correction: add d*(1/T - 1/298.15) to log(D)
    #
    # OPEN QUESTION (unresolved, numbers deliberately unchanged). The comment
    # line that used to sit here said "extraction is exothermic, D decreases
    # with T", but under log10 D = ... + d*(1/T - 1/Tref) with
    # d = -dH/(2.303 R), a NEGATIVE d is an ENDOTHERMIC dH -- these values
    # imply dH = +29 to +46 kJ/mol, i.e. D *rising* with T, the opposite of
    # the sentence. That may or may not be wrong: acidic organophosphorus REE
    # extraction is reported both ways depending on system, and unlike TBP
    # (see the TBP record, where the sign WAS refuted and fixed) no data was
    # retrieved here either way. So the sign is left as-is and flagged rather
    # than silently flipped. This is a separate question from the TBP refit
    # and needs its own literature pass before any of these numbers move.
    temperature_coefficients:  # d values in K; sign unverified, see above
      La: -1500
      Ce: -1600
      Pr: -1700
      Nd: -1800
      Sm: -2000
      Eu: -2100
      Gd: -2200
      Tb: -2300
      Dy: -2400
      Y:  -2200

    valid_ph_range: [1.0, 5.0]
    valid_temp_range: [283, 333]  # K
    reference_concentration: 0.5  # M

    # Concentration correction: D ∝ [HA]^n
    concentration_exponent: 3.0

    cost_usd_kg: 8.0

    # Saponification (#197): see the file header for the provenance of these
    # numbers. `degree` is an operating default, not a property.
    saponification:
      counter_ion: Na
      degree: 0.35
      log10_K: null          # calibrated from degree at the reference below
      reference_pH: 3.0
      reference_counter_ion: 0.1   # M

  PC88A:
    full_name: "2-ethylhexyl phosphonic acid mono-2-ethylhexyl ester"
    alternative_names: [EHEHPA, P507, Ionquest_801]
    formula: "C16H35O3P"
    molecular_weight: 306.42
    density: 0.955
    pKa: 4.10
    type: acidic_phosphonic
    mechanism: cation_exchange  # normalized from type (#195)
    diluents: [kerosene, n-heptane, Shellsol_D70]
    typical_concentration: 0.5

    # Extraction mechanism: REE³⁺ + 3(HA)₂ ⇌ REE(HA₂)₃ + 3H⁺
    # Dimeric, as D2EHPA: 6 mol PC88A per mol REE (max_loading = 1/6). See #191.
    stoichiometry:
      protons_released: 3
      extractant_molecules: 3
      basis: dimer

    # PC88A has better light REE selectivity than D2EHPA
    # Particularly good for Nd/Pr separation (SF ~ 3-4 vs 2-3 for D2EHPA)
    #
    # EXPECTED D VALUES at pH 3.0:
    #   La: 0.02, Ce: 0.06, Pr: 0.18, Nd: 0.60
    #   Sm: 3.0, Eu: 6.0, Gd: 12, Tb: 22, Dy: 40, Y: 15
    #
    # Note: PC88A operates at slightly higher pH than D2EHPA due to higher pKa
    ph_coefficients:
      La: {a: -8.90, b: 2.35, c: 0.010, d: 0.0}
      Ce: {a: -8.55, b: 2.42, c: 0.010, d: 0.0}
      Pr: {a: -8.15, b: 2.50, c: 0.010, d: 0.0}
      Nd: {a: -7.72, b: 2.55, c: 0.010, d: 0.0}
      Sm: {a: -7.20, b: 2.65, c: 0.010, d: 0.0}
      Eu: {a: -6.98, b: 2.70, c: 0.010, d: 0.0}
      Gd: {a: -6.75, b: 2.75, c: 0.010, d: 0.0}
      Tb: {a: -6.52, b: 2.82, c: 0.010, d: 0.0}
      Dy: {a: -6.32, b: 2.90, c: 0.010, d: 0.0}
      Y:  {a: -6.65, b: 2.75, c: 0.010, d: 0.0}

    # Sign unverified; same open question as D2EHPA above (negative d implies
    # ENDOTHERMIC extraction). Numbers deliberately unchanged.
    temperature_coefficients:
      La: -1400
      Ce: -1500
      Pr: -1600
      Nd: -1700
      Sm: -1900
      Eu: -2000
      Gd: -2100
      Tb: -2200
      Dy: -2300
      Y:  -2100

    valid_ph_range: [1.5, 5.5]
    valid_temp_range: [283, 333]
    reference_concentration: 0.5
    concentration_exponent: 3.0
    cost_usd_kg: 12.0

    # Saponification (#197): see the file header for the provenance of these
    # numbers. `degree` is an operating default, not a property.
    saponification:
      counter_ion: Na
      degree: 0.35
      log10_K: null          # calibrated from degree at the reference below
      reference_pH: 3.0
      reference_counter_ion: 0.1   # M

  Cyanex272:
    full_name: "Bis(2,4,4-trimethylpentyl)phosphinic acid"
    formula: "C16H35O2P"
    molecular_weight: 290.43
    density: 0.920
    pKa: 6.37
    type: acidic_phosphinic
    mechanism: cation_exchange  # normalized from type (#195)
    diluents: [kerosene, Shellsol_D70]
    typical_concentration: 0.3

    # Extraction mechanism: REE³⁺ + 3(HA)₂ ⇌ REE(HA₂)₃ + 3H⁺
    # Dimeric in aliphatic diluents: 6 mol Cyanex272 per mol REE
    # (max_loading = 1/6). See #191.
    stoichiometry:
      protons_released: 3
      extractant_molecules: 3
      basis: dimer

    # Cyanex 272 has high pKa - operates at higher pH (4-6)
    # Excellent Co/Ni rejection, used for specialty REE separations
    # Lower overall D values due to weaker acid strength
    #
    # EXPECTED D VALUES at pH 5.0:
    #   La: 0.08, Ce: 0.20, Pr: 0.50, Nd: 1.2
    #   Sm: 6.0, Eu: 12, Gd: 22, Tb: 40, Dy: 70, Y: 25
    ph_coefficients:
      La: {a: -9.80, b: 2.20, c: 0.005, d: 0.0}
      Ce: {a: -9.50, b: 2.25, c: 0.005, d: 0.0}
      Pr: {a: -9.15, b: 2.30, c: 0.005, d: 0.0}
      Nd: {a: -8.85, b: 2.35, c: 0.005, d: 0.0}
      Sm: {a: -8.25, b: 2.45, c: 0.005, d: 0.0}
      Eu: {a: -7.95, b: 2.50, c: 0.005, d: 0.0}
      Gd: {a: -7.68, b: 2.55, c: 0.005, d: 0.0}
      Tb: {a: -7.40, b: 2.62, c: 0.005, d: 0.0}
      Dy: {a: -7.15, b: 2.70, c: 0.005, d: 0.0}
      Y:  {a: -7.55, b: 2.58, c: 0.005, d: 0.0}

    # Sign unverified; same open question as D2EHPA above (negative d implies
    # ENDOTHERMIC extraction). Numbers deliberately unchanged.
    temperature_coefficients:
      La: -1300
      Ce: -1400
      Pr: -1500
      Nd: -1600
      Sm: -1800
      Eu: -1900
      Gd: -2000
      Tb: -2100
      Dy: -2200
      Y:  -2000

    valid_ph_range: [3.0, 7.0]
    valid_temp_range: [283, 333]
    reference_concentration: 0.3
    concentration_exponent: 3.0
    cost_usd_kg: 25.0

    # Saponification (#197): see the file header for the provenance of these
    # numbers. `degree` is an operating default, not a property.
    saponification:
      counter_ion: Na
      degree: 0.35
      log10_K: null          # calibrated from degree at the reference below
      reference_pH: 3.0
      reference_counter_ion: 0.1   # M

  TBP:
    full_name: "Tributyl phosphate"
    formula: "(C4H9O)3PO"
    molecular_weight: 266.31
    density: 0.979
    pKa: null  # Neutral extractant
    type: solvating_neutral
    mechanism: solvating  # normalized from type (#195)
    diluents: [kerosene, n-dodecane]
    typical_concentration: 1.0  # Often 30% v/v in diluent

    # Solvating extraction from nitrate media
    # REE(NO3)3 + 3TBP ⇌ REE(NO3)3·3TBP
    # Solvating, monomeric: 3 mol TBP per mol REE (max_loading = 1/3). See #191.
    stoichiometry:
      protons_released: 0
      extractant_molecules: 3
      basis: monomer
      requires_nitrate: true

    # =====================================================================
    # TBP NITRATE COEFFICIENTS -- REFITTED FROM PRIMARY LITERATURE
    # =====================================================================
    # Model (as implemented by difflow_ree.equilibrium.distribution):
    #
    #   log10(D) = a + b*log10([NO3-]/reference_nitrate)
    #                + c*log10([NO3-]/reference_nitrate)^2
    #                + d*(1/T - 1/298.15)
    #                + n*log10([TBP]/reference_concentration)
    #
    #   `a` = log10(D) AT the reference: [NO3-] = 3.0 M, [TBP] = 1.0 M,
    #         T = 298.15 K.
    #   `b` = nitrate slope d log10(D) / d log10([NO3-]).
    #   `d` = -dH / (2.303 R), so d > 0 <=> dH < 0 <=> EXOTHERMIC.
    #
    # WHAT WAS WRONG BEFORE, AND IS NOW FIXED
    #   1. The old `a` values gave D_Dy/D_La = 100 at the reference. Measured:
    #      10.2. The old spread was an acidic-organophosphorus selectivity
    #      pattern, not a solvating one.
    #   2. The old `a` values gave D_Dy = 3.16 at the reference. Measured
    #      (corrected to the reference): 0.24.
    #   3. Every old `d` was NEGATIVE, which under the model above means
    #      ENDOTHERMIC. TBP extraction of REE nitrates is EXOTHERMIC. Every
    #      `d` is now POSITIVE.
    #   4. The old per-element `b` trend 2.50-2.85 had no support of any kind
    #      and is removed; `b` is now the stoichiometric 3.0 for every element.
    #
    # ---------------------------------------------------------------------
    # SOURCES (these four, and no others; nothing else here is a source)
    # ---------------------------------------------------------------------
    # S1  Kraikaew, Srinuttrakul & Chayavadhanakur (2005), "Solvent Extraction
    #     Study of Rare Earths from Nitrate Medium by the Mixtures of TBP and
    #     D2EHPA in Kerosene", J. Metals, Materials and Minerals 15(2), 89-95.
    #     No DOI. https://jmmm.material.chula.ac.th/index.php/jmmm/article/view/1345
    #     Table 1, p. 92. Conditions: RE nitrate from monazite, free acidity
    #     0.2001 N, TBP in kerosene, equal phase volumes, 35 +/- 1 C.
    #     >>> This is the ONLY source of the `a` values below. <<<
    #
    # S2  Topp & Weaver, ORNL-1811, "Distribution of Rare-Earth Nitrates
    #     Between Tributyl Phosphate and Nitric Acid" (1954).
    #     DOI 10.2172/4398970.
    #     Used only to bound the validity window (Tables II/IV, 8.5-17.4 N).
    #
    # S3  Poos & Wilhelm, ISC-695, "Separation of Yttrium and Some Rare Earths
    #     by Liquid-Liquid Extraction", Ames Laboratory (1954). OSTI 4332475.
    #     Used only for the Y acidity-dependent-position caveat.
    #
    # S4  Ganesh & Pandey (2019), J. Rad. Nucl. Appl. 4(2), 109-115.
    #     The DOI printed in the PDF (10.18576/jrna/040205) is NOT REGISTERED
    #     IN CROSSREF -- it does not resolve. Cite the retrieved PDF instead:
    #     https://www.naturalspublishing.com/files/published/q86xt25u4iq5o9.pdf
    #     Table 1: dH_Sm = -43.3 +/- 6.2 kJ/mol (1.1 M TBP in n-dodecane,
    #     3.8-3.89 M HNO3, 283-326 K, R^2 = 0.979).
    #     Fig. 1: log D_Sm = 2.8055*log[TBP]_free - 2.8503, R^2 = 0.992.
    #     >>> This is the ONLY source of the `d` value below. <<<
    #
    # S5  Jorjani & Shahbazi (2016), Arab. J. Chem. 9, S1532-S1539,
    #     DOI 10.1016/j.arabjc.2012.04.002. Extraction fell as T went
    #     25 -> 55 C. Corroborates exothermicity; supplies no number here.
    #
    # KNOWN GAP -- THE SINGLE HIGHEST-VALUE FOLLOW-UP
    #     Fidelis (1970), "Temperature effect on the extraction of lanthanides
    #     in the TBP-HNO3 system", J. Inorg. Nucl. Chem. 32, 997-1003,
    #     DOI 10.1016/0022-1902(70)80079-3, measured the WHOLE lanthanide
    #     series at 10/17/25/40 C -- i.e. exactly the per-element dH that is
    #     assumed constant below. It is paywalled with no open-access copy and
    #     was NOT used. Obtaining it would replace nine assumed `d` values
    #     with nine measured ones. That is the next thing to do to this record.
    #
    # ---------------------------------------------------------------------
    # FIT BASIS AND THE CORRECTION ARITHMETIC
    # ---------------------------------------------------------------------
    # S1 Table 1 reports D at 1.0 M TBP, at 6.06 M nitrate and 308.15 K.
    # Corrected to the record's reference (3.0 M NO3-, 1.0 M TBP, 298.15 K):
    #
    #   a = log10(D_measured)
    #       + 3*log10(3.0/6.06)              = -0.9162   (nitrate, b = 3)
    #       - 2300*(1/308.15 - 1/298.15)     = +0.2504   (temperature, d = 2300)
    #
    #   i.e.  a = log10(D_measured) - 0.6658
    #
    # THE 6.06 M NITRATE IS DERIVED, NOT REPORTED. S1 does not state a nitrate
    # concentration. 6.06 M was computed from S1's ppm feed table (sum of the
    # RE nitrates, plus the 0.2 N free acid). THIS IS THE SINGLE LARGEST
    # UNCERTAINTY IN THE `a` VALUES: the nitrate correction is 3*log10(3/[NO3-]),
    # so a 10% error in the derived 6.06 M moves every `a` by 0.13 log units
    # (35%) IN COMMON. Relative selectivity (the ratios, which is what these
    # numbers are actually good for) is unaffected; the absolute level is not.
    #
    # ---------------------------------------------------------------------
    # PER-ELEMENT PROVENANCE -- READ THIS BEFORE USING ANY SINGLE NUMBER
    # ---------------------------------------------------------------------
    #   La  DERIVED from S1 Table 1 (measured D, corrected as above)
    #   Ce  DERIVED from S1 Table 1
    #   Pr  DERIVED from S1 Table 1
    #   Nd  DERIVED from S1 Table 1
    #   Sm  DERIVED from S1 Table 1
    #   Eu  DERIVED from S1 Table 1
    #   Gd  DERIVED from S1 Table 1
    #   Tb  *** INTERPOLATED -- NOT MEASURED ***
    #       Log-linear in atomic number between Gd (Z = 64) and Dy (Z = 66).
    #       NO TBP-nitrate distribution ratio for Tb exists in ANY source
    #       retrieved for this refit. a_Tb is a straight-line fill-in with no
    #       measurement behind it. Treat any Tb result as interpolation.
    #   Dy  DERIVED from S1 Table 1
    #   Y   DERIVED from S1 Table 1, but SPECIAL CASE -- see below.
    #
    # Y IS A SPECIAL CASE AND A SINGLE a_Y IS A FICTION.
    #   Yttrium has no 4f shell; its effective position in the REE extraction
    #   series is not fixed but SLIDES WITH ACIDITY -- Ho-like at high acidity,
    #   La-like at very low acidity (S3). One number cannot represent that.
    #   The a_Y written below is the ~6 M nitrate, LOW-FREE-ACID value from
    #   S1's conditions (0.2 N), corrected like the rest. At any other acidity
    #   it is wrong, and wrong by an unknown amount in a known direction.
    #   Do not use Y at any acidity other than S1's.
    #
    # b = 3.0 IS STOICHIOMETRIC, NOT FITTED.
    #   It is the 3 of RE(NO3)3 + 3 TBP <-> RE(NO3)3.3TBP. NO measured
    #   d log D / d log[NO3-] in a neutral-salt system was found in any
    #   retrieved source, so there is no fitted nitrate slope to write. The
    #   only corroboration is INDIRECT: S4 Fig. 1 measured the TBP order as
    #   2.81 (R^2 = 0.992), close to 3. All ten elements share b = 3.0 because
    #   nothing in the data distinguishes them; the old 2.50-2.85 per-element
    #   trend was invented.
    #
    # d = +2300 K FOR EVERY ELEMENT: ONE MEASUREMENT, NINE ASSUMPTIONS.
    #   From S4's dH_Sm = -43.3 kJ/mol via d = -dH/(2.303 R)
    #     = 43300 / (2.303 * 8.314) = 2262 K, rounded to 2300 K.
    #   *** Sm is MEASURED. The other nine elements are ASSUMED EQUAL TO Sm
    #       and are NO DATA. *** There is no per-element heat of extraction in
    #   anything retrieved (that is what the Fidelis gap above would supply).
    #   The sign, however, is solid and is the point: dH < 0, so d > 0, so D
    #   FALLS as T rises. S5 corroborates the direction independently.
    #
    #   +/-40% AMBIGUITY IN THE MAGNITUDE. S4's Table 1 appears to have its dH
    #   and slope columns TRANSPOSED between its two rows, so the value that
    #   belongs to TBP is either -43.3 or -61.2 kJ/mol, giving d = +2261 K or
    #   d = +3197 K. This cannot be resolved from the paper as published.
    #   The defensible range is therefore d = +2260 to +3200 K; +2300 is the
    #   low end of it. Any temperature study should sweep that range rather
    #   than trust the single value.
    #
    # ---------------------------------------------------------------------
    # VALIDITY WINDOW
    # ---------------------------------------------------------------------
    # These coefficients -- and in particular b = 3.0 -- are valid ONLY for:
    #
    #     nitrate supplied by a NEUTRAL SALT
    #       (NH4NO3 / LiNO3 / Ca(NO3)2 / Mg(NO3)2 / Al(NO3)3),
    #     free acid <= 0.5 M,
    #     [NO3-] 1-6 M,
    #     T 283-326 K.
    #
    # WHY ONE `b` CANNOT COVER MORE THAN THAT (both measured, both outside):
    #   - NEAT TBP + CONCENTRATED HNO3: the slope is ~6, not 3
    #     (S2 Tables II/IV, 8.5-17.4 N). Twice the exponent.
    #   - DILUTE TBP + HNO3: at 1.1 M TBP, D actually FALLS with acidity,
    #     because the acid consumes the extractant as the TBP.HNO3 adduct and
    #     starves the RE complex of free TBP. The effective slope is ~0 or
    #     NEGATIVE (S4 Fig. 4). Opposite sign.
    #   A single b cannot be 3, 6 and -something at once. The neutral-salt,
    #   low-acid window is the one where b = 3 is the right physics.
    #
    # TWO FURTHER CAVEATS ON THE LEVEL (not the shape):
    #   - The model's extractant term uses TOTAL [TBP] (`[TBP]/1.0 M` raised to
    #     concentration_exponent). The measured cube law holds in FREE TBP.
    #     These differ whenever the solvent is loaded or the acid is high.
    #   - S1's solvent was AT OR OVER SATURATION: an organic loading of 0.35 M
    #     requires 1.05 M TBP of the 1.0 M available. So S1's D values -- and
    #     hence every `a` below -- are LOADING-SUPPRESSED PROCESS values, not
    #     trace-level D. Trace D would be higher.
    #
    # ---------------------------------------------------------------------
    # USE FOR / DO NOT USE FOR
    # ---------------------------------------------------------------------
    # USE FOR:
    #   - relative REE selectivity of TBP (the element ORDER and the ratios)
    #   - showing why a TBP separation needs very many stages
    #   - trend and sensitivity studies, gradient-based structure studies
    #   - the DIRECTION of the temperature and nitrate dependences
    #
    # DO NOT USE FOR:
    #   - stage counts or column sizing
    #   - solvent inventories
    #   - absolute recoveries or purities
    #   - any system where the nitrate is supplied by HNO3 rather than a
    #     neutral salt
    #   - loaded solvent (these are already loading-suppressed; the loading
    #     model would double-count)
    #   - free acidity above ~0.5 M
    #   - regressing equilibrium constants against these numbers
    #   - Y at any acidity other than S1's 0.2 N
    #
    # AT THE REFERENCE (3.0 M NO3-, 1.0 M TBP, 298.15 K) THESE GIVE:
    #   La 0.023, Ce 0.032, Pr 0.060, Nd 0.072, Sm 0.120, Eu 0.138,
    #   Gd 0.174, Tb 0.204, Dy 0.240, Y 0.214
    #   D_Dy/D_La = 10.2; mean adjacent-pair separation factor La->Dy = 1.29
    #   (per unit atomic number over the 9 steps La(57) -> Dy(66), which
    #   includes Pm(61); counting only the 8 gaps in the tracked element
    #   list would inflate this to 1.34). Inside the 1.1-1.5 reported for
    #   TBP; the old record implied 1.67, above that range.
    #   Every D is below 1: TBP is a weak extractant and this now shows it.
    #
    # NOTE ON EXTRACTANT CONCENTRATION. Every Params class in difflow_ree
    # defaults extractant_conc = 0.5 M, which with reference_concentration 1.0
    # and concentration_exponent 3.0 multiplies every D above by 0.125. 0.5 M
    # is a cation-exchange default and is meaningless for TBP: TBP is normally
    # run at ~30% v/v, which for the density and MW on this record is 1.10 M
    # (neat TBP is 3.68 M). Set extractant_conc ~ 1.1 explicitly for TBP.
    nitrate_coefficients:
      La: {a: -1.63, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1
      Ce: {a: -1.49, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1
      Pr: {a: -1.22, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1
      Nd: {a: -1.14, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1
      Sm: {a: -0.92, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1
      Eu: {a: -0.86, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1
      Gd: {a: -0.76, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1
      Tb: {a: -0.69, b: 3.0, c: 0.0, d: 0.0}   # INTERPOLATED Gd-Dy, NOT MEASURED
      Dy: {a: -0.62, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1
      Y:  {a: -0.67, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1; ACIDITY-SPECIFIC

    # NO ph_coefficients BLOCK -- DELETED ON PURPOSE.
    # TBP formerly carried a `ph_coefficients` block, reachable via
    #   REEDistribution(extractant="TBP", ..., mechanism="cation_exchange").
    # It was removed because it was mechanistically indefensible, not merely
    # uncalibrated:
    #   - It modelled TBP as a weak CATION EXCHANGER, but this very record has
    #     pKa: null and stoichiometry.protons_released: 0. There is no proton
    #     to exchange. The model had no mechanism under it.
    #   - No retrieved source reports a pH-slope correlation for TBP at all.
    #   - It carried the same refuted 100x La-to-Dy spread as the old nitrate
    #     block (see above), from the same unrecorded origin.
    # Asking for TBP with mechanism="cation_exchange" now RAISES a ValueError
    # naming TBP and pointing at the nitrate path. There is no fallback.
    # TBP in HNO3 is a real system, but it is one this file has no coefficients
    # for -- and per the validity window above, b = 3 would be wrong for it
    # anyway (S2 measured ~6, S4 measured ~0 or negative). Anyone who needs it
    # must supply fitted coefficients, not reach for a deleted block.

    # d = -dH/(2.303 R) > 0 <=> EXOTHERMIC. All ten are +2300 K:
    # Sm MEASURED (S4, dH = -43.3 kJ/mol); the other nine ASSUMED EQUAL TO Sm
    # and carrying NO DATA. Defensible range +2260 to +3200 K (S4 column
    # transposition, see above). Fidelis (1970) would replace all nine.
    temperature_coefficients:  # d values in K
      La: 2300   # ASSUMED = Sm (no data)
      Ce: 2300   # ASSUMED = Sm (no data)
      Pr: 2300   # ASSUMED = Sm (no data)
      Nd: 2300   # ASSUMED = Sm (no data)
      Sm: 2300   # MEASURED, S4 Table 1
      Eu: 2300   # ASSUMED = Sm (no data)
      Gd: 2300   # ASSUMED = Sm (no data)
      Tb: 2300   # ASSUMED = Sm (no data)
      Dy: 2300   # ASSUMED = Sm (no data)
      Y:  2300   # ASSUMED = Sm (no data)

    valid_ph_range: [0.5, 4.0]  # Works in highly acidic conditions
    valid_temp_range: [283, 353]
    reference_concentration: 1.0
    reference_nitrate: 3.0  # M
    concentration_exponent: 3.0
    cost_usd_kg: 4.0

  naphthenic_acid:
    full_name: "Naphthenic acid (commercial mixture of alkyl cyclopentane- and cyclohexane-carboxylic acids)"
    formula: "R-(CH2)n-COOH"   # NOT a single compound; see MOLECULAR WEIGHT below
    molecular_weight: 270.0
    density: 0.96
    pKa: 5.5
    type: acidic_carboxylic
    mechanism: cation_exchange
    diluents: [kerosene, n-dodecane, Shellsol_D70]
    typical_concentration: 0.5

    # Cation exchange, MONOMER basis: 3 mol HA per mol RE (max_loading = 1/3).
    # RE3+ + 3 HA(o) <-> REA3(o) + 3 H+                     (Q1 Eq. 2.87)
    # Monomer, not dimer: naphthenic acid dimerizes in a nonpolar diluent, but
    # the working solvent is saponified and carries an alcohol modifier, in
    # which Q1 states it is predominantly MONOMERIC (Q1 Sec. 2.4.2.1). The 3:1
    # ratio is confirmed twice in Q1 -- by the slope of lg D - 3 lg(HA)o vs pH
    # and by the saturation method -- and directly in Q1 Table 2.43.
    stoichiometry:
      protons_released: 3
      extractant_molecules: 3
      basis: monomer

    # =====================================================================
    # NAPHTHENIC ACID -- READ THIS WHOLE BLOCK BEFORE USING ANY NUMBER
    # =====================================================================
    # PROVENANCE CLASS: *** MEASURED ANCHOR + LITERATURE-DERIVED FORM. ***
    #
    #   (A) LITERATURE-DERIVED. Everything about the SHAPE of the model and
    #       the physical properties: the extraction reaction, b = 3.0, the
    #       cube law in free extractant, the monomer basis, pKa, density,
    #       molecular weight, the saponification degree, the validity
    #       window, the impurity ordering. From Q1, with section numbers.
    #
    #   (B) MEASURED.  *** The per-element `a` ladder. ***
    #       Back-computed element by element from ONE published table of
    #       distribution ratios for all fifteen rare earths in a naphthenic
    #       acid system at stated pH, extractant concentration, rare-earth
    #       concentration, phase ratio and temperature: Z1 Table 4.36,
    #       left-hand system. The arithmetic is written out under THE `a`
    #       LADDER below. This is the only per-element block in this file
    #       that traces to a single identified measurement rather than to
    #       fitting, hand-tuning or construction.
    #
    #       *** SUPERSEDES A CONSTRUCTED LADDER. *** An earlier revision of
    #       this record built the ladder from published separation-factor
    #       BOUNDS, because no measured full-series table had been found.
    #       That construction was monotonic in atomic number. It was WRONG
    #       IN SHAPE. The measurement rises from La to a maximum at Sm/Eu
    #       and falls back across the heavies, so the constructed ladder had
    #       the heavy rare earths separating from Y far better than they do
    #       and Sm/Eu far worse. ANY RESULT DERIVED FROM THE OLD LADDER MUST
    #       BE RECOMPUTED. What survives from it is the one qualitative fact
    #       both versions agree on: Y has the lowest D of the fifteen.
    #
    # ---------------------------------------------------------------------
    # SOURCES (these, and no others)
    # ---------------------------------------------------------------------
    # Q1  Qi, Dezhi (2018), "Hydrometallurgy of Rare Earths: Extraction and
    #     Separation", Elsevier. ISBN 978-0-12-813920-2.
    #     Ch. 2 Sec. 2.4 (naphthenic acid) and Ch. 4 Sec. 4.3.4 (industrial
    #     yttrium separation). Source of the MODEL FORM and the properties.
    #     Specific loci used:
    #       Eq. 2.87   extraction reaction (saponified, monomer)
    #       Eq. 2.88   lg D = lg K_ex + 3 lg(HA)o + 3 pH      -> b = 3.0
    #       Eq. 2.89   (HA)o = [HA]0 - 3 (REA3)   free-extractant balance
    #       Eq. 2.90   RE(OH)2+ route above pH 5.6 -- the upper bound
    #       Eq. 2.91   RECl3 + n HA -> RECl3.nHA, the NEUTRAL-COORDINATION
    #                  route at low pH / high [RECl3]: a DIFFERENT mechanism
    #                  that this record does not model
    #       Sec. 2.4.2.1 (p. 280) the slope-3 verification and ITS RANGE:
    #                  "the slope of lg D - 3 lg(HL)(O) against pH is a
    #                  straight line, close to 3 ... in the range of Y3+
    #                  concentrations from 0.1 to 0.8 mol/L and pH from 3.8
    #                  to 5.0". This is the ONLY statement of where b = 3.0
    #                  has been checked, and it is checked against the FREE
    #                  extractant concentration. See THE FREE-EXTRACTANT GAP.
    #       Table 2.42 physical properties
    #       Table 2.43 (HA)/(RE) = 2.79-3.14 measured at pH 5.01-5.43
    #       Table 2.45 solubility of solid REA3 -- the CAPACITY LIMIT, below
    #       Table 2.49 D_Fe, D_Al, D_RE vs pH 1.18-3.20
    #       Sec. 2.4.2.2 (p. 283) beta_RE/Y bounds: light rare earths
    #                  "always bigger than 1.5", Gd and heavies "> 2.0", over
    #                  aqueous RE 0.29-1.1 mol/L at pH 4.0-5.0. These were
    #                  the basis of the superseded construction; they are now
    #                  used only as a CHECK on the measured ladder.
    #       Fig. 2.79  D-vs-Z, three salting-agent levels. Light rare-earth
    #                  D and beta FALL and heavy rare-earth D and beta RISE
    #                  as NH4Cl is added: the ladder is not rigid.
    #       Sec. 4.3.4.2 effective beta = 1.58 and the industrial stage counts
    #
    # Z1  Zhang, Jack; Zhao, Baodong; Schreiner, Bryan (2016), "Separation
    #     Hydrometallurgy of Rare Earth Elements", Springer.
    #     Ch. 4 Sec. 4.7 (naphthenic acid extraction system).
    #     >>> The ONLY source of the per-element `a` values. <<<
    #     Specific loci used:
    #       Table 4.36 Distribution ratio and separation factor in naphthenic
    #                  acid extraction system. Two systems, both 25 C, O/A
    #                  2/1, all fifteen rare earths, D and beta_RE/Y. The
    #                  left-hand system (0.45 mol/L naphthenic acid, 0.142
    #                  mol/L rare earth, pH 4.19) IS THE ANCHOR.
    #       Eq. 4.94   RE3+ + 3 HL(o) = RE(HL2)3(o) + 3 H+  (unsaponified)
    #       Eq. 4.95   HL(o) + NH4OH = NH4L(o) + H2O        (saponification)
    #       Eq. 4.96   RE3+ + 3 NH4L(o) = REL3(o) + 3 NH4+  (saponified)
    #                  >>> NO PROTON APPEARS. See THE SAPONIFICATION GAP. <<<
    #       Fig. 4.42  Bauer & Lindstrom (1964), 0.32 M naphthenic acid in
    #                  DIETHYL ETHER from SULFATE, pH 5-7.5. NOT USED: wrong
    #                  diluent, wrong medium, wrong pH band. In that system Y
    #                  sits between Tb and Dy, not at the bottom. Cited here
    #                  only so that nobody re-finds it and thinks it conflicts
    #                  with the anchor. It is a different system.
    #       Fig. 4.43  D vs element, 20% naphthenic acid / 20% mixed alcohol /
    #                  60% kerosene / RECl3, 80% saponified, at pH 4.0, 4.6,
    #                  5.2, 5.4. Y LOWEST across pH 4.0-5.2, and the element
    #                  order is exactly the anchor's. Independent confirmation
    #                  of the ladder's shape in the industrial solvent.
    #       Sec. 4.7.2 "The average separation factor of RE/Y is about 3.0."
    #                  The anchor reproduces 2.93 -- see THE `a` LADDER.
    #       Fig. 4.44/4.45 two-step and one-step industrial Y processes, 30-50
    #                  and 73-110 stages.
    #
    # ---------------------------------------------------------------------
    # WHERE YTTRIUM SITS, AND WHY THIS EXTRACTANT EXISTS
    # ---------------------------------------------------------------------
    # Naphthenic acid is the industrial yttrium extractant because Y has the
    # LOWEST distribution ratio of all fifteen rare earths in it. Y reports to
    # the AQUEOUS raffinate while the heavy lanthanides load the solvent. That
    # is the opposite of D2EHPA, in which Y tracks the heavy lanthanides.
    # Q1's measured extraction order (pH 4.6, 20% v/v HA + 18% v/v mixed ROH
    # + 62% v/v kerosene, [RE]0 = 0.84 mol/L, O/A = 1) is
    #
    #   Yb > Sm > Dy > Lu > Nd > Gd > Pr > Tm > Tb > Ce > Ho > Er > La > Y
    #
    # -- scrambled among the lanthanides, but unambiguous at the bottom: La
    # then Y. THIS RECORD NOW REPRODUCES THE SCRAMBLING, because the ladder
    # is measured rather than idealized. Its own order, from Z1 Table 4.36,
    # is
    #
    #   Sm > Eu > Nd > Gd > Tb > Dy > Pr > Ho > Er > Yb > Tm > Ce > Lu > La > Y
    #
    # Two independently measured systems, different laboratories, different
    # conditions, different books. They are not the same permutation -- Q1's
    # was measured at 0.84 mol/L RE, far above the solvent's capacity, so it
    # is loading- and speciation-distorted -- but they agree on the three
    # things that matter: Sm near the top, and La then Y at the bottom, in
    # that order. An earlier revision of this record idealized the ladder as
    # monotonic in atomic number and warned that the scrambling was real and
    # unmodelled. It is now modelled.
    #
    # LA AND Y ARE NOT RELIABLY SEPARABLE AND THE SOURCES DISAGREE ON THEIR
    # ORDER. Q1 puts La above Y. A retrieved review of the same system
    # (attributed to Zheng/du Preez-Preston, see UNRETRIEVED SOURCES) reports
    # the order La < Ce < Y < Nd, i.e. Y ABOVE La. Q1 explains the conflict
    # directly: beta_La/Y crosses 1 as the La:Y ratio changes, because a
    # HETERONUCLEAR La-Y complex forms. Both sources therefore agree on what
    # matters -- beta_La/Y is near 1 and composition-dependent -- and disagree
    # only on which side of 1. THE La AND Y VALUES BELOW CANNOT RESOLVE THAT
    # AND SHOULD NOT BE USED TO DESIGN A La/Y SPLIT. The industrial process
    # avoids the problem: it removes La upstream and feeds naphthenic acid a
    # yttrium-enriched HEAVY rare-earth group.
    #
    # ---------------------------------------------------------------------
    # THE `a` LADDER: WHERE IT COMES FROM
    # ---------------------------------------------------------------------
    # SOURCE: Z1 Table 4.36, left-hand system. Stated conditions:
    #     naphthenic acid   0.45  mol/L
    #     rare earth        0.142 mol/L (aqueous)
    #     equilibrium pH    4.19
    #     O/A               2/1
    #     temperature       25 C
    # and D for all fifteen elements, with beta_RE/Y alongside.
    #
    # THE ARITHMETIC. Inverting this record's own model at those conditions,
    # with b = 3.0, c = 0, d = 0, n = 3.0 and reference_concentration 0.5:
    #
    #     a = log10(D_measured) - 3*(4.19) - 3*log10(0.45/0.5)
    #       = log10(D_measured) - 12.5700 + 0.1373
    #       = log10(D_measured) - 12.4327
    #
    # That is the whole derivation. No fitting, no smoothing, no
    # interpolation: fifteen measured numbers, one subtraction each. Feed
    # the record back its own anchor conditions and it returns Table 4.36.
    #
    # WHICH COLUMN IS AUTHORITATIVE. Table 4.36 prints D and beta_RE/Y. They
    # disagree for three entries out of thirty (D_i/D_Y vs the printed beta):
    #     system 1  Nd   D/D_Y = 3.61   printed beta 2.35
    #     system 1  Lu   D/D_Y = 1.98   printed beta 2.19
    #     system 2  Tb   D/D_Y = 3.31   printed beta 3.00
    # D IS TAKEN AS AUTHORITATIVE, for two reasons. D is the primary
    # measurement and beta is derived from it. And in both disputed system-1
    # cases the D column preserves a trend that the beta column breaks:
    # D_Nd = 0.422 keeps La < Ce < Pr < Nd < Sm monotonic (beta 2.35 would
    # put Nd below Pr), and D_Lu = 0.232 keeps Yb > Lu, which is also the
    # order in system 2. These are treated as typesetting errors in the beta
    # column. If that judgement is wrong it moves Nd and Lu only.
    #
    # THE SHAPE IS NOT MONOTONIC IN Z, AND THAT IS THE POINT.
    # beta_RE/Y from the anchor, by atomic number:
    #     La 1.22  Ce 2.10  Pr 2.91  Nd 3.61  Sm 5.29  Eu 4.52  Gd 3.54
    #     Tb 3.53  Dy 3.16  Ho 2.59  Er 2.23  Tm 2.15  Yb 2.16  Lu 1.98
    # It rises to a maximum at Sm, falls through the middle, flattens across
    # Er-Lu. Y sits below all of them. Carboxylic-acid extraction of the rare
    # earths is not a monotonic function of ionic radius, and any correlation
    # that assumes it is will be wrong at both ends.
    #
    # CONSEQUENCE FOR A HEAVY-RARE-EARTH FEED: the elements that separate
    # BEST from Y are Sm and Eu (beta 5.3, 4.5), which a xenotime concentrate
    # barely contains. Against the heavies that actually dominate such a feed
    # the separation factors are 2.0-3.2, and against Lu it is 1.98 -- the
    # worst of the fourteen except La. A Y/heavies split is therefore HARDER
    # than a Y/lights split in this solvent, and stage counts scale as
    # 1/log(beta).
    #
    # THREE INDEPENDENT CHECKS, NONE OF WHICH WENT INTO THE NUMBERS:
    #   1. Z1 Sec. 4.7.2 states "the average separation factor of RE/Y is
    #      about 3.0". The ladder gives a mean beta_RE/Y of 2.93 over the
    #      fourteen non-Y elements. Not used in the derivation.
    #   2. Q1 Sec. 2.4.2.2 requires beta_RE/Y > 2.0 for Gd and the heavies.
    #      The ladder gives Gd 3.54 down to Lu 1.98 -- satisfied everywhere
    #      except Lu, which misses by 1%.
    #   3. Q1 Sec. 2.4.2.2 requires beta_RE/Y > 1.5 for La-Sm. The ladder
    #      gives Ce-Sm 2.10-5.29, satisfied, but La = 1.22, which FAILS.
    #      This is not a defect in the ladder. Q1 Sec. 2.4.2.1 says the La/Y
    #      pair is anomalous in exactly this way: a heteronuclear La-Y
    #      complex forms, and beta_La/Y moves with the La:Y ratio, crossing
    #      1. The two sources agree that La/Y is composition-dependent and
    #      not a fixed separation factor. See the La/Y warning above.
    #
    # WHAT THE LADDER GIVES AT pH 4.5, 0.5 M HA, 298 K (model output, i.e.
    # EXTRAPOLATED 0.31 pH UNITS ABOVE THE ANCHOR -- read the two GAP
    # sections below before trusting the absolute level):
    #     Y  1.366   La 1.670   Ce 2.872   Pr 3.970   Nd 4.927   Sm 7.227
    #     Eu 6.176   Gd 4.834   Tb 4.822   Dy 4.320   Ho 3.538   Er 3.047
    #     Tm 2.931   Yb 2.954   Lu 2.709
    # The beta values are pH-independent in this model (common b), so they
    # are the anchor's betas at every pH. The absolute D values are not.
    #
    # ---------------------------------------------------------------------
    # THE FREE-EXTRACTANT GAP: `a` EMBEDS THE ANCHOR'S LOADING
    # ---------------------------------------------------------------------
    # Q1 Eq. 2.88 is a cube law in the FREE extractant (HA)o, and Eq. 2.89
    # defines it as (HA)o = [HA]0 - 3(REA3). difflow_ree's model raises the
    # TOTAL extractant concentration to the power n. Those are the same thing
    # only in the dilute limit.
    #
    # At the anchor the organic phase carries about 0.028 mol/L rare earth
    # against a 3:1 stoichiometric capacity of 0.45/3 = 0.150 mol/L, i.e. it
    # is ~19% loaded and the free extractant is ~0.366 mol/L against 0.45
    # total. The `a` values therefore absorb a -19% free-extractant
    # correction. Using them at a much higher or lower loading is an
    # extrapolation the record cannot support, and difflow_ree will not warn.
    #
    # THE SECOND SYSTEM IN Z1 TABLE 4.36 IS NOT USABLE AND WAS NOT USED.
    # It is printed as 0.13 mol/L naphthenic acid with 0.240 mol/L rare earth
    # at pH 4.96, O/A 2/1. Its own D values imply ~0.066 mol/L rare earth in
    # the organic phase against a 3:1 capacity of 0.0433 mol/L -- 153% of
    # capacity, so Eq. 2.89 returns a NEGATIVE free extractant concentration.
    # Something in that column is misprinted. It is recorded here so nobody
    # re-derives a ladder from it.
    #
    # It is worth stating what that costs: with one usable system there is no
    # cross-condition test of b = 3.0 in this record. Carrying the model from
    # system 1 to system 2 as printed mispredicts by 0.40 log units on
    # average, but with two points, three changed variables and one bad
    # column, that number tests the printing at least as much as the physics.
    # b = 3.0 rests on Q1 Sec. 2.4.2.1 alone, over pH 3.8-5.0 and Y 0.1-0.8
    # mol/L, on a free-extractant basis.
    #
    # ---------------------------------------------------------------------
    # THE SAPONIFICATION GAP: THE INDUSTRIAL REACTION RELEASES NH4+, NOT H+
    # ---------------------------------------------------------------------
    # This is the largest known structural error in this record, and it is
    # inherited from difflow_ree's mechanism set, not introduced here.
    #
    # Unsaponified (Z1 Eq. 4.94, Q1 Eq. 2.87):
    #     RE3+ + 3 HL(o)   =  REL3(o) + 3 H+     -> d(log D)/d(pH) = 3
    # 80% saponified, which is what the industry runs and what this record
    # declares (Z1 Eq. 4.95/4.96, Q1 Eq. 2.120):
    #     RE3+ + 3 NH4L(o) =  REL3(o) + 3 NH4+   -> NO PROTON IN THE EQUATION
    #
    # In the saponified system the driving variable is the ammonium activity
    # and the degree of saponification; pH enters only indirectly, through
    # the NH4+/NH3 buffer and through the unsaponified 20% fraction. Z1
    # Fig. 4.43 shows what that does: over pH 4.0 to 5.4 in the 80%-saponified
    # industrial solvent, D rises by roughly one order of magnitude, not the
    # 10^4.2 that a slope of 3 demands.
    #
    # difflow_ree has `cation_exchange` (proton) and `solvating` (neutral).
    # It has NO counter-ion-exchange mechanism. Until it does, this record
    # declares cation_exchange with b = 3.0 and is anchored at a MEASURED
    # point inside the band, which is the least-wrong available option. The
    # practical rule that follows:
    #
    #   *** SEPARATION FACTORS FROM THIS RECORD ARE SOUND ANYWHERE IN THE
    #   *** VALIDITY WINDOW; they are the anchor's measured betas and do not
    #   *** depend on b. ABSOLUTE D VALUES ARE SOUND ONLY NEAR pH 4.19 and
    #   *** degrade fast away from it. Stage counts driven by beta are
    #   *** usable. Solvent inventory and O/A driven by absolute D are not,
    #   *** without re-anchoring at the intended pH.
    #
    # Note that the paper this work is replicating specifies pH 4.5, which is
    # 0.31 pH units above the anchor -- a factor of 8.5 in D at slope 3, and
    # a factor of ~1.3 at the slope Z1 Fig. 4.43 actually shows. That spread
    # is the honest uncertainty on any absolute D at 4.5, and it is why the
    # validity window below stops at 5.0 rather than 5.5.
    #
    # ---------------------------------------------------------------------
    # CAPACITY: THE UNMODIFIED SOLVENT CANNOT REACH ITS OWN STOICHIOMETRY
    # ---------------------------------------------------------------------
    # At 3 HA per RE, 0.5 M naphthenic acid has a stoichiometric capacity of
    # 0.167 mol/L RE. It cannot get there. Q1 Table 2.45 gives the solubility
    # of solid REA3 in kerosene WITHOUT modifier as
    #     La 0.0374 | Pr 0.0374 | Gd 0.0558 | Er 0.0611 | Lu 0.0994 mol/L
    # i.e. 22%-60% of stoichiometric capacity. Above that the rare-earth
    # naphthenate precipitates or forms a third phase. With 15-20% v/v C7-C9
    # mixed alcohol the same solubilities rise to 0.23-0.48 mol/L and the
    # problem goes away; Q1 also reports relative viscosities up to 100x
    # kerosene without modifier. THE ALCOHOL (or petroleum sulfoxide) MODIFIER
    # IS NOT OPTIONAL IN THIS SYSTEM. Every Q1 datum behind this record was
    # measured on a modified solvent.
    # >>> A flowsheet specifying naphthenic acid in a bare aliphatic diluent
    #     with no modifier is specifying a solvent that third-phases before it
    #     is half loaded. difflow_ree has no third-phase model, so nothing in
    #     the code will warn you. <<<
    #
    # ---------------------------------------------------------------------
    # SAPONIFICATION IS ALREADY IN THE `a` VALUES -- DO NOT APPLY IT TWICE
    # ---------------------------------------------------------------------
    # The record ships counter_ion NH4 at degree 0.80 because that is the
    # industrial condition Q1 specifies for yttrium separation ("the
    # saponification ratio of the naphthenic acid at about 80%", Sec 2.4.2.1),
    # saponified with NH4OH or NaOH. Unlike the 0.35 on D2EHPA, that 0.80 is a
    # sourced operating value.
    # BUT: Q1 Eq. 2.87/2.88 -- the source of b = 3.0 and of every beta bound
    # used above -- were themselves measured on the SAPONIFIED, modified
    # solvent. The effect of saponification is therefore ALREADY EMBEDDED in
    # these coefficients. Running SaponifiedSection on top of them
    # DOUBLE-COUNTS it. Use one or the other, not both.
    # NH4 rather than Na is also an effluent decision, not a cosmetic one: it
    # puts ammonium nitrogen in the raffinate. See difflow_ree.economics.
    #
    # ---------------------------------------------------------------------
    # IMPURITIES: Fe, Th AND U ALL EXTRACT *BEFORE* THE RARE EARTHS
    # ---------------------------------------------------------------------
    # Q1's metal-ion extraction order for naphthenic acid is
    #   Fe3+ > Th4+ > Zr4+ > U4+ > In3+ > Tl3+ > ... > Cd2+ > RE3+ > Ni2+ > ...
    # with pH(1/2) for Fe3+ = 3.0, well below the pH 4.5 operating point.
    # Q1 Table 2.49 (equilibrium pH -> D):
    #   pH    1.18    1.67   1.90   2.50   2.80   3.00   3.20
    #   D_Fe  0.21    0.23   0.35   3.05   7.00   8.50   8.90
    #   D_Al    -       -    0.19   0.22   0.32   0.20   0.33
    #   D_RE  0.0016 0.0016 0.0017 0.0018 0.0020 0.0020 0.0021
    # Fe is ~4000x the rare earths by pH 3. The industrial process therefore
    # REMOVES Fe, Al, Th, U UPSTREAM and Q1 says so explicitly. A flowsheet
    # that feeds a Th/U-bearing liquor straight to naphthenic acid at pH 4.5
    # loads the thorium into the solvent ahead of the product, and neither
    # this record nor REEExtractor models that -- REEExtractor gives every
    # untracked species D = 0, i.e. perfectly non-extracted, which for Th and
    # Fe here is the opposite of the truth. No coefficients for Fe/Th/U/Al
    # ship on this record; the table above is documentation, not data the code
    # can read.
    #
    # ---------------------------------------------------------------------
    # MOLECULAR WEIGHT, pKa AND THE FACT THAT THIS IS NOT ONE COMPOUND
    # ---------------------------------------------------------------------
    # Naphthenic acid is a refinery by-product and a MIXTURE, so `formula`
    # is a placeholder and `molecular_weight` is an average that varies
    # between lots. Q1 Table 2.42: average MW 200-300 (Q1 Table 2.1 says
    # 200-400); acid value 180-230 mg KOH/g, which by 56100/acid_value gives
    # MW 244-312. 270 is the middle of the 244-300 overlap of those two
    # ranges. At density 0.96 that makes neat naphthenic acid 3.56 M, so the
    # 0.5 M reference here is 14% v/v -- inside Q1's validated 10-30% v/v
    # window, at its low end.
    # pKa 5.5 is Q1's value. Published pKa values for naphthenic acids scatter
    # widely because the composition does; higher apparent values are reported
    # for two-phase systems. 5.5 is what the rest of this record is consistent
    # with. Q1 also notes Q1 Table 2.42 water solubility < 0.09 g/L at pH 4 --
    # the saponified salt is far more soluble, and solvent loss to the
    # raffinate is a real operating cost this record does not carry.
    #
    # ---------------------------------------------------------------------
    # VALIDITY WINDOW
    # ---------------------------------------------------------------------
    #   pH 4.0-5.5, hydrochloric medium, [HA] 10-30% v/v (0.36-1.07 M at the
    #   MW and density above), saponified ~80% with NH4OH, WITH an alcohol or
    #   petroleum-sulfoxide modifier, 288-313 K, aqueous [RE] below the
    #   capacity limit above.
    # BELOW pH 4: D falls 1000x per pH unit (b = 3) and, at high [RECl3], Q1
    #   Eq. 2.91 says the mechanism CHANGES to neutral coordination of RECl3 --
    #   a different reaction this record does not describe.
    # ABOVE pH 5.6: RE3+ hydrolyzes, the extracted species becomes RE(OH)A2
    #   (Q1 Eq. 2.90), the HA:RE ratio drops below 3, and the solvent
    #   emulsifies. b = 3 is wrong there.
    # ANION: Q1 gives the medium effect as NO3- < Cl- < SO4(2-). These numbers
    #   are CHLORIDE. They will under-predict a sulfate system and
    #   over-predict a nitrate one, by an amount no retrieved source
    #   quantifies.
    # SALTING-OUT AGENTS shift the ladder NON-UNIFORMLY (Q1 Fig. 2.79: adding
    #   NH4NO3/LiNO3 raises heavy-RE D and lowers light-RE D). The anchor is
    #   a chloride system with NO salting-out agent and Z1 Table 4.36 names
    #   none. Do not use this record with a salting-out agent: it would move
    #   the two ends of the ladder in opposite directions, which is exactly
    #   the quantity no retrieved source gives.
    #
    # ---------------------------------------------------------------------
    # USE FOR / DO NOT USE FOR
    # ---------------------------------------------------------------------
    # USE FOR:
    #   - that Y is the least-extracted rare earth here and reports to the
    #     raffinate -- the qualitative fact the whole flowsheet rests on
    #   - SEPARATION FACTORS anywhere in the validity window: these are the
    #     anchor's measured betas and do not depend on b (see THE
    #     SAPONIFICATION GAP)
    #   - absolute D NEAR pH 4.19, where the anchor was measured
    #   - stage counts, which are driven by beta
    #   - trend, sensitivity and gradient-based structure studies
    #   - showing that naphthenic acid cannot separate adjacent lanthanides
    # DO NOT USE FOR:
    #   - any published stage count, sizing, purity or recovery number
    #   - a La/Y split (beta crosses 1; see above)
    #   - the lanthanide-lanthanide elution ORDER (the real one is scrambled)
    #   - temperature studies (d = 0 is a gap, not a measurement)
    #   - sulfate or nitrate media, or any system with a salting-out agent
    #   - an unmodified solvent at realistic loading (it third-phases)
    #   - regressing equilibrium constants against these numbers
    #   - Versatic 10 or any sterically hindered acid (Y inverts)
    #
    # ---------------------------------------------------------------------
    # UNRETRIEVED SOURCES -- THE HIGHEST-VALUE FOLLOW-UP, IN ORDER
    # ---------------------------------------------------------------------
    # The `a` ladder is no longer constructed, so these are no longer needed
    # to build it. Their value now is CORROBORATION AND EXTENSION: a second
    # measured full-series table would test Z1 Table 4.36, which is at
    # present a single unreplicated source for every per-element number in
    # this record. All three are paywalled with no open-access copy and NONE
    # was used. In priority order:
    #
    #   1. Zheng, D., Gray, N.B., Stevens, G.W. (1991), "Comparison of
    #      naphthenic acid, Versatic acid and D2EHPA for the separation of
    #      rare earths", Solvent Extr. Ion Exch. 9(1), 85-102.
    #      DOI 10.1080/07366299108918044.
    #      *** THE RIGHT SYSTEM: naphthenic acid, CHLORIDE medium, La/Dy/Yb/Y.
    #      Four elements spanning the series is enough to replace the slope
    #      AND the level. Get this one first. ***
    #   2. du Preez, A.C. & Preston, J.S. (1992), "The solvent extraction of
    #      rare-earth metals by carboxylic acids", Solvent Extr. Ion Exch.
    #      10(2), 207-230. DOI 10.1080/07366299208918101.
    #      Full La-to-Lu plus Y pH0.5 values for naphthenic acid AND Versatic
    #      10, in xylene from NITRATE media. pH0.5 converts straight into this
    #      record: at D = 1 and equal phase volumes, a = -3*pH0.5. Needs a
    #      nitrate-to-chloride and a xylene-to-aliphatic correction, neither
    #      of which any retrieved source quantifies.
    #   3. Preston, J.S. (1985), "Solvent extraction of metals by carboxylic
    #      acids", Hydrometallurgy 14(2), 171-188.
    #      DOI 10.1016/0304-386X(85)90032-5. Broader, earlier, same group.
    #
    # Q1 Fig. 2.79 (D-vs-Z, three salting-agent levels) remains undigitized.
    # It is no longer needed to LEVEL the ladder -- Z1 Table 4.36 does that
    # with measurements -- but it is still the only source for how the ladder
    # MOVES when a salting-out agent is added, which Q1 says it does
    # non-uniformly (lights down, heavies up). Digitize it before buying
    # anything, and before modelling any NH4Cl-loaded feed.
    ph_coefficients:
      # a = log10(D) - 12.4327, D from Z1 Table 4.36 system 1 (0.45 mol/L
      # naphthenic acid, 0.142 mol/L RE, pH 4.19, O/A 2/1, 25 C).
      # b = 3.0 is Q1 Eq. 2.88. c and d are NOT measured; see below.
      # Trailing comment on each line is the MEASURED D that produced it.
      La: {a: -13.2774, b: 3.0, c: 0.0, d: 0.0}  # D 0.143  beta_La/Y 1.22 -- ANOMALOUS, see La/Y warning
      Ce: {a: -13.0418, b: 3.0, c: 0.0, d: 0.0}  # D 0.246  beta 2.10
      Pr: {a: -12.9012, b: 3.0, c: 0.0, d: 0.0}  # D 0.340  beta 2.91
      Nd: {a: -12.8074, b: 3.0, c: 0.0, d: 0.0}  # D 0.422  beta 3.61 (printed beta 2.35 rejected)
      Sm: {a: -12.6410, b: 3.0, c: 0.0, d: 0.0}  # D 0.619  beta 5.29 -- MAXIMUM of the series
      Eu: {a: -12.7093, b: 3.0, c: 0.0, d: 0.0}  # D 0.529  beta 4.52
      Gd: {a: -12.8157, b: 3.0, c: 0.0, d: 0.0}  # D 0.414  beta 3.54
      Tb: {a: -12.8168, b: 3.0, c: 0.0, d: 0.0}  # D 0.413  beta 3.53
      Dy: {a: -12.8645, b: 3.0, c: 0.0, d: 0.0}  # D 0.370  beta 3.16
      # Ho-Lu are NOT in data/elements.yaml yet. They are written here because
      # a yttrium record without them is useless -- the industrial separation
      # is Y against Ho/Er/Tm/Yb/Lu. They are unreachable until elements.yaml
      # gains them. Unlike the superseded ladder, these are NOT extrapolations:
      # Z1 Table 4.36 measures all five directly.
      Ho: {a: -12.9513, b: 3.0, c: 0.0, d: 0.0}  # D 0.303  beta 2.59
      Er: {a: -13.0161, b: 3.0, c: 0.0, d: 0.0}  # D 0.261  beta 2.23
      Tm: {a: -13.0331, b: 3.0, c: 0.0, d: 0.0}  # D 0.251  beta 2.15
      Yb: {a: -13.0296, b: 3.0, c: 0.0, d: 0.0}  # D 0.253  beta 2.16
      Lu: {a: -13.0672, b: 3.0, c: 0.0, d: 0.0}  # D 0.232  beta 1.98 (printed beta 2.19 rejected)
      # Y is measured like the rest; it is the reference only because every
      # beta in this file is quoted against it. Its D is the LOWEST of the
      # fifteen, which is the entire reason this extractant is used.
      Y:  {a: -13.3645, b: 3.0, c: 0.0, d: 0.0}  # D 0.117  beta 1.00 by definition

    # ALL ZERO = NO DATA. Not a measurement that dD/dT is zero. See the
    # d = 0.0 block above. The true values are probably positive (exothermic).
    temperature_coefficients:  # d values in K
      La: 0.0   # NO DATA
      Ce: 0.0   # NO DATA
      Pr: 0.0   # NO DATA
      Nd: 0.0   # NO DATA
      Sm: 0.0   # NO DATA
      Eu: 0.0   # NO DATA
      Gd: 0.0   # NO DATA
      Tb: 0.0   # NO DATA
      Dy: 0.0   # NO DATA
      Ho: 0.0   # NO DATA
      Er: 0.0   # NO DATA
      Tm: 0.0   # NO DATA
      Yb: 0.0   # NO DATA
      Lu: 0.0   # NO DATA
      Y:  0.0   # NO DATA

    valid_ph_range: [4.0, 5.0]   # Q1's stated slope-3 verification range is pH 3.8-5.0;
                                 # the measured anchor is pH 4.19. See THE SAPONIFICATION GAP.
    valid_temp_range: [288, 313]  # deliberately narrow: there is NO T data
    reference_concentration: 0.5  # 14% v/v at MW 270 / density 0.96
    concentration_exponent: 3.0   # Q1 Eq. 2.88, cube law in FREE extractant
    # Commodity refinery by-product; the cheapest extractant in this file by
    # an order of magnitude, which is most of why the industry uses it.
    cost_usd_kg: 1.0
    saponification:
      counter_ion: NH4        # Q1: NH4OH or NaOH; NH4 puts N in the raffinate
      degree: 0.80            # Q1 Sec. 2.4.2.1, industrial Y separation
      log10_K: null           # calibrate; no measured constant retrieved
      reference_pH: 4.5
      reference_counter_ion: 0.1

# Diluent properties
diluents:
  kerosene:
    density: 0.80  # g/mL
    viscosity: 1.64  # cP at 25°C
    cost_usd_L: 1.0

  n-heptane:
    density: 0.684
    viscosity: 0.39
    cost_usd_L: 2.5

  Shellsol_D70:
    density: 0.79
    viscosity: 1.7
    cost_usd_L: 1.5

  n-dodecane:
    density: 0.75
    viscosity: 1.34
    cost_usd_L: 2.0

# Modifiers (phase transfer catalysts)
modifiers:
  TBP_modifier:
    description: "TBP added to acidic extractants to improve phase separation"
    typical_concentration: 0.05  # 5% v/v
    effect: "Reduces third phase formation, improves kinetics"

  isodecanol:
    description: "Alcohol modifier for acidic extractants"
    typical_concentration: 0.05
    effect: "Prevents crud formation, improves phase disengagement"

# ---------------------------------------------------------------------------
# PROVENANCE
#
# This is the machine-readable form of the "TWO DIFFERENT KINDS OF NUMBER"
# warning at the head of this file. `pattern` is a dotted path with `*` as a
# single-segment wildcard; the MOST SPECIFIC matching rule wins. `source` is a
# key in sources.yaml. Resolve with:
#
#     >>> from difflow_ree.provenance import explain, audit
#     >>> explain("extractants", "extractants.naphthenic_acid.ph_coefficients.Dy.a")
#     >>> audit("extractants", cls="HAND_TUNED")   # everything with no basis
#
# THE ONE THING TO KNOW: of the five extractants here, exactly two carry
# coefficients traceable to a named table -- naphthenic_acid (Z1) and TBP
# (K05/GP19). D2EHPA, PC88A and Cyanex272 do not. Their numbers were invented
# to make demos look right and are tagged HAND_TUNED so that a query, not a
# careful reading, is enough to notice.
# ---------------------------------------------------------------------------
provenance:
  rules:
    # --- defaults: anything not matched more specifically ------------------
    - {pattern: "extractants.*.*", source: HAND_TUNED}
    - {pattern: "extractants.*.*.*", source: HAND_TUNED}
    - {pattern: "extractants.*.*.*.*", source: HAND_TUNED}

    # --- molecular identity and bulk properties ---------------------------
    # True of the molecule, not of any extraction experiment. Catalogue-grade.
    - {pattern: "extractants.*.full_name",         source: DEF}
    - {pattern: "extractants.*.alternative_names", source: DEF}
    - {pattern: "extractants.*.formula",           source: DEF}
    - {pattern: "extractants.*.type",              source: DEF}
    - {pattern: "extractants.*.mechanism",         source: DEF,
       note: "Normalized from `type` per the mapping at the head of this file."}
    - {pattern: "extractants.*.molecular_weight",  source: CRC}
    - {pattern: "extractants.*.density",           source: CRC}
    - {pattern: "extractants.*.pKa",               source: CRC}

    # --- stoichiometry ----------------------------------------------------
    - {pattern: "extractants.*.stoichiometry.*", source: DEF,
       note: "Follows from the declared mechanism: 3 protons per RE(III) for
              cation exchange, 0 and requires_nitrate for solvating."}

    # --- operating choices, not measurements ------------------------------
    - {pattern: "extractants.*.typical_concentration",    source: CONV}
    - {pattern: "extractants.*.reference_concentration",  source: CONV,
       note: "The concentration at which `a` is defined. A normalization
              choice; changing it changes `a` by n*log10(ratio)."}
    - {pattern: "extractants.*.reference_nitrate",        source: CONV}
    - {pattern: "extractants.*.diluents",                 source: CONV}
    - {pattern: "extractants.*.cost_usd_kg",              source: EST,
       note: "*** NOT A QUOTED PRICE. *** Indicative only, same warning as the
              element prices. Solvent inventory cost is one of the larger
              terms in a TEA; substitute a dated quote before publishing one."}

    # --- saponification (#197) --------------------------------------------
    - {pattern: "extractants.*.saponification.degree", source: CONV,
       note: "A DEFAULT OPERATING POINT, not a property. 0.30-0.50 is the
              industrial range; 0.35 is the mid-range default used here.
              Overridden by a Saponifier, a section, or an optimizer."}
    - {pattern: "extractants.*.saponification.counter_ion",           source: CONV}
    - {pattern: "extractants.*.saponification.reference_pH",          source: CONV}
    - {pattern: "extractants.*.saponification.reference_counter_ion", source: CONV}
    - {pattern: "extractants.*.saponification.log10_K",               source: CALC,
       note: "null ships here on purpose: NO MEASURED SAPONIFICATION CONSTANT
              IS IN THIS REPOSITORY. It is inverted at build time from
              K = S/(1-S) * [H+]/[M+] at the declared reference condition, so
              it restates the declared degree rather than reporting a fit."}

    # ======================================================================
    # (1) HAND-TUNED, NO SOURCE -- D2EHPA, PC88A, Cyanex272
    # ======================================================================
    - {pattern: "extractants.D2EHPA.ph_coefficients.*.*",           source: HAND_TUNED}
    - {pattern: "extractants.D2EHPA.temperature_coefficients.*",    source: HAND_TUNED}
    - {pattern: "extractants.PC88A.ph_coefficients.*.*",            source: HAND_TUNED}
    - {pattern: "extractants.PC88A.temperature_coefficients.*",     source: HAND_TUNED}
    - {pattern: "extractants.Cyanex272.ph_coefficients.*.*",        source: HAND_TUNED}
    - {pattern: "extractants.Cyanex272.temperature_coefficients.*", source: HAND_TUNED}
    - {pattern: "extractants.D2EHPA.valid_ph_range",                source: HAND_TUNED}
    - {pattern: "extractants.PC88A.valid_ph_range",                 source: HAND_TUNED}
    - {pattern: "extractants.Cyanex272.valid_ph_range",             source: HAND_TUNED}

    # ======================================================================
    # (2) LITERATURE-DERIVED -- TBP nitrate block
    # ======================================================================
    - {pattern: "extractants.TBP.nitrate_coefficients.*.a", source: K05,
       locus: "Table 1, p. 92",
       note: "Free acidity 0.2001 N, TBP in kerosene, equal phase volumes,
              35 +/- 1 C, corrected to the declared reference_nitrate. The
              per-element split between measured, interpolated and assumed is
              written element-by-element on the TBP record above."}
    - {pattern: "extractants.TBP.nitrate_coefficients.*.b", source: K05,
       locus: "Table 1, p. 92"}
    - {pattern: "extractants.TBP.nitrate_coefficients.*.c", source: CONV,
       note: "Fixed at 0. No source resolves curvature in log10[NO3-];
              a zero here is a declared absence, not a fitted flat."}
    - {pattern: "extractants.TBP.nitrate_coefficients.*.d", source: GP19,
       locus: "Table 1"}
    - {pattern: "extractants.TBP.temperature_coefficients.*", source: GP19,
       locus: "Table 1",
       note: ">>> ONE ELEMENT APPLIED TO FIFTEEN. <<< dH = -43.3 +/- 6.2
              kJ/mol was measured for Sm alone and is used for the whole
              series, so every non-Sm temperature coefficient in this block
              is an assumption, not a measurement. Fidelis (1970),
              J. Inorg. Nucl. Chem. 32, 997, would supply the real series and
              is the single highest-value follow-up for this record."}
    - {pattern: "extractants.TBP.valid_ph_range",   source: TW54,
       locus: "Tables II and IV, 8.5-17.4 N"}
    - {pattern: "extractants.TBP.valid_temp_range", source: GP19,
       locus: "283-326 K"}

    # ======================================================================
    # (3) LITERATURE-DERIVED -- naphthenic acid
    # ======================================================================
    - {pattern: "extractants.naphthenic_acid.ph_coefficients.*.a", source: Z1,
       locus: "Sec. 4.7, Table 4.36, system 1",
       note: "0.45 mol/L naphthenic acid, 0.142 mol/L RE, pH 4.19, O/A 2/1,
              25 C. a = log10(D) - 12.4327 where 12.4327 = 3*4.19 - 3*log10
              (0.45/0.5). SEPARATION FACTORS FROM THIS BLOCK ARE SOUND
              ANYWHERE IN THE VALIDITY WINDOW -- they are the anchor's own
              measured betas. ABSOLUTE D IS SOUND ONLY NEAR pH 4.19."}
    - {pattern: "extractants.naphthenic_acid.ph_coefficients.*.b", source: Q1,
       locus: "Eq. 2.88",
       note: "lg D = lg K_ex + 3 lg(HA)o + 3 pH, verified pH 3.8-5.0. *** THE
              SLOPE IS AGAINST FREE EXTRACTANT (Eq. 2.89), WHICH DIFFLOW DOES
              NOT TRACK; and Z1's own two tabulated systems imply an apparent
              slope of 0.374, not 3.0, because the industrial circuit is
              80% saponified (Z1 Eq. 4.96 releases NH4+, not H+). difflow has
              no counter-ion-exchange mechanism. THIS IS THE KNOWN GAP."}
