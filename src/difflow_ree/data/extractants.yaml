# Extractant Properties and Distribution Correlations
#
# EXTRACTION MECHANISM (#195)
# Every extractant declares a normalized `mechanism:` key. It is the mechanism,
# not the code, that decides which coefficient block drives D:
#
#   mechanism: cation_exchange -> driven by `ph_coefficients`
#     RE3+ + p(HA)2 <-> RE(HA2)p + p H+
#   mechanism: solvating       -> driven by `nitrate_coefficients`
#     RE(NO3)3 + m S <-> RE(NO3)3.mS   (no protons released)
#
# The mapping from the free-form `type:` field is:
#   acidic_phosphoric / acidic_phosphonic / acidic_phosphinic /
#   acidic_carboxylic  -> cation_exchange
#   solvating_neutral  -> solvating
# `mechanism:` is stated explicitly on every record so it is data rather than
# an inference; difflow_ree.database.normalize_mechanism reproduces the mapping
# for records that omit it.
#
# CATION-EXCHANGE MODEL (`ph_coefficients`):
#   log10(D) = a + b*pH + c*pH^2 + d*(1/T - 1/Tref) + <concentration term>
#
# where the concentration term is one of two forms, chosen by whether the
# record declares an `activity_coefficient_A` (#270):
#
#   absent   n * log10(C / C_ref)                        <- total concentration
#   present  n * [log10(C/C_ref) - A(sqrt C - sqrt C_ref)]  <- effective, y*C
#                                                             log10 y* = -A sqrt C
#
# Both are zero at C_ref, so `a` is log10(D) at the reference concentration
# either way. The field travels WITH the coefficient block: a record fitted
# on the total-concentration form must not have the effective one applied to
# it. Only PC88A carries it. See Extractant.log10_concentration_factor.
#
# where:
#   D = [REE]_org / [REE]_aq
#   pH = -log10([H+])       <- CONCENTRATION SCALE, not the activity scale (#194)
#   T = temperature (K)
#
# pH SCALE AND ACTIVITY CONVENTION (#194)
# `pH` here is -log10 of the free proton *concentration*. These are conditional
# correlations: the a/b/c coefficients are fitted at the ionic strength of the
# reported experiments and already absorb the activity coefficients at that
# ionic strength. Consequently:
#   - The defensible default is NO activity correction at all
#     (REEDistribution(..., ionic_strength=None)), i.e. a conditional constant
#     used at the ionic strength it was fitted at. This is the right choice for
#     a 2-4 M chloride leach liquor.
#   - If a correction to a different ionic strength is requested, it must be
#     gamma_RE / gamma_H**p on the concentration scale, with p =
#     stoichiometry.protons_released, NOT gamma_RE alone. Davies is only valid
#     for I < 0.5 M and difflow_ree reports outside that range.
#   - Davies does not merely lose accuracy above 0.5 M. Its bracket
#     f(I) = sqrt(I)/(1+sqrt(I)) - 0.3 I changes SIGN at I = 1.940363884733242 M
#     (the root of 0.3 I + 0.3 sqrt(I) - 1 = 0), above which
#     gamma_RE/gamma_H**3 = 10**(-6 A f) exceeds 1 and the correction
#     MULTIPLIES D: 0.228 at I = 0.1 M, 0.245 at 1.0 M, 6.49 at 3.0 M, 42.5 at
#     4.0 M. difflow_ree therefore clamps the ionic strength it feeds the
#     activity model at the model's documented limit, so the correction
#     saturates rather than inverting, unless the caller explicitly passes
#     extrapolate_activity_model=True (#194).
#
# COUNTER-ION-EXCHANGE MODEL (`counter_ion_coefficients`) (#266):
#   log10(D) = a - p*log10([M+]/reference_counter_ion) + d*(1/T - 1/Tref)
#
# This is the reaction a SAPONIFIED circuit actually runs (Z1 Eq. 4.96, Q1
# Eq. 2.120):
#
#     HL(o) + NH4OH = NH4L(o) + H2O          <- saponification, separate step
#     RE3+ + 3 NH4L(o) = REL3(o) + 3 NH4+    <- the extraction
#
# No proton appears on either side of the second, so pH is not its driving
# variable and a `b` of 3 on `ph_coefficients` is a slope on the wrong axis
# rather than a slope that is too large.
#
# The slope `p` is the counter-ion released per mol REE, taken from the
# record's stoichiometry rather than fitted per element -- which is why a
# SEPARATION FACTOR is exactly independent of [M+]: the term cancels in
# D_A/D_B. `reference_counter_ion` is the [M+] the `a` values were measured
# at and has NO DEFAULT: no source cited here reports one, and a plausible
# anchor would scale every D under it.
#
# No record below carries this block. The mechanism exists so that a record
# measured on a saponified system has somewhere to put its real correlation;
# each acidic record declares `correlation_basis: unsaponified` to say that
# its pH slope means what a pH slope means.
# REFERENCE CONDITIONS, AND WHY THEY ARE DECLARED (#268)
# Every record states the condition its correlation is *anchored* at:
# `reference_concentration` for the extractant charge, and `reference_pH`
# (cation exchange) or `reference_nitrate` (solvating) for the driving
# variable. These are the basis for any quantity DERIVED from the
# correlation -- the Langmuir constants in equilibrium/loading.py are
# computed at them rather than stored as literals, which is how those
# literals came to describe an extractant the database no longer contained
# (three of four were reconcilable with the coefficients at NO pH, off by
# factors of 4-8).
#
# The `reference_pH` values below are the conditions
# `data/separation_factors.yaml` already declares as typical operating for
# the same extractant -- restated here, where a derived quantity can reach
# them, rather than newly invented. They are a DECLARED BASIS, not a
# measured anchor: changing one changes every derived quantity under it,
# which is the point of having it written down.
#
# SOLVATING MODEL (`nitrate_coefficients`):
#   log10(D) = a + b*log10([NO3-]/reference_nitrate)
#              + c*log10([NO3-]/reference_nitrate)^2
#              + d*(1/T - 1/Tref)
#
# so `a` is log10(D) AT the reference nitrate concentration and `b` is the
# nitrate slope d log10(D) / d log10([NO3-]). There is no pH term.
#
# PROVENANCE OF THE COEFFICIENTS -- TWO DIFFERENT KINDS OF NUMBER
#
# This file contains coefficient blocks of two DIFFERENT provenances. They
# must not be mistaken for one another:
#
#   (1) HAND-TUNED, NO SOURCE  -- the `temperature_coefficients` of D2EHPA,
#       PC88A and Cyanex272. That is now the whole list.
#       They were chosen to look plausible and no fit, dataset or table is
#       recorded for any of them anywhere in this repository. They are
#       illustrative, not measured. A D computed at 298.15 K from any acidic
#       record is sourced; the same D at 333 K is not. Do not cite them, do
#       not regress enthalpies of extraction against them, and do not use a
#       temperature sensitivity from this file for design.
#       Every source behind the three refitted pH blocks is ISOTHERMAL, which
#       is why none of them could retire these. Retiring them needs a
#       variable-temperature dataset that nobody has retrieved yet.
#
#   (2) LITERATURE-DERIVED    -- everything else that matters: TBP's
#       `nitrate_coefficients` and `temperature_coefficients`; the
#       `ph_coefficients`, `valid_ph_range` and `reference_pH` of D2EHPA,
#       PC88A and Cyanex272; PC88A's `activity_coefficient_A`; D2EHPA's
#       fitted `concentration_exponent` (#283); and naphthenic_acid's
#       `ph_coefficients`.
#       Refitted from named, retrievable primary sources; the sources are
#       enumerated with what each one supplied and what it did not, the
#       correction arithmetic is written out, the per-element provenance
#       (measured vs interpolated vs assumed) is stated, and so are the
#       validity window and the known gaps. Read the block on the record
#       before using a number from it.
#
# The three acidic pH blocks are NOT equally strong, and each record says so
# in its own words. In one line each:
#   PC88A      121 digitized points, five measured elements, five
#              interpolated, one isothermal source that IS this record's
#              system. The strongest block in the file.
#   D2EHPA     54 digitized points in n-heptane (Y, Tm, Lu; a pH series
#              at constant ionic strength and a concentration series) for
#              the level and the concentration exponent, Peppard 1957's
#              spacing for the shape, and X95's kerosene La point held out
#              as a check it meets to 0.105 decades (#283). Four elements
#              interpolated. Both sources are read from redrawn figures.
#   Cyanex272  Two sources that cannot be joined without a seam: the level
#              from six Pr/Nd rows with measured equilibrium pH, the shape
#              from a fifteen-element table whose extractant concentration
#              is not printed. The seam is 0.09 decades and is quantified
#              on the record.
#
# COMPARING ACROSS THE ACIDIC RECORDS (#270)
#
# Before #270 this header carried a warning that the three acidic records
# were not on a common basis and that their relative strengths came out
# BACKWARDS. All three now derive from named sources, and the ordering has
# inverted to the physically correct one:
#
#            pH at which D(Nd) = 1
#            at the record's        at a common 1.0 M
#            own reference charge   nominal charge     level source
#   D2EHPA         0.27                  0.27          M76 (via Q1 F2.1-2.2)
#   PC88A          1.03                  1.03          T21
#   Cyanex272      2.14                  1.91          L14
#
# which is the textbook order: the stronger the acid, the lower the pH at
# which it extracts (pKa 3.24, 4.10, 6.37 respectively). It also means the
# three records now differ by nearly two pH units of operating window, which
# is a real property of these reagents and not an artifact.
#
# What is safe, and what is not:
#   SAFE      -- separation factors, cascade behaviour and design pH within
#                one record; and now, with the caveats each record states,
#                the ORDERING of the three by extraction strength.
#   NOT SAFE  -- a cross-record ratio of D quoted to better than a few
#                tenths of a decade. D2EHPA's light-end level is placed from
#                Y through a toluene spacing (#283), and Cyanex272's rests on
#                a two-source join. Both records quantify their own error bar;
#                use those numbers rather than assuming the blocks are
#                interchangeable.
#   NOT SAFE  -- anything at a temperature other than 298.15 K, for any
#                acidic record. See (1) above.
#
# Reading consulted qualitatively across all three refits, NOT the source of
# any specific number here:
# - Gupta & Krishnamurthy (2005) Extractive Metallurgy of Rare Earths
# - Xie, Zhang, Dreisinger & Doyle (2014) Miner. Eng. 56, 10
# - Peppard et al. (1957) J. Inorg. Nucl. Chem. 4, 334 -- no longer only
#   consulted: since #283 it is the D2EHPA record's SHAPE (source P57,
#   read through Stevenson & Nervik 1961), which settled the 3.5e5 vs 6.4e4
#   Lu/La discordance #270 recorded in Peppard's favour
# - Peppard et al. (1969) J. Inorg. Nucl. Chem. 31, 2271 (the tetrad effect,
#   which is why a smooth curve through atomic number is imperfect)

# SAPONIFICATION (#197)
#
# Every acidic (cation-exchange) record below carries a `saponification:`
# block. Industrial rare-earth circuits neutralize 30 to 50% of the acidic
# extractant BEFORE it enters the cascade,
#
#     HA_org + NaOH -> NaA_org + H2O
#
# so extraction is a counter-ion exchange rather than a proton exchange:
#
#     RE3+ + 3 NaA_org <-> RE(A)3_org + 3 Na+
#
# `degree` is a DEFAULT OPERATING POINT, not a property of the molecule: it is
# the primary manipulated variable of the circuit, and a Saponifier, a section
# or an optimizer overrides it. 0.30-0.50 is the industrial range; 0.35 is used
# here as the mid-range default. `counter_ion` decides which effluent the plant
# produces -- ammonium nitrogen (NH4) or a saline raffinate (Na, Mg).
#
# `log10_K: null` means "calibrate at build time", exactly as it does in
# reaction_networks.yaml: NO MEASURED SAPONIFICATION CONSTANT SHIPS HERE.
# difflow_ree.equilibrium.saponification.saponification_log_K inverts
#
#     K = S/(1-S) * [H+]/[M+]
#
# at the stated `reference_pH` and `reference_counter_ion`, so the constant is
# a restatement of the declared degree at a declared condition rather than a
# number from a paper. Supply a measured constant for design numbers.
#
# Background: Banda, Jeon & Lee, J. Ind. Eng. Chem. 21 (2015) 436,
# doi:10.1016/j.jiec.2014.03.002 (Nd/Pr separation with saponified PC-88A);
# Liao et al., J. Rare Earths 31 (2013) 331, doi:10.1016/S1002-0721(12)60281-6
# (clean separation technologies and the effluent consequences of the
# saponification route). Consulted qualitatively for the 30-50% range and the
# effluent argument; NOT the source of any number in this file.

extractants:
  D2EHPA:
    full_name: "Di-2-ethylhexyl phosphoric acid"
    alternative_names: [HDEHP, P204, DEHPA]
    formula: "(C8H17O)2PO2H"
    molecular_weight: 322.43  # g/mol
    density: 0.975  # g/mL
    pKa: 3.24  # in aqueous
    type: acidic_phosphoric
    mechanism: cation_exchange  # normalized from type (#195)
    diluents: [kerosene, n-heptane, Shellsol_D70]
    typical_concentration: 0.5  # M in organic phase

    # Extraction mechanism: REE³⁺ + 3(HA)₂ ⇌ REE(HA₂)₃ + 3H⁺
    # basis: dimer -> extractant_molecules counts (HA)₂ dimers, so the
    # capacity in monomer equivalents is 3 * 2 = 6 mol D2EHPA per mol REE
    # (max_loading = 1/6). D2EHPA is dimeric in aliphatic diluents at the low
    # to moderate loadings these correlations cover; the monomeric (m = 3)
    # stoichiometry is reported at high loading and in polar diluents. See #191.
    stoichiometry:
      protons_released: 3
      extractant_molecules: 3  # as dimers
      basis: dimer

    # *** REFITTED AGAINST AN ALIPHATIC pH SERIES (#283), after #270. ***
    #
    # #270 replaced a hand-tuned block with one measured D (X95's La in
    # kerosene) for the LEVEL and PPH63's chromatographic separation factors
    # for the SHAPE, and said plainly that the level rested on one number and
    # that three routes to it disagreed by up to 1.7 decades. #283 replaces
    # both halves. The level is now FITTED to 54 digitized points in an
    # aliphatic diluent at stated charges; the shape is Peppard 1957's; and
    # X95's La point, which used to be the level, is held out as the check.
    #
    # SOURCES
    #   S1  M76 -- Mason, J. Inorg. Nucl. Chem. 38 (1976) 2077, as Q1
    #       Figs. 2.1 and 2.2 (p. 191; Q1 prints the author as "Masin").
    #       HDEHP in n-HEPTANE, tracer Y, Tm and Lu.
    #       Fig. 2.1: log D vs log[H+] at CONSTANT ionic strength, 1.0 M
    #         (NaCl + HCl), at stated charges (Lu 0.0094, Y 0.01875, Tm
    #         0.0133 mol/L), 27 points over pH -0.02 to 1.15.
    #       Fig. 2.2: log D vs log[HDEHP] at 0.5 M HCl (Tm, Y) and 1.0 M
    #         HCl (Lu), 27 points over 0.0093 to 0.18 mol/L.
    #       SUPPLIED: the LEVEL (Y directly; Tm and Lu through the shape) and
    #       the CONCENTRATION EXPONENT. Tracer-level, so the phase ratio the
    #       caption does not state cannot enter D, and [H+] is not moved by
    #       the extraction -- equilibrium and initial acidity are the same.
    #       DID NOT SUPPLY: any light or middle lanthanide, and a temperature
    #       (not stated in the reprint).
    #   S2  P57 -- Peppard, Mason, Maier & Driscoll, J. Inorg. Nucl. Chem. 4
    #       (1957) 334, as SN61 Fig. 51 (Stevenson & Nervik 1961), digitized
    #       from the scan: log D for La, Ce, Pr, Pm, Eu, Tb, Tm, Yb, Lu and Y
    #       at 0.75 M HDEHP / toluene / 0.5 M HCl, sd 0.023 about the
    #       straight line log D = -25.696 + 0.3977 Z the source asserts.
    #       SUPPLIED: the SHAPE -- every element's offset from Y. Toluene
    #       sets no level here; only DIFFERENCES between elements are used.
    #       Nd, Sm, Gd and Dy carry no marker and are read off the line.
    #   S3  Z1 Eqs. (4.11), (4.12), (4.27)-(4.31) -- the model form, as
    #       before. Not data.
    #
    # WHAT CHANGED, AND WHY THE THREE ROUTES DISAGREED
    #   Two things were wrong, and neither was the X95 number itself.
    #   (1) THE CONCENTRATION LAW. M76 Fig. 2.2 measures d(log D)/d(log C)
    #       = 2.382 +/- 0.011 over 0.0093-0.18 M in heptane (printed "lines
    #       of slope 2.5"; the drawn lines digitize to 2.37-2.40 as well).
    #       An Alstad sqrt(C) form -- what PC88A carries -- fits worse, rms
    #       0.059 against 0.021, with systematic curvature, and with both
    #       free its A goes to zero. So on this reagent the law is a power,
    #       not the ideal cube. The routes through an equilibrium constant
    #       measured at ~0.01 M (C98's hexane lg Kex, and M76 read the same
    #       way) carried the CUBE across the 1.7-2.0 decades between M76's
    #       charges and C_ref; 0.62 per decade of excess slope over that span
    #       is 1.1-1.2 decades, most of the 1.26-1.73 #270 recorded.
    #   (2) THE SHAPE. PPH63's cumulative Lu/La is 6.4e4 (2.20 per step);
    #       P57's is 3.4e5 (2.48 per step, matching the 3.5e5 and 2.49 Q1
    #       quotes from it). Three things decide for P57:
    #         - C98, measured in n-HEXANE, runs Pr to Yb at 0.393 decades per
    #           Z (2.47 per step) and in cyclohexane at 0.407 (2.55); P57 is
    #           0.398, PPH63 0.342. The aliphatic series has P57's slope.
    #         - M76's own spacing: Tm - Y = 0.670 and Lu - Y = 1.267 against
    #           P57's 0.614 / 1.358 and PPH63's 0.475 / 1.129.
    #         - Joining X95's La to M76's level NEEDS an exponent: 2.30
    #           under P57's shape, 1.95 under PPH63's. The measured value is
    #           2.38. PPH63's shape needs an exponent 0.43 below it: 40
    #           statistical standard errors, and nearly four times the 0.12
    #           between the digitized slope and the figure's printed 2.5.
    #       PPH63 is partition chromatography on HDEHP-Corvic, and a
    #       compressed series is what that measurement would give if the
    #       stationary phase is not a free solvent. It is kept as a registered
    #       source and supplies nothing here.
    #
    # THE LEVEL, WRITTEN OUT
    #   Model, dimer basis, C_ref = 0.5 M dimer = 1.0 M formal:
    #     log10 D = a + 3 pH + n log10(C / C_ref),   n = 2.38,  b pinned at 3
    #   Every M76 point gives a = log D - 3 pH - n log10(C_formal / 1.0):
    #     Y   a = 2.1942   se 0.016 (18 pts)   Fig. 2.1 2.141 / Fig. 2.2 2.247
    #     Tm  a = 2.8644   se 0.019 (18 pts)             2.801 /          2.928
    #     Lu  a = 3.4614   se 0.016 (18 pts)             3.512 /          3.411
    #   The two figures differ by 0.10-0.13 in opposite directions for Lu and
    #   for Y/Tm; they are different media (1.0 M (Na,H)Cl against HCl
    #   alone), and both are kept. Fig. 2.1's own pH slope is 3.14 +/- 0.01
    #   against the stoichiometric 3 it is pinned at.
    #   Level on P57's shape: L = mean(a_i - P57_i) over Y, Tm, Lu
    #     offsets 1.050, 1.106, 0.959  ->  L = 1.0387,  se 0.043
    #   and a_i = L + P57_i for every element except Y, which ships M76's
    #   own value.
    #
    # THE CHECK THAT WAS NOT FITTED -- X95, which USED TO BE the level.
    #   Q1 Table 2.6: D_La = 0.99 in KEROSENE at 1 mol/L P204 (the reference
    #   charge itself), 0.1 mol/L LaCl3, 0.003 mol/L HCl. Through Z1 Eq.
    #   (4.12) for the equilibrium pH (0.8175) and Eq. (4.11) for the free
    #   dimer (0.3508 M), now with n = 2.38:
    #     a_La = -0.0044 - 3(0.8175) + 2.38 log10(0.5/0.3508) = -2.0903
    #   against -1.9853 here: 0.105 decades, in the direction #270 predicted
    #   (the X95 route runs low; on PC88A it ran 0.61 low against T21). A
    #   different diluent, laboratory, element, charge and era. The phase
    #   ratio is still unstated: O/A 0.5 / 1 / 2 gives -2.451 / -2.090 /
    #   -1.856, so the check holds to 0.13 unless O/A was 0.5.
    #   Nothing was tuned to make this agree.
    #
    # WHAT DID NOT GO IN
    #   Sato 1989 (Q1 Figs. 2.6 and 2.54, Table 2.9): kerosene, full series,
    #   but its PC88A curve in the same figure sits 1.7 decades ABOVE T21 at
    #   La and 0.3 below at Dy -- a compressed, loaded series, not trace. It
    #   fails the control, so its D2EHPA curve sets nothing.
    #   C98's absolute lg Kex: its extractant charge is not printed, and with
    #   n = 2.38 a Kex is charge-dependent. Read at M76's charge it lands on
    #   this block within 0.04 for Pr and Dy, and +/-0.27 for Nd and Sm,
    #   which is C98's own Nd-above-the-chord anomaly -- a consistency, not
    #   evidence, until the charge is known.
    #   The #270 KNOWN GAP paragraph (three routes to a_Sm, 1.26 decades
    #   apart) is retired: (1) and (2) above account for it, and the new
    #   a_Sm, 0.000, sits between the old -0.235 and C98's +1.03.
    #
    # PER ELEMENT: WHAT IS MEASURED, WHAT IS NOT
    #   MEASURED level:        Y (M76, direct, 18 points).
    #   MEASURED spacing:      La, Ce, Pr, Eu, Tb -- a P57 marker each, placed
    #                          on L, which M76's Y, Tm and Lu set.
    #   INTERPOLATED:          Nd, Sm, Gd, Dy -- on P57's straight line, which
    #                          cannot represent the tetrad effect Q1 describes
    #                          (Peppard 1969). Weaker; see se below.
    #   ASSUMED:  b = 3.0 (stoichiometric; M76 measures 3.14), c = 0, d = 0,
    #     M76's charges read as FORMAL (monomer units, the Argonne
    #     convention; a dimer reading would move every level by
    #     2.38 log10 2 = 0.72), and room temperature.
    #
    # HOW GOOD IS IT
    #   se(a), log10 D units, statistical (level, P57 digitization, and n's
    #   uncertainty carried over the extrapolation to C_ref):
    #     Y 0.023;  La Ce Pr Eu Tb 0.052;  Nd Sm Gd Dy 0.134
    #   The interpolated four carry a tetrad allowance of 0.123, the largest
    #   deviation of PPH63's per-pair-resolved series from its own straight
    #   line at those four elements (Gd).
    #   SYSTEMATIC, shared by every element and not in se: the aliphatic
    #   diluent (C98's hexane and cyclohexane differ by 0.25-0.55), and the
    #   exponent over 0.18-1.0 M, which M76 does not cover (0.1 in n is
    #   0.08 in a at M76's top point). X95 bounds the NET of these at the
    #   reference charge: 0.105 at La.
    #
    # REMAINING GAP. The light end's LEVEL is not measured in an aliphatic
    # diluent: La-Tb are placed from Y through P57's toluene spacing, and
    # X95's single La point is the only aliphatic check on them. The primaries
    # of M76 and P57 are not on this machine either -- both are read from
    # redrawn figures. A measured light-lanthanide pH series in kerosene
    # would replace the shape with data where it matters most for Nd/Pr.
    #
    # D VALUES AT pH 0.5, 0.5 M DIMER FREE, TRACE LOADING:
    #   La 0.33, Ce 0.85, Pr 1.9, Nd 5.1, Sm 32, Eu 80, Gd 197,
    #   Tb 495, Dy 1233, Y 4944
    # At pH 0.82: La 3.0, Nd 46, Dy 1.1e4, Y 4.5e4.
    # These are the correlation's trace-loading inputs to `include_loading`
    # and `solve_free_extractant`, not plant numbers.
    ph_coefficients:
      # a = level L (M76 Y/Tm/Lu) + P57 spacing; b = 3.0 pinned, c = 0.
      # Y is M76's own value. se in the block above.
      La: {a: -1.9853, b: 3.0, c: 0.0, d: 0.0}
      Ce: {a: -1.5733, b: 3.0, c: 0.0, d: 0.0}
      Pr: {a: -1.2113, b: 3.0, c: 0.0, d: 0.0}
      Nd: {a: -0.7953, b: 3.0, c: 0.0, d: 0.0}   # interpolated, P57 line
      Sm: {a:  0.0001, b: 3.0, c: 0.0, d: 0.0}   # interpolated, P57 line
      Eu: {a:  0.4007, b: 3.0, c: 0.0, d: 0.0}
      Gd: {a:  0.7955, b: 3.0, c: 0.0, d: 0.0}   # interpolated, P57 line
      Tb: {a:  1.1947, b: 3.0, c: 0.0, d: 0.0}
      Dy: {a:  1.5909, b: 3.0, c: 0.0, d: 0.0}   # interpolated, P57 line
      Y:  {a:  2.1942, b: 3.0, c: 0.0, d: 0.0}   # measured (M76)

    # Temperature correction: add d*(1/T - 1/298.15) to log(D)
    #
    # STILL HAND_TUNED, and deliberately left alone by the #270 refit. Every
    # source behind the pH block above is ISOTHERMAL at 25 C, so none of them
    # can retire these. A D computed at 298 K from this record is now sourced;
    # one computed at 333 K is not.
    #
    # OPEN QUESTION (unresolved, numbers deliberately unchanged). The comment
    # line that used to sit here said "extraction is exothermic, D decreases
    # with T", but under log10 D = ... + d*(1/T - 1/Tref) with
    # d = -dH/(2.303 R), a NEGATIVE d is an ENDOTHERMIC dH -- these values
    # imply dH = +29 to +46 kJ/mol, i.e. D *rising* with T, the opposite of
    # the sentence. That may or may not be wrong: acidic organophosphorus REE
    # extraction is reported both ways depending on system, and unlike TBP
    # (see the TBP record, where the sign WAS refuted and fixed) no data was
    # retrieved here either way. So the sign is left as-is and flagged rather
    # than silently flipped. This needs its own literature pass before any of
    # these numbers move.
    temperature_coefficients:  # d values in K; sign unverified, see above
      La: -1500
      Ce: -1600
      Pr: -1700
      Nd: -1800
      Sm: -2000
      Eu: -2100
      Gd: -2200
      Tb: -2300
      Dy: -2400
      Y:  -2200

    # THE SOURCED WINDOW (#270). Was [1.0, 5.0], HAND_TUNED, and the upper
    # bound was chemical nonsense for this reagent: at pH 5 the refitted block
    # puts D(La) at 1e13. Every element is quantitatively in the organic
    # phase, no separation is possible, and no plant operates there.
    #
    # Upper bound 2.0: at the reference charge D(La) is already 1e4 there, so
    # 2.0 is generous rather than tight. Q1 Fig. 2.8 verifies the slope-3
    # behaviour up to lg[H+] = -1, i.e. pH 1, and since #283 M76 Fig. 2.1
    # measures it in n-heptane at constant ionic strength over pH -0.02 to
    # 1.15 (slope 3.14 +/- 0.01).
    # Lower bound 0.0: Q1 Fig. 2.9 shows D passing through a MINIMUM at high
    # acidity and rising again as the mechanism turns solvating; below that
    # minimum a cation-exchange correlation is not merely extrapolated, it is
    # the wrong equation. The minimum is not resolved to a number in the
    # figure, so 0.0 is where this record stops rather than a measured bound.
    #
    # This is a large narrowing and it is meant to be: the useful separation
    # window for 1 mol/L D2EHPA really is around pH 0-1.5, not 1-5. At a
    # tenth the charge (0.05 M nominal) the block puts pH50(Nd) at 1.30; the
    # measured n = 2.38 moves pH50 by 2.38 log10(20) / 3 = 1.03 units between
    # the two charges, which is why textbook pH50 figures quoted at low
    # charge sit a pH unit above this record's reference.
    valid_ph_range: [0.0, 2.0]
    # The equilibrium pH of X95's La point (0.8175), which set the level
    # until #283 and is now its held-out check. Kept because it sits inside
    # M76's measured support (pH -0.02 to 1.15) and because moving it would
    # move every derived quantity for no gain in accuracy. Everything DERIVED
    # from this correlation is evaluated here (#268), so this is also where
    # the Langmuir constants are taken. Was 3.0 before #270, outside the
    # window entirely.
    reference_pH: 0.82
    valid_temp_range: [283, 333]  # K
    # DIMER BASIS, stated explicitly (#270): 0.5 mol/L as (HA)2, which is
    # 1.0 mol/L nominal D2EHPA -- exactly the charge X95 used. `stoichiometry.
    # basis` above is what makes this the dimer number, and
    # `database.log10_concentration_factor` reads concentrations on the
    # record's own basis.
    reference_concentration: 0.5  # M as dimer (= 1.0 M nominal)

    # Concentration correction: D ∝ [HA]^n. FITTED (#283), not the cube law
    # the stoichiometry would give: M76 Fig. 2.2 measures 2.382 +/- 0.011
    # over 0.0093-0.18 M in n-heptane, straight in log-log (rms 0.021), and
    # an Alstad sqrt(C) correction on top of n = 3 fits it worse. The
    # stoichiometry is unchanged -- three dimers per RE(III) still set the
    # CAPACITY (max_loading = 1/6) -- this is the apparent order in the
    # extractant, which non-ideality of the dimer at these charges lowers.
    # Cyanex272's L14 series prefers 2.40 for the same reason. Beyond 0.18 M
    # the exponent is not measured; X95's La point at 1.0 M agrees with the
    # extrapolation to 0.105 decades.
    concentration_exponent: 2.38

    cost_usd_kg: 8.0

    # Saponification (#197): see the file header for the provenance of these
    # numbers. `degree` is an operating default, not a property.
    saponification:
      counter_ion: Na
      degree: 0.35
      log10_K: null          # calibrated from degree at the reference below
      reference_pH: 3.0
      reference_counter_ion: 0.1   # M
      # What the ph_coefficients above were measured on (#266). Stated
      # rather than inferred from `degree`: the degree is an operating
      # default for the circuit, and these coefficients are a proton-exchange
      # fit whatever degree the circuit runs at. A record fitted to a
      # pre-neutralized system says `saponified` here, and difflow_ree then
      # warns that its pH slope is a slope on the wrong axis.
      correlation_basis: unsaponified

  PC88A:
    full_name: "2-ethylhexyl phosphonic acid mono-2-ethylhexyl ester"
    alternative_names: [EHEHPA, P507, Ionquest_801]
    formula: "C16H35O3P"
    molecular_weight: 306.42
    density: 0.955
    pKa: 4.10
    type: acidic_phosphonic
    mechanism: cation_exchange  # normalized from type (#195)
    diluents: [kerosene, n-heptane, Shellsol_D70]
    typical_concentration: 0.5

    # Extraction mechanism: REE³⁺ + 3(HA)₂ ⇌ REE(HA₂)₃ + 3H⁺
    # Dimeric, as D2EHPA: 6 mol PC88A per mol REE (max_loading = 1/6). See #191.
    stoichiometry:
      protons_released: 3
      extractant_molecules: 3
      basis: dimer

    # *** THE ONLY MEASURED CATION-EXCHANGE BLOCK IN THIS FILE (#270). ***
    #
    # Refitted from T21 (Tanaka, Oki, Koyama & Narita 2021, Hydrometallurgy
    # 201, 105588), whose system IS this record: EHEHPA in Shellsol D70, the
    # dimer basis, 3 protons per RE(III), 298.0 +/- 0.1 K, I = 1 M HNO3/NaNO3,
    # O/A = 1, 1 mmol/L RE. 121 digitized points over six extractant charges
    # (0.041 to 0.82 mol/L as dimer) and pH 0.12 to 2.46.
    #
    # These replace the HAND_TUNED values this record carried until #270. The
    # old ones were not slightly off: they put every pH-half 1.5 to 2.6 pH
    # units too high (D(Nd) at pH 2 was 0.0026 against a measured 1697) and
    # they placed Y between Eu and Gd, when Y is measured to extract MORE
    # STRONGLY THAN Dy. Nothing that cited a number from the old block is
    # still valid; see the git history of this file rather than assuming a
    # rescaling.
    #
    # WHAT WAS FITTED, AND WHAT WAS NOT
    #   b = 3.0, pinned, not fitted. It is the stoichiometric slope this
    #     record already declares (protons_released: 3), it is what T21 uses
    #     in its own Alstad analysis, and T21's 22 measured series average
    #     2.863 +/- 0.321 against it. Pinning costs at most 0.03 log units of
    #     rms and BUYS the thing a per-element b destroys: with one slope for
    #     every element, a separation factor is
    #         log10 beta = a_i - a_j
    #     which is INDEPENDENT OF pH, exactly as mass action requires. The old
    #     block's per-element b (2.35 to 2.90) made beta drift with pH -- 3.4
    #     at pH 2 to 4.8 at pH 5 for Nd/Pr -- and an optimizer handed that
    #     drift walks to whichever pH bound is higher and calls it optimal.
    #   c = 0.0. A quadratic buys 0.00-0.02 log units of rms and pays for it
    #     by inflating b to 3.5-5.0 with large negative curvature: over a
    #     window 1-2 pH units wide that is a quadratic absorbing scatter, not
    #     curvature. The old blanket c = 0.010 was itself hand-tuned.
    #   d: NOT set here -- see temperature_coefficients below, which are still
    #     HAND_TUNED. T21 is isothermal, so it carries no information about
    #     the temperature coefficient. d = 0 in this block means "the pH block
    #     contributes no temperature term", not "the temperature coefficient
    #     is measured to be zero".
    #   a: one free parameter per element, fitted on all 121 points.
    #
    # HOW GOOD IS IT
    #   Per element: se(a), rms and r^2 in log10(D) units --
    #     La  se 0.045  rms 0.184  r2 0.952  n 18  pH 1.41-2.46
    #     Nd  se 0.033  rms 0.175  r2 0.970  n 29  pH 0.68-2.37
    #     Sm  se 0.011  rms 0.051  r2 0.997  n 21  pH 0.47-1.86
    #     Dy  se 0.021  rms 0.112  r2 0.986  n 30  pH 0.12-1.24
    #     Y   se 0.017  rms 0.079  r2 0.994  n 23  pH 0.42-1.24
    #   Independent check: T21 prints a log Ke on each panel, which was never
    #   used in the digitization. Converting these `a` back onto the paper's
    #   basis reproduces all five printed values to within 0.06 log units.
    #
    # WHICH ELEMENTS ARE MEASURED
    #   MEASURED (T21):     La, Nd, Sm, Dy, Y
    #   INTERPOLATED (T21): Ce, Pr, Eu, Gd, Tb -- a cubic in atomic number
    #     through the four measured LANTHANIDES (La 57, Nd 60, Sm 62, Dy 66),
    #     which it passes through exactly. Y is NOT on that curve and is not
    #     interpolated: it is measured, and its position in the series is the
    #     single biggest thing #270 changed.
    #   The interpolation is constrained, not free: Ce and Pr sit between two
    #   measured neighbours 1.0 log units apart, so the adjacent factor they
    #   imply (2.14-2.19) is fixed within a few percent by La and Nd whatever
    #   smooth curve is drawn. Interpolating in ionic radius instead moves
    #   Nd/Pr to 1.47 and Tb/Gd to 4.69 -- the radii are spaced irregularly
    #   and a cubic amplifies that, which is why atomic number is used. Eu,
    #   Gd and Tb lie in the 4-unit gap between Sm and Dy and are the weakest
    #   entries here; the half-filled-shell break at Gd is real in this
    #   chemistry and a smooth curve cannot represent it. Treat those three as
    #   indicative and refit them before designing a middle-REE split on them.
    #
    # SANITY AGAINST THE WIDER LITERATURE
    #   Adjacent factors run 2.14 (Nd/Pr) to 3.91 (Dy/Tb), geometric mean 2.66.
    #   Nash (1993) gives ~2.5 as the adjacent-pair average for D2EHPA and has
    #   PC88A running slightly LOWER; over the light pairs this block gives
    #   2.14-2.19 against D2EHPA's 2.32 below, so the ordering now agrees.
    #   Nd/Pr = 2.14 is above @li2019development's 1.8-2.0, but it is bracketed
    #   by measurement: La and Nd are 10.04-fold apart over three steps, so
    #   2.15 per step is what the data allow, not a choice.
    #   Y/Dy = 3.14, with Y above Dy. Y then sits between Ho and Er, and the
    #   implied Er/Y of ~1.5 matches @li2019development's measured 1.4-1.6.
    #
    # D VALUES AT pH 1.0, 0.5 M dimer, TRACE LOADING -- inside the measured
    # window. The old block quoted pH 3.0, which is a decade past where this
    # reagent separates anything:
    #   La 0.083, Ce 0.18, Pr 0.39, Nd 0.84, Sm 4.3, Eu 11,
    #   Gd 32, Tb 104, Dy 407, Y 1280
    # These are the correlation's own trace-loading numbers, as measured at
    # 1 mmol/L RE. A loaded organic phase reaches nothing like D = 1280 for Y;
    # that is what `include_loading` and `solve_free_extractant` are for, and
    # the D printed here is the input to those, not a plant number.
    ph_coefficients:
      # a         MEASURED (T21)          b = 3.0 stoichiometric, c = 0
      La: {a: -4.0795, b: 3.0, c: 0.0, d: 0.0}
      Ce: {a: -3.7385, b: 3.0, c: 0.0, d: 0.0}   # interpolated
      Pr: {a: -3.4086, b: 3.0, c: 0.0, d: 0.0}   # interpolated
      Nd: {a: -3.0776, b: 3.0, c: 0.0, d: 0.0}
      Sm: {a: -2.3640, b: 3.0, c: 0.0, d: 0.0}
      Eu: {a: -1.9571, b: 3.0, c: 0.0, d: 0.0}   # interpolated
      Gd: {a: -1.5006, b: 3.0, c: 0.0, d: 0.0}   # interpolated
      Tb: {a: -0.9825, b: 3.0, c: 0.0, d: 0.0}   # interpolated
      Dy: {a: -0.3905, b: 3.0, c: 0.0, d: 0.0}
      Y:  {a:  0.1058, b: 3.0, c: 0.0, d: 0.0}

    # STILL HAND_TUNED, and deliberately left alone by the #270 refit. T21 is
    # isothermal at 298.0 +/- 0.1 K, so it says nothing about a temperature
    # coefficient and cannot retire these. Sign unverified; same open question
    # as D2EHPA above (negative d implies ENDOTHERMIC extraction). This is now
    # the only hand-tuned number left in the PC88A correlation, so a D
    # computed at 298 K is measured and one computed at 333 K is not.
    temperature_coefficients:
      La: -1400
      Ce: -1500
      Pr: -1600
      Nd: -1700
      Sm: -1900
      Eu: -2000
      Gd: -2100
      Tb: -2200
      Dy: -2300
      Y:  -2100

    # THE MEASURED WINDOW, both ends (#270). [0.12, 2.46] is the union of the
    # five elements' pH supports in T21, rounded outward to [0.1, 2.5].
    #
    # The old upper bound of 5.5 was an unsourced guess and was also chemical
    # nonsense for this reagent: at pH 3 the refitted block puts D(La) at
    # 8e4 and D(Dy) at 4e8. EVERY element is quantitatively in the organic
    # phase, no separation is possible, and no plant operates there. PC88A's
    # useful window really is roughly pH 0.5-2, which is where T21 measured
    # and, not coincidentally, where the data are.
    #
    # Extrapolating past 2.5 is now much better behaved than it was, because
    # the slope being extrapolated on is b = 3, which is stoichiometry rather
    # than a fitted number. What is extrapolated is the intercept's validity,
    # not the slope. It is still extrapolation, and the report still fires.
    valid_ph_range: [0.1, 2.5]
    # Minimax over the five per-element supports: no single pH lies inside
    # all five (Dy's data stop at 1.24, La's start at 1.41 -- which is what a
    # separation factor of 5000 across the series means in practice), so any
    # anchor is outside somebody's support. 1.33 is the pH that minimizes the
    # worst such excursion, at 0.09 pH units. Was 3.5, which is outside FOUR
    # of the five supports and outside the validity window entirely.
    #
    # Everything DERIVED from this correlation is evaluated here (#268), so
    # moving it moves the Langmuir constants and every reported separation
    # factor with it.
    reference_pH: 1.33
    valid_temp_range: [283, 333]
    reference_concentration: 0.5
    concentration_exponent: 3.0
    # Alstad non-ideality of EHEHPA in Shellsol D70 (#270). The concentration
    # term is a cube law in the EFFECTIVE dimer concentration y*C, with
    # log10(y*) = -0.473 sqrt(C); T21 fits its own data this way (its Eqs.
    # 3-5) and the `a` values above were fitted on the same form, so the two
    # travel together.
    #
    # This is not a refinement. On a TOTAL-concentration cube law the
    # correction spans 0.71 log units over 0.041-0.49 mol/L -- a factor of
    # five in D between the ends of the measured range, which lands in the
    # residual and is then partly absorbed into `a`, contaminating the
    # intercept at every concentration but one. Fitting harder cannot remove
    # it; only the right functional form can. With it, one fitted parameter
    # per element reproduces all six concentration series (r2 0.95-0.997).
    #
    # NO OTHER RECORD IN THIS FILE CARRIES THIS FIELD, and that is still
    # correct after #270 retired the other two hand-tuned pH blocks. TBP and
    # naphthenic_acid were never fitted on any concentration data, so a
    # correction would move D away from the only thing they were tuned to
    # reproduce. D2EHPA and Cyanex272 now ARE sourced, but neither source
    # resolves the non-ideality: D2EHPA's level is a SINGLE charge (X95's
    # 1 mol/L), so there is no series to fit y* to at all, and Cyanex272's
    # six charges cannot separate it from the pH slope (r = -0.992). Adding
    # 0.473 to either would be transferring T21's EHEHPA/Shellsol number to a
    # different reagent in a different diluent, which is the sort of move the
    # rest of this file exists to prevent.
    activity_coefficient_A: 0.473
    cost_usd_kg: 12.0

    # Saponification (#197): see the file header for the provenance of these
    # numbers. `degree` is an operating default, not a property.
    saponification:
      counter_ion: Na
      degree: 0.35
      log10_K: null          # calibrated from degree at the reference below
      reference_pH: 3.0
      reference_counter_ion: 0.1   # M
      correlation_basis: unsaponified   # a proton-exchange fit (#266)

  Cyanex272:
    full_name: "Bis(2,4,4-trimethylpentyl)phosphinic acid"
    alternative_names: [HBTMPP, Cyanex_272]
    formula: "C16H35O2P"
    molecular_weight: 290.43
    density: 0.920
    pKa: 6.37
    type: acidic_phosphinic
    mechanism: cation_exchange  # normalized from type (#195)
    diluents: [kerosene, Shellsol_D70]
    typical_concentration: 0.3

    # Extraction mechanism: REE³⁺ + 3(HA)₂ ⇌ REE(HA₂)₃ + 3H⁺
    # Dimeric in aliphatic diluents: 6 mol Cyanex272 per mol REE
    # (max_loading = 1/6). See #191.
    stoichiometry:
      protons_released: 3
      extractant_molecules: 3
      basis: dimer

    # *** REFITTED AGAINST NAMED SOURCES (#270). ***
    #
    # Until #270 every number in this block was HAND_TUNED with no source of
    # any kind. As with D2EHPA the replacement needs TWO sources, and for a
    # sharper reason: the only full-series measurement of this reagent that
    # was retrieved DOES NOT STATE THE EXTRACTANT CONCENTRATION, and under a
    # cube law that is three decades of D per decade of charge. So the shape
    # comes from one study and the level from another.
    #
    # SOURCES
    #   S1  ZL93 -- Zhang & Li, Chin. J. Appl. Chem. 10(4) (1993) 72, as
    #       Z1 Sec. 4.3.1 and Table 4.25 (pp. 138-139).
    #       SUPPLIED: the SHAPE. Separation factors against La for all
    #       fourteen stable lanthanides plus Y, in PURIFIED HBTMPP - octane -
    #       HCl at pH 2.8, [RE3+] 4.0e-4 mol/L, [HCl] 2.0e-2 mol/L,
    #       O/A = 1/1, 25 +/- 1 C. Average adjacent factor 3.24.
    #       >>> This is the ONLY source of the relative spacing. <<<
    #       DID NOT SUPPLY: the extractant concentration -- neither Z1 nor
    #       LD19 prints it -- and therefore no absolute D and no level.
    #   S2  L14 -- Liu, Jeon & Lee, Hydrometallurgy 150 (2014) 61-67,
    #       Tables 1 and 2, SINGLE-extractant rows only.
    #       SUPPLIED: the LEVEL. Six charges of Cyanex 272 in KEROSENE
    #       (0.1-1.0 mol/L nominal), [Pr] 0.0083 and [Nd] 0.023 mol/L
    #       chloride, initial pH 5.02, O/A = 1 (20 mL each), 30 min, ICP-OES.
    #       Table 1 gives E% for both metals; Table 2's "Single Cyanex 272"
    #       column gives the MEASURED equilibrium pH at the same six charges
    #       (2.35, 2.09, 1.91, 1.86, 1.83, 1.82).
    #       >>> This is the ONLY absolute D behind this record. <<<
    #       DID NOT SUPPLY: any element but Pr and Nd, and no temperature
    #       dependence. Its own subject is the Cyanex 272 + Alamine 336
    #       SYNERGISTIC mixture, which is a different system; none of the
    #       mixture data is used here.
    #   S3  LD19 -- Li, J. Rare Earths 37 (2019) 468-486, Fig. 4.
    #       SUPPLIED: a shape CROSS-CHECK only, plus the pKa above. It plots
    #       the same primary study (its ref [67] is ZL93), so it is a check
    #       on the digitization, not a replication. DID NOT SUPPLY: any
    #       shipped coefficient, and no level -- it does not state the
    #       concentration either.
    #   S4  Z1 Eqs. (4.11), (4.12) and (4.27)-(4.31).
    #       SUPPLIED: the model form. Not data.
    #
    # THE LEVEL, WRITTEN OUT
    #   For each of S2's six rows, with O/A = 1:
    #     D = E/(100 - E)
    #     free (HA)2 = C_nominal/2 - 3*(0.0083*E_Pr + 0.023*E_Nd)/100   [4.11]
    #     a = lg D - 3*pH_eq - 3*lg(free (HA)2 / 0.3)
    #   using the MEASURED equilibrium pH, not a recovered one. Row by row:
    #     C_nom  D_Pr    D_Nd    free(HA)2   a_Pr      a_Nd
    #      0.1   0.0225  0.0428    0.0466   -6.2724   -5.9935
    #      0.3   0.0604  0.0929    0.1427   -6.5207   -6.3341
    #      0.5   0.0695  0.1062    0.2418   -6.6067   -6.4227
    #      0.7   0.1312  0.2048    0.3354   -6.6072   -6.4139
    #      0.9   0.1403  0.2240    0.4343   -6.8251   -6.6218
    #      1.0   0.1792  0.2739    0.4814   -6.8227   -6.6385
    #   a_Nd = -6.4041, rms 0.215 over the six (a is the single free
    #   parameter, so this is a one-parameter least-squares fit). a_Pr from
    #   the same rows is -6.6091, rms 0.189.
    #   The two rows that BRACKET the reference charge -- 0.5 and 0.7 mol/L
    #   nominal, i.e. 0.25 and 0.35 mol/L as dimer against a reference of
    #   0.3 -- give -6.4227 and -6.4139, within 0.02 of the fit. The rms is
    #   spent at the ends of the range, not at the anchor.
    #
    #   THE BASIS. S2 reports NOMINAL (monomer) molarity; this record's
    #   `reference_concentration` of 0.3 is on the DIMER basis, i.e. 0.6 mol/L
    #   nominal, which is where the factor of two in the free-dimer line comes
    #   from. `database.log10_concentration_factor` reads concentrations on
    #   the record's own basis, so nothing else needs converting.
    #
    #   Z1 Eq. (4.12) VALIDATED HERE. This is the one place in the file where
    #   both the initial acidity and the measured equilibrium pH are printed,
    #   so the proton balance can be tested rather than assumed. Recomputing
    #   the six equilibrium pH values from 10**-5.02 + 3*(extracted RE)
    #   reproduces the measured 2.35/2.09/1.91/1.86/1.83/1.82 as
    #   2.47/2.14/2.08/1.84/1.80/1.73 -- worst error 0.17 pH units. That is
    #   the warrant for using the same balance on D2EHPA's anchor, where the
    #   equilibrium pH was never reported.
    #
    # THE SHAPE, WRITTEN OUT
    #   Under one shared slope, lg beta(i/La) = a_i - a_La, so S1's La row
    #   IS the shape. Values used (log10 of Table 4.25's La row):
    #     Ce 1.068  Pr 1.599  Nd 1.711  Sm 2.832  Eu 2.959  Gd 3.022
    #     Tb 3.530  Dy 3.814  Y 4.369
    #   The block is anchored at Nd -- the element S2 determines best
    #   (0.023 mol/L against Pr's 0.0083) -- and every other element is
    #   a_Nd + lg beta(i/La) - lg beta(Nd/La).
    #   Y sits between Ho and Er in Table 4.25 as printed, the same ordering
    #   PC88A's refit established from T21 and Z1 p. 124 states in words.
    #   Sm is two steps from Nd (across Pm), so its 13.2 is a product.
    #
    # PER ELEMENT: WHAT IS MEASURED, WHAT IS NOT
    #   MEASURED level (S2):      Nd. Pr is measured too and is used as the
    #     check below rather than as a second anchor.
    #   MEASURED spacing (S1):    every element in this block.
    #   INTERPOLATED:             nothing. As with D2EHPA there is no curve
    #     drawn through anything here; every `a` is Nd's level plus printed
    #     separation factors.
    #   ASSUMED:  b = 3.0, c = 0.0, d = 0.0, and the transfer of a shape
    #     measured in OCTANE to a level measured in KEROSENE. Both are
    #     aliphatic and Z1 Table 4.1 puts kerosene and n-hexane 0.13 decades
    #     apart for P507, so the diluent transfer is small -- but it is a
    #     transfer, and it is uncorrected.
    #
    # HOW GOOD IS IT
    #   THE TWO-SOURCE JOIN IS TESTABLE, because S2 measures Pr as well as Nd
    #   and S1 gives the Nd/Pr spacing independently:
    #     S1 (Table 4.25):   beta(Nd/Pr) = 1.295
    #     S2 (Table 1):      1.51-1.86 across six rows, mean 1.60
    #   so the shipped a_Pr of -6.5162 sits 0.093 decades above the -6.6091
    #   that S2 measures directly. The shape source is used for consistency
    #   -- one shape for the whole block -- and 0.09 decades is the size of
    #   the seam.
    #   THE SHAPE CROSS-CHECK. S3's Fig. 4 was digitized independently
    #   (x-calibration to 0.019 pH units) and its pH-halves converted to
    #   lg beta at the effective slope. Over thirteen elements it agrees with
    #   Table 4.25 to within 0.15 decades, rms 0.08. Same primary study, so
    #   this checks the reading, not the chemistry.
    #
    # KNOWN GAPS, both stated rather than hidden.
    #   (1) THE MODEL FORM IS IMPOSED, AND S2 PREFERS A DIFFERENT ONE.
    #   With b pinned at 3, the best-fit concentration exponent over S2's six
    #   rows is n = 2.40 (rms 0.049), not the 3.0 this record declares
    #   (rms 0.215); with n pinned at 3, the best-fit slope is b = 4.07. The
    #   two cannot be separated from this dataset -- pH_eq and lg[HA] have
    #   r = -0.992 across the series, because both are driven by the same
    #   charge -- so neither fit refutes the other. Worse, S2 proposes for
    #   single Cyanex 272 in chloride
    #       RE3+ + Cl- + 2(H2A2) = REClA2.2HA + 2H+
    #   i.e. TWO protons and a chloride, against the three-proton exchange
    #   this record assumes from Z1 Eq. (4.27) (which S1's system, purified
    #   HBTMPP in octane, does follow). b = 3 is kept because it is what S1
    #   measured under, because the record declares protons_released: 3, and
    #   because one shared slope is what makes every separation factor here
    #   pH-independent. The cost is the 0.215 rms above, which is a smooth
    #   drift with charge, smallest at the reference.
    #   (2) NO LEVEL FROM THE SHAPE SOURCE. If ZL93's charge were ever
    #   recovered, S1 would supply both halves and the seam in the previous
    #   paragraph would close. S3's Fig. 4 implies a_Nd near -9.76, which is
    #   3*log10(10) below the shipped level -- consistent with ZL93 having
    #   worked near 0.05 mol/L. That is plausible for this group (Ma & Li
    #   1992 used 0.0196 mol/L in n-octane, Liao et al. 2007 0.102 mol/L in
    #   n-heptane, Wang et al. 1995 0.838 mol/L in kerosene) but it is an
    #   inference from an unlabelled axis, so the figure sets no level here.
    #   WHAT WOULD SETTLE BOTH: ZL93 itself, or any log D vs equilibrium pH
    #   series for Cyanex 272 at a stated charge covering more than two
    #   elements.
    #
    # D VALUES AT pH 2.0, 0.3 M DIMER FREE, TRACE LOADING -- inside S2's
    # measured window of 1.82-2.35. The old block quoted pH 5.0, three pH
    # units and nine decades past anywhere this reagent was ever measured:
    #   La 0.008, Ce 0.09, Pr 0.31, Nd 0.39, Sm 5.2, Eu 7.0,
    #   Gd 8.1, Tb 26, Dy 50, Y 179
    ph_coefficients:
      # a = Nd level (L14) + shape against La (ZL93); b = 3.0, c = 0
      La: {a: -8.1150, b: 3.0, c: 0.0, d: 0.0}
      Ce: {a: -7.0468, b: 3.0, c: 0.0, d: 0.0}
      Pr: {a: -6.5162, b: 3.0, c: 0.0, d: 0.0}   # L14 measures -6.6091 directly
      Nd: {a: -6.4041, b: 3.0, c: 0.0, d: 0.0}   # the level anchor
      Sm: {a: -5.2832, b: 3.0, c: 0.0, d: 0.0}   # two steps from Nd, across Pm
      Eu: {a: -5.1560, b: 3.0, c: 0.0, d: 0.0}
      Gd: {a: -5.0930, b: 3.0, c: 0.0, d: 0.0}
      Tb: {a: -4.5850, b: 3.0, c: 0.0, d: 0.0}
      Dy: {a: -4.3011, b: 3.0, c: 0.0, d: 0.0}
      Y:  {a: -3.7460, b: 3.0, c: 0.0, d: 0.0}   # between Ho and Er (ZL93)

    # STILL HAND_TUNED, and deliberately left alone by the #270 refit. Both
    # sources behind the pH block are isothermal (25 +/- 1 C for S1, room
    # temperature for S2), so neither can retire these.
    # Sign unverified; same open question as D2EHPA above (negative d implies
    # ENDOTHERMIC extraction). Numbers deliberately unchanged.
    temperature_coefficients:
      La: -1300
      Ce: -1400
      Pr: -1500
      Nd: -1600
      Sm: -1800
      Eu: -1900
      Gd: -2000
      Tb: -2100
      Dy: -2200
      Y:  -2000

    # THE SOURCED WINDOW (#270). Was [3.0, 7.0], HAND_TUNED, and both ends
    # were wrong. The upper end was past chemistry: at pH 5 the refitted
    # block puts D(La) at 7.7e6 and D(Y) at 1.8e11, so nothing separates from
    # anything. The lower end excluded the only place this reagent has
    # actually been measured -- S2's six equilibrium pH values all lie
    # between 1.82 and 2.35, BELOW the old window.
    #
    # Lower bound 1.5: 0.3 pH units below S2's lowest measured equilibrium
    # pH. Upper bound 3.5: S1's shape was measured at pH 2.8, and by pH 3.5
    # D(La) is already 243, i.e. quantitative extraction of the least
    # extracted element. Between those two the block is interpolating between
    # its level source and its shape source rather than extrapolating past
    # both.
    #
    # A NOTE ON WHY THE OLD WINDOW LOOKED REASONABLE. Cyanex 272 IS operated
    # near pH 5 in practice -- but saponified and heavily loaded, where the
    # free extractant is a small fraction of the charge and the free-acid
    # concentration is buffered by the sodium form. This correlation is a
    # trace-loading, unsaponified proton-exchange fit (`correlation_basis`
    # below), and pH 5 is not where it was measured. Use
    # `solve_free_extractant` and the saponification block to reach plant
    # conditions; do not read D at pH 5 off this correlation.
    valid_ph_range: [1.5, 3.5]
    # The mean of S2's six measured equilibrium pH values is 1.977, and
    # pH50(Nd) at the reference charge is 2.135. 2.0 sits between them and
    # inside every source's window. Everything DERIVED from this correlation
    # is evaluated here (#268). Was 5.0, outside the new window entirely.
    reference_pH: 2.0
    valid_temp_range: [283, 333]
    # DIMER BASIS, stated explicitly (#270): 0.3 mol/L as (HA)2, which is
    # 0.6 mol/L nominal Cyanex 272 -- inside S2's 0.1-1.0 mol/L series and
    # bracketed by its 0.5 and 0.7 mol/L rows.
    reference_concentration: 0.3  # M as dimer (= 0.6 M nominal)
    concentration_exponent: 3.0
    cost_usd_kg: 25.0

    # Saponification (#197): see the file header for the provenance of these
    # numbers. `degree` is an operating default, not a property.
    saponification:
      counter_ion: Na
      degree: 0.35
      log10_K: null          # calibrated from degree at the reference below
      reference_pH: 3.0
      reference_counter_ion: 0.1   # M
      correlation_basis: unsaponified   # a proton-exchange fit (#266)

  TBP:
    full_name: "Tributyl phosphate"
    formula: "(C4H9O)3PO"
    molecular_weight: 266.31
    density: 0.979
    pKa: null  # Neutral extractant
    type: solvating_neutral
    mechanism: solvating  # normalized from type (#195)
    diluents: [kerosene, n-dodecane]
    typical_concentration: 1.0  # Often 30% v/v in diluent

    # Solvating extraction from nitrate media
    # REE(NO3)3 + 3TBP ⇌ REE(NO3)3·3TBP
    # Solvating, monomeric: 3 mol TBP per mol REE (max_loading = 1/3). See #191.
    stoichiometry:
      protons_released: 0
      extractant_molecules: 3
      basis: monomer
      requires_nitrate: true

    # =====================================================================
    # TBP NITRATE COEFFICIENTS -- REFITTED FROM PRIMARY LITERATURE
    # =====================================================================
    # Model (as implemented by difflow_ree.equilibrium.distribution):
    #
    #   log10(D) = a + b*log10([NO3-]/reference_nitrate)
    #                + c*log10([NO3-]/reference_nitrate)^2
    #                + d*(1/T - 1/298.15)
    #                + n*log10([TBP]/reference_concentration)
    #
    #   `a` = log10(D) AT the reference: [NO3-] = 3.0 M, [TBP] = 1.0 M,
    #         T = 298.15 K.
    #   `b` = nitrate slope d log10(D) / d log10([NO3-]).
    #   `d` = -dH / (2.303 R), so d > 0 <=> dH < 0 <=> EXOTHERMIC.
    #
    # WHAT WAS WRONG BEFORE, AND IS NOW FIXED
    #   1. The old `a` values gave D_Dy/D_La = 100 at the reference. Measured:
    #      10.2. The old spread was an acidic-organophosphorus selectivity
    #      pattern, not a solvating one.
    #   2. The old `a` values gave D_Dy = 3.16 at the reference. Measured
    #      (corrected to the reference): 0.24.
    #   3. Every old `d` was NEGATIVE, which under the model above means
    #      ENDOTHERMIC. TBP extraction of REE nitrates is EXOTHERMIC. Every
    #      `d` is now POSITIVE.
    #   4. The old per-element `b` trend 2.50-2.85 had no support of any kind
    #      and is removed; `b` is now the stoichiometric 3.0 for every element.
    #
    # ---------------------------------------------------------------------
    # SOURCES (these four, and no others; nothing else here is a source)
    # ---------------------------------------------------------------------
    # S1  Kraikaew, Srinuttrakul & Chayavadhanakur (2005), "Solvent Extraction
    #     Study of Rare Earths from Nitrate Medium by the Mixtures of TBP and
    #     D2EHPA in Kerosene", J. Metals, Materials and Minerals 15(2), 89-95.
    #     No DOI. https://jmmm.material.chula.ac.th/index.php/jmmm/article/view/1345
    #     Table 1, p. 92. Conditions: RE nitrate from monazite, free acidity
    #     0.2001 N, TBP in kerosene, equal phase volumes, 35 +/- 1 C.
    #     >>> This is the ONLY source of the `a` values below. <<<
    #
    # S2  Topp & Weaver, ORNL-1811, "Distribution of Rare-Earth Nitrates
    #     Between Tributyl Phosphate and Nitric Acid" (1954).
    #     DOI 10.2172/4398970.
    #     Used only to bound the validity window (Tables II/IV, 8.5-17.4 N).
    #
    # S3  Poos & Wilhelm, ISC-695, "Separation of Yttrium and Some Rare Earths
    #     by Liquid-Liquid Extraction", Ames Laboratory (1954). OSTI 4332475.
    #     Used only for the Y acidity-dependent-position caveat.
    #
    # S4  Ganesh & Pandey (2019), J. Rad. Nucl. Appl. 4(2), 109-115.
    #     The DOI printed in the PDF (10.18576/jrna/040205) is NOT REGISTERED
    #     IN CROSSREF -- it does not resolve. Cite the retrieved PDF instead:
    #     https://www.naturalspublishing.com/files/published/q86xt25u4iq5o9.pdf
    #     Table 1: dH_Sm = -43.3 +/- 6.2 kJ/mol (1.1 M TBP in n-dodecane,
    #     3.8-3.89 M HNO3, 283-326 K, R^2 = 0.979).
    #     Fig. 1: log D_Sm = 2.8055*log[TBP]_free - 2.8503, R^2 = 0.992.
    #     >>> This is the ONLY source of the `d` value below. <<<
    #
    # S5  Jorjani & Shahbazi (2016), Arab. J. Chem. 9, S1532-S1539,
    #     DOI 10.1016/j.arabjc.2012.04.002. Extraction fell as T went
    #     25 -> 55 C. Corroborates exothermicity; supplies no number here.
    #
    # KNOWN GAP -- THE SINGLE HIGHEST-VALUE FOLLOW-UP
    #     Fidelis (1970), "Temperature effect on the extraction of lanthanides
    #     in the TBP-HNO3 system", J. Inorg. Nucl. Chem. 32, 997-1003,
    #     DOI 10.1016/0022-1902(70)80079-3, measured the WHOLE lanthanide
    #     series at 10/17/25/40 C -- i.e. exactly the per-element dH that is
    #     assumed constant below. It is paywalled with no open-access copy and
    #     was NOT used. Obtaining it would replace nine assumed `d` values
    #     with nine measured ones. That is the next thing to do to this record.
    #
    # ---------------------------------------------------------------------
    # FIT BASIS AND THE CORRECTION ARITHMETIC
    # ---------------------------------------------------------------------
    # S1 Table 1 reports D at 1.0 M TBP, at 6.06 M nitrate and 308.15 K.
    # Corrected to the record's reference (3.0 M NO3-, 1.0 M TBP, 298.15 K):
    #
    #   a = log10(D_measured)
    #       + 3*log10(3.0/6.06)              = -0.9162   (nitrate, b = 3)
    #       - 2300*(1/308.15 - 1/298.15)     = +0.2504   (temperature, d = 2300)
    #
    #   i.e.  a = log10(D_measured) - 0.6658
    #
    # THE 6.06 M NITRATE IS DERIVED, NOT REPORTED. S1 does not state a nitrate
    # concentration. 6.06 M was computed from S1's ppm feed table (sum of the
    # RE nitrates, plus the 0.2 N free acid). THIS IS THE SINGLE LARGEST
    # UNCERTAINTY IN THE `a` VALUES: the nitrate correction is 3*log10(3/[NO3-]),
    # so a 10% error in the derived 6.06 M moves every `a` by 0.13 log units
    # (35%) IN COMMON. Relative selectivity (the ratios, which is what these
    # numbers are actually good for) is unaffected; the absolute level is not.
    #
    # ---------------------------------------------------------------------
    # PER-ELEMENT PROVENANCE -- READ THIS BEFORE USING ANY SINGLE NUMBER
    # ---------------------------------------------------------------------
    #   La  DERIVED from S1 Table 1 (measured D, corrected as above)
    #   Ce  DERIVED from S1 Table 1
    #   Pr  DERIVED from S1 Table 1
    #   Nd  DERIVED from S1 Table 1
    #   Sm  DERIVED from S1 Table 1
    #   Eu  DERIVED from S1 Table 1
    #   Gd  DERIVED from S1 Table 1
    #   Tb  *** INTERPOLATED -- NOT MEASURED ***
    #       Log-linear in atomic number between Gd (Z = 64) and Dy (Z = 66).
    #       NO TBP-nitrate distribution ratio for Tb exists in ANY source
    #       retrieved for this refit. a_Tb is a straight-line fill-in with no
    #       measurement behind it. Treat any Tb result as interpolation.
    #   Dy  DERIVED from S1 Table 1
    #   Y   DERIVED from S1 Table 1, but SPECIAL CASE -- see below.
    #
    # Y IS A SPECIAL CASE AND A SINGLE a_Y IS A FICTION.
    #   Yttrium has no 4f shell; its effective position in the REE extraction
    #   series is not fixed but SLIDES WITH ACIDITY -- Ho-like at high acidity,
    #   La-like at very low acidity (S3). One number cannot represent that.
    #   The a_Y written below is the ~6 M nitrate, LOW-FREE-ACID value from
    #   S1's conditions (0.2 N), corrected like the rest. At any other acidity
    #   it is wrong, and wrong by an unknown amount in a known direction.
    #   Do not use Y at any acidity other than S1's.
    #
    # b = 3.0 IS STOICHIOMETRIC, NOT FITTED.
    #   It is the 3 of RE(NO3)3 + 3 TBP <-> RE(NO3)3.3TBP. NO measured
    #   d log D / d log[NO3-] in a neutral-salt system was found in any
    #   retrieved source, so there is no fitted nitrate slope to write. The
    #   only corroboration is INDIRECT: S4 Fig. 1 measured the TBP order as
    #   2.81 (R^2 = 0.992), close to 3. All ten elements share b = 3.0 because
    #   nothing in the data distinguishes them; the old 2.50-2.85 per-element
    #   trend was invented.
    #
    # d = +2300 K FOR EVERY ELEMENT: ONE MEASUREMENT, NINE ASSUMPTIONS.
    #   From S4's dH_Sm = -43.3 kJ/mol via d = -dH/(2.303 R)
    #     = 43300 / (2.303 * 8.314) = 2262 K, rounded to 2300 K.
    #   *** Sm is MEASURED. The other nine elements are ASSUMED EQUAL TO Sm
    #       and are NO DATA. *** There is no per-element heat of extraction in
    #   anything retrieved (that is what the Fidelis gap above would supply).
    #   The sign, however, is solid and is the point: dH < 0, so d > 0, so D
    #   FALLS as T rises. S5 corroborates the direction independently.
    #
    #   +/-40% AMBIGUITY IN THE MAGNITUDE. S4's Table 1 appears to have its dH
    #   and slope columns TRANSPOSED between its two rows, so the value that
    #   belongs to TBP is either -43.3 or -61.2 kJ/mol, giving d = +2261 K or
    #   d = +3197 K. This cannot be resolved from the paper as published.
    #   The defensible range is therefore d = +2260 to +3200 K; +2300 is the
    #   low end of it. Any temperature study should sweep that range rather
    #   than trust the single value.
    #
    # ---------------------------------------------------------------------
    # VALIDITY WINDOW
    # ---------------------------------------------------------------------
    # These coefficients -- and in particular b = 3.0 -- are valid ONLY for:
    #
    #     nitrate supplied by a NEUTRAL SALT
    #       (NH4NO3 / LiNO3 / Ca(NO3)2 / Mg(NO3)2 / Al(NO3)3),
    #     free acid <= 0.5 M,
    #     [NO3-] 1-6 M,
    #     T 283-326 K.
    #
    # WHY ONE `b` CANNOT COVER MORE THAN THAT (both measured, both outside):
    #   - NEAT TBP + CONCENTRATED HNO3: the slope is ~6, not 3
    #     (S2 Tables II/IV, 8.5-17.4 N). Twice the exponent.
    #   - DILUTE TBP + HNO3: at 1.1 M TBP, D actually FALLS with acidity,
    #     because the acid consumes the extractant as the TBP.HNO3 adduct and
    #     starves the RE complex of free TBP. The effective slope is ~0 or
    #     NEGATIVE (S4 Fig. 4). Opposite sign.
    #   A single b cannot be 3, 6 and -something at once. The neutral-salt,
    #   low-acid window is the one where b = 3 is the right physics.
    #
    # TWO FURTHER CAVEATS ON THE LEVEL (not the shape):
    #   - The model's extractant term uses TOTAL [TBP] (`[TBP]/1.0 M` raised to
    #     concentration_exponent). The measured cube law holds in FREE TBP.
    #     These differ whenever the solvent is loaded or the acid is high.
    #   - S1's solvent was AT OR OVER SATURATION: an organic loading of 0.35 M
    #     requires 1.05 M TBP of the 1.0 M available. So S1's D values -- and
    #     hence every `a` below -- are LOADING-SUPPRESSED PROCESS values, not
    #     trace-level D. Trace D would be higher.
    #
    # ---------------------------------------------------------------------
    # USE FOR / DO NOT USE FOR
    # ---------------------------------------------------------------------
    # USE FOR:
    #   - relative REE selectivity of TBP (the element ORDER and the ratios)
    #   - showing why a TBP separation needs very many stages
    #   - trend and sensitivity studies, gradient-based structure studies
    #   - the DIRECTION of the temperature and nitrate dependences
    #
    # DO NOT USE FOR:
    #   - stage counts or column sizing
    #   - solvent inventories
    #   - absolute recoveries or purities
    #   - any system where the nitrate is supplied by HNO3 rather than a
    #     neutral salt
    #   - loaded solvent (these are already loading-suppressed; the loading
    #     model would double-count)
    #   - free acidity above ~0.5 M
    #   - regressing equilibrium constants against these numbers
    #   - Y at any acidity other than S1's 0.2 N
    #
    # AT THE REFERENCE (3.0 M NO3-, 1.0 M TBP, 298.15 K) THESE GIVE:
    #   La 0.023, Ce 0.032, Pr 0.060, Nd 0.072, Sm 0.120, Eu 0.138,
    #   Gd 0.174, Tb 0.204, Dy 0.240, Y 0.214
    #   D_Dy/D_La = 10.2; mean adjacent-pair separation factor La->Dy = 1.29
    #   (per unit atomic number over the 9 steps La(57) -> Dy(66), which
    #   includes Pm(61); counting only the 8 gaps in the tracked element
    #   list would inflate this to 1.34). Inside the 1.1-1.5 reported for
    #   TBP; the old record implied 1.67, above that range.
    #   Every D is below 1: TBP is a weak extractant and this now shows it.
    #
    # NOTE ON EXTRACTANT CONCENTRATION. Every Params class in difflow_ree
    # defaults extractant_conc = 0.5 M, which with reference_concentration 1.0
    # and concentration_exponent 3.0 multiplies every D above by 0.125. 0.5 M
    # is a cation-exchange default and is meaningless for TBP: TBP is normally
    # run at ~30% v/v, which for the density and MW on this record is 1.10 M
    # (neat TBP is 3.68 M). Set extractant_conc ~ 1.1 explicitly for TBP.
    nitrate_coefficients:
      La: {a: -1.63, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1
      Ce: {a: -1.49, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1
      Pr: {a: -1.22, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1
      Nd: {a: -1.14, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1
      Sm: {a: -0.92, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1
      Eu: {a: -0.86, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1
      Gd: {a: -0.76, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1
      Tb: {a: -0.69, b: 3.0, c: 0.0, d: 0.0}   # INTERPOLATED Gd-Dy, NOT MEASURED
      Dy: {a: -0.62, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1
      Y:  {a: -0.67, b: 3.0, c: 0.0, d: 0.0}   # DERIVED, S1 Table 1; ACIDITY-SPECIFIC

    # NO ph_coefficients BLOCK -- DELETED ON PURPOSE.
    # TBP formerly carried a `ph_coefficients` block, reachable via
    #   REEDistribution(extractant="TBP", ..., mechanism="cation_exchange").
    # It was removed because it was mechanistically indefensible, not merely
    # uncalibrated:
    #   - It modelled TBP as a weak CATION EXCHANGER, but this very record has
    #     pKa: null and stoichiometry.protons_released: 0. There is no proton
    #     to exchange. The model had no mechanism under it.
    #   - No retrieved source reports a pH-slope correlation for TBP at all.
    #   - It carried the same refuted 100x La-to-Dy spread as the old nitrate
    #     block (see above), from the same unrecorded origin.
    # Asking for TBP with mechanism="cation_exchange" now RAISES a ValueError
    # naming TBP and pointing at the nitrate path. There is no fallback.
    # TBP in HNO3 is a real system, but it is one this file has no coefficients
    # for -- and per the validity window above, b = 3 would be wrong for it
    # anyway (S2 measured ~6, S4 measured ~0 or negative). Anyone who needs it
    # must supply fitted coefficients, not reach for a deleted block.

    # d = -dH/(2.303 R) > 0 <=> EXOTHERMIC. All ten are +2300 K:
    # Sm MEASURED (S4, dH = -43.3 kJ/mol); the other nine ASSUMED EQUAL TO Sm
    # and carrying NO DATA. Defensible range +2260 to +3200 K (S4 column
    # transposition, see above). Fidelis (1970) would replace all nine.
    temperature_coefficients:  # d values in K
      La: 2300   # ASSUMED = Sm (no data)
      Ce: 2300   # ASSUMED = Sm (no data)
      Pr: 2300   # ASSUMED = Sm (no data)
      Nd: 2300   # ASSUMED = Sm (no data)
      Sm: 2300   # MEASURED, S4 Table 1
      Eu: 2300   # ASSUMED = Sm (no data)
      Gd: 2300   # ASSUMED = Sm (no data)
      Tb: 2300   # ASSUMED = Sm (no data)
      Dy: 2300   # ASSUMED = Sm (no data)
      Y:  2300   # ASSUMED = Sm (no data)

    valid_ph_range: [0.5, 4.0]  # Works in highly acidic conditions
    valid_temp_range: [283, 353]
    reference_concentration: 1.0
    reference_nitrate: 3.0  # M
    concentration_exponent: 3.0
    cost_usd_kg: 4.0

  naphthenic_acid:
    full_name: "Naphthenic acid (commercial mixture of alkyl cyclopentane- and cyclohexane-carboxylic acids)"
    formula: "R-(CH2)n-COOH"   # NOT a single compound; see MOLECULAR WEIGHT below
    molecular_weight: 270.0
    density: 0.96
    pKa: 5.5
    type: acidic_carboxylic
    mechanism: cation_exchange
    diluents: [kerosene, n-dodecane, Shellsol_D70]
    typical_concentration: 0.5

    # Cation exchange, MONOMER basis: 3 mol HA per mol RE (max_loading = 1/3).
    # RE3+ + 3 HA(o) <-> REA3(o) + 3 H+                     (Q1 Eq. 2.87)
    # Monomer, not dimer: naphthenic acid dimerizes in a nonpolar diluent, but
    # the working solvent is saponified and carries an alcohol modifier, in
    # which Q1 states it is predominantly MONOMERIC (Q1 Sec. 2.4.2.1). The 3:1
    # ratio is confirmed twice in Q1 -- by the slope of lg D - 3 lg(HA)o vs pH
    # and by the saturation method -- and directly in Q1 Table 2.43.
    stoichiometry:
      protons_released: 3
      extractant_molecules: 3
      basis: monomer

    # =====================================================================
    # NAPHTHENIC ACID -- READ THIS WHOLE BLOCK BEFORE USING ANY NUMBER
    # =====================================================================
    # PROVENANCE CLASS: *** MEASURED ANCHOR + LITERATURE-DERIVED FORM. ***
    #
    #   (A) LITERATURE-DERIVED. Everything about the SHAPE of the model and
    #       the physical properties: the extraction reaction, b = 3.0, the
    #       cube law in free extractant, the monomer basis, pKa, density,
    #       molecular weight, the saponification degree, the validity
    #       window, the impurity ordering. From Q1, with section numbers.
    #
    #   (B) MEASURED.  *** The per-element `a` ladder. ***
    #       Back-computed element by element from ONE published table of
    #       distribution ratios for all fifteen rare earths in a naphthenic
    #       acid system at stated pH, extractant concentration, rare-earth
    #       concentration, phase ratio and temperature: Z1 Table 4.36,
    #       left-hand system. The arithmetic is written out under THE `a`
    #       LADDER below. This is the only per-element block in this file
    #       that traces to a single identified measurement rather than to
    #       fitting, hand-tuning or construction.
    #
    #       *** SUPERSEDES A CONSTRUCTED LADDER. *** An earlier revision of
    #       this record built the ladder from published separation-factor
    #       BOUNDS, because no measured full-series table had been found.
    #       That construction was monotonic in atomic number. It was WRONG
    #       IN SHAPE. The measurement rises from La to a maximum at Sm/Eu
    #       and falls back across the heavies, so the constructed ladder had
    #       the heavy rare earths separating from Y far better than they do
    #       and Sm/Eu far worse. ANY RESULT DERIVED FROM THE OLD LADDER MUST
    #       BE RECOMPUTED. What survives from it is the one qualitative fact
    #       both versions agree on: Y has the lowest D of the fifteen.
    #
    # ---------------------------------------------------------------------
    # SOURCES (these, and no others)
    # ---------------------------------------------------------------------
    # Q1  Qi, Dezhi (2018), "Hydrometallurgy of Rare Earths: Extraction and
    #     Separation", Elsevier. ISBN 978-0-12-813920-2.
    #     Ch. 2 Sec. 2.4 (naphthenic acid) and Ch. 4 Sec. 4.3.4 (industrial
    #     yttrium separation). Source of the MODEL FORM and the properties.
    #     Specific loci used:
    #       Eq. 2.87   extraction reaction (saponified, monomer)
    #       Eq. 2.88   lg D = lg K_ex + 3 lg(HA)o + 3 pH      -> b = 3.0
    #       Eq. 2.89   (HA)o = [HA]0 - 3 (REA3)   free-extractant balance
    #       Eq. 2.90   RE(OH)2+ route above pH 5.6 -- the upper bound
    #       Eq. 2.91   RECl3 + n HA -> RECl3.nHA, the NEUTRAL-COORDINATION
    #                  route at low pH / high [RECl3]: a DIFFERENT mechanism
    #                  that this record does not model
    #       Sec. 2.4.2.1 (p. 280) the slope-3 verification and ITS RANGE:
    #                  "the slope of lg D - 3 lg(HL)(O) against pH is a
    #                  straight line, close to 3 ... in the range of Y3+
    #                  concentrations from 0.1 to 0.8 mol/L and pH from 3.8
    #                  to 5.0". This is the ONLY statement of where b = 3.0
    #                  has been checked, and it is checked against the FREE
    #                  extractant concentration. See THE FREE-EXTRACTANT GAP.
    #       Table 2.42 physical properties
    #       Table 2.43 (HA)/(RE) = 2.79-3.14 measured at pH 5.01-5.43
    #       Table 2.45 solubility of solid REA3 -- the CAPACITY LIMIT, below
    #       Table 2.49 D_Fe, D_Al, D_RE vs pH 1.18-3.20
    #       Sec. 2.4.2.2 (p. 283) beta_RE/Y bounds: light rare earths
    #                  "always bigger than 1.5", Gd and heavies "> 2.0", over
    #                  aqueous RE 0.29-1.1 mol/L at pH 4.0-5.0. These were
    #                  the basis of the superseded construction; they are now
    #                  used only as a CHECK on the measured ladder.
    #       Fig. 2.79  D-vs-Z, three salting-agent levels. Light rare-earth
    #                  D and beta FALL and heavy rare-earth D and beta RISE
    #                  as NH4Cl is added: the ladder is not rigid.
    #       Sec. 4.3.4.2 effective beta = 1.58 and the industrial stage counts
    #
    # Z1  Zhang, Jack; Zhao, Baodong; Schreiner, Bryan (2016), "Separation
    #     Hydrometallurgy of Rare Earth Elements", Springer.
    #     Ch. 4 Sec. 4.7 (naphthenic acid extraction system).
    #     >>> The ONLY source of the per-element `a` values. <<<
    #     Specific loci used:
    #       Table 4.36 Distribution ratio and separation factor in naphthenic
    #                  acid extraction system. Two systems, both 25 C, O/A
    #                  2/1, all fifteen rare earths, D and beta_RE/Y. The
    #                  left-hand system (0.45 mol/L naphthenic acid, 0.142
    #                  mol/L rare earth, pH 4.19) IS THE ANCHOR.
    #       Eq. 4.94   RE3+ + 3 HL(o) = RE(HL2)3(o) + 3 H+  (unsaponified)
    #       Eq. 4.95   HL(o) + NH4OH = NH4L(o) + H2O        (saponification)
    #       Eq. 4.96   RE3+ + 3 NH4L(o) = REL3(o) + 3 NH4+  (saponified)
    #                  >>> NO PROTON APPEARS. See THE SAPONIFICATION GAP. <<<
    #       Fig. 4.42  Bauer & Lindstrom (1964), 0.32 M naphthenic acid in
    #                  DIETHYL ETHER from SULFATE, pH 5-7.5. NOT USED: wrong
    #                  diluent, wrong medium, wrong pH band. In that system Y
    #                  sits between Tb and Dy, not at the bottom. Cited here
    #                  only so that nobody re-finds it and thinks it conflicts
    #                  with the anchor. It is a different system.
    #       Fig. 4.43  D vs element, 20% naphthenic acid / 20% mixed alcohol /
    #                  60% kerosene / RECl3, 80% saponified, at pH 4.0, 4.6,
    #                  5.2, 5.4. Y LOWEST across pH 4.0-5.2, and the element
    #                  order is exactly the anchor's. Independent confirmation
    #                  of the ladder's shape in the industrial solvent.
    #       Sec. 4.7.2 "The average separation factor of RE/Y is about 3.0."
    #                  The anchor reproduces 2.93 -- see THE `a` LADDER.
    #       Fig. 4.44/4.45 two-step and one-step industrial Y processes, 30-50
    #                  and 73-110 stages.
    #
    # ---------------------------------------------------------------------
    # WHERE YTTRIUM SITS, AND WHY THIS EXTRACTANT EXISTS
    # ---------------------------------------------------------------------
    # Naphthenic acid is the industrial yttrium extractant because Y has the
    # LOWEST distribution ratio of all fifteen rare earths in it. Y reports to
    # the AQUEOUS raffinate while the heavy lanthanides load the solvent. That
    # is the opposite of D2EHPA, in which Y tracks the heavy lanthanides.
    # Q1's measured extraction order (pH 4.6, 20% v/v HA + 18% v/v mixed ROH
    # + 62% v/v kerosene, [RE]0 = 0.84 mol/L, O/A = 1) is
    #
    #   Yb > Sm > Dy > Lu > Nd > Gd > Pr > Tm > Tb > Ce > Ho > Er > La > Y
    #
    # -- scrambled among the lanthanides, but unambiguous at the bottom: La
    # then Y. THIS RECORD NOW REPRODUCES THE SCRAMBLING, because the ladder
    # is measured rather than idealized. Its own order, from Z1 Table 4.36,
    # is
    #
    #   Sm > Eu > Nd > Gd > Tb > Dy > Pr > Ho > Er > Yb > Tm > Ce > Lu > La > Y
    #
    # Two independently measured systems, different laboratories, different
    # conditions, different books. They are not the same permutation -- Q1's
    # was measured at 0.84 mol/L RE, far above the solvent's capacity, so it
    # is loading- and speciation-distorted -- but they agree on the three
    # things that matter: Sm near the top, and La then Y at the bottom, in
    # that order. An earlier revision of this record idealized the ladder as
    # monotonic in atomic number and warned that the scrambling was real and
    # unmodelled. It is now modelled.
    #
    # LA AND Y ARE NOT RELIABLY SEPARABLE AND THE SOURCES DISAGREE ON THEIR
    # ORDER. Q1 puts La above Y. A retrieved review of the same system
    # (attributed to Zheng/du Preez-Preston, see UNRETRIEVED SOURCES) reports
    # the order La < Ce < Y < Nd, i.e. Y ABOVE La. Q1 explains the conflict
    # directly: beta_La/Y crosses 1 as the La:Y ratio changes, because a
    # HETERONUCLEAR La-Y complex forms. Both sources therefore agree on what
    # matters -- beta_La/Y is near 1 and composition-dependent -- and disagree
    # only on which side of 1. THE La AND Y VALUES BELOW CANNOT RESOLVE THAT
    # AND SHOULD NOT BE USED TO DESIGN A La/Y SPLIT. The industrial process
    # avoids the problem: it removes La upstream and feeds naphthenic acid a
    # yttrium-enriched HEAVY rare-earth group.
    #
    # ---------------------------------------------------------------------
    # THE `a` LADDER: WHERE IT COMES FROM
    # ---------------------------------------------------------------------
    # SOURCE: Z1 Table 4.36, left-hand system. Stated conditions:
    #     naphthenic acid   0.45  mol/L
    #     rare earth        0.142 mol/L (aqueous)
    #     equilibrium pH    4.19
    #     O/A               2/1
    #     temperature       25 C
    # and D for all fifteen elements, with beta_RE/Y alongside.
    #
    # THE ARITHMETIC. Inverting this record's own model at those conditions,
    # with b = 3.0, c = 0, d = 0, n = 3.0 and reference_concentration 0.5:
    #
    #     a = log10(D_measured) - 3*(4.19) - 3*log10(0.45/0.5)
    #       = log10(D_measured) - 12.5700 + 0.1373
    #       = log10(D_measured) - 12.4327
    #
    # That is the whole derivation. No fitting, no smoothing, no
    # interpolation: fifteen measured numbers, one subtraction each. Feed
    # the record back its own anchor conditions and it returns Table 4.36.
    #
    # WHICH COLUMN IS AUTHORITATIVE. Table 4.36 prints D and beta_RE/Y. They
    # disagree for three entries out of thirty (D_i/D_Y vs the printed beta):
    #     system 1  Nd   D/D_Y = 3.61   printed beta 2.35
    #     system 1  Lu   D/D_Y = 1.98   printed beta 2.19
    #     system 2  Tb   D/D_Y = 3.31   printed beta 3.00
    # D IS TAKEN AS AUTHORITATIVE, for two reasons. D is the primary
    # measurement and beta is derived from it. And in both disputed system-1
    # cases the D column preserves a trend that the beta column breaks:
    # D_Nd = 0.422 keeps La < Ce < Pr < Nd < Sm monotonic (beta 2.35 would
    # put Nd below Pr), and D_Lu = 0.232 keeps Yb > Lu, which is also the
    # order in system 2. These are treated as typesetting errors in the beta
    # column. If that judgement is wrong it moves Nd and Lu only.
    #
    # THE SHAPE IS NOT MONOTONIC IN Z, AND THAT IS THE POINT.
    # beta_RE/Y from the anchor, by atomic number:
    #     La 1.22  Ce 2.10  Pr 2.91  Nd 3.61  Sm 5.29  Eu 4.52  Gd 3.54
    #     Tb 3.53  Dy 3.16  Ho 2.59  Er 2.23  Tm 2.15  Yb 2.16  Lu 1.98
    # It rises to a maximum at Sm, falls through the middle, flattens across
    # Er-Lu. Y sits below all of them. Carboxylic-acid extraction of the rare
    # earths is not a monotonic function of ionic radius, and any correlation
    # that assumes it is will be wrong at both ends.
    #
    # CONSEQUENCE FOR A HEAVY-RARE-EARTH FEED: the elements that separate
    # BEST from Y are Sm and Eu (beta 5.3, 4.5), which a xenotime concentrate
    # barely contains. Against the heavies that actually dominate such a feed
    # the separation factors are 2.0-3.2, and against Lu it is 1.98 -- the
    # worst of the fourteen except La. A Y/heavies split is therefore HARDER
    # than a Y/lights split in this solvent, and stage counts scale as
    # 1/log(beta).
    #
    # THREE INDEPENDENT CHECKS, NONE OF WHICH WENT INTO THE NUMBERS:
    #   1. Z1 Sec. 4.7.2 states "the average separation factor of RE/Y is
    #      about 3.0". The ladder gives a mean beta_RE/Y of 2.93 over the
    #      fourteen non-Y elements. Not used in the derivation.
    #   2. Q1 Sec. 2.4.2.2 requires beta_RE/Y > 2.0 for Gd and the heavies.
    #      The ladder gives Gd 3.54 down to Lu 1.98 -- satisfied everywhere
    #      except Lu, which misses by 1%.
    #   3. Q1 Sec. 2.4.2.2 requires beta_RE/Y > 1.5 for La-Sm. The ladder
    #      gives Ce-Sm 2.10-5.29, satisfied, but La = 1.22, which FAILS.
    #      This is not a defect in the ladder. Q1 Sec. 2.4.2.1 says the La/Y
    #      pair is anomalous in exactly this way: a heteronuclear La-Y
    #      complex forms, and beta_La/Y moves with the La:Y ratio, crossing
    #      1. The two sources agree that La/Y is composition-dependent and
    #      not a fixed separation factor. See the La/Y warning above.
    #
    # WHAT THE LADDER GIVES AT pH 4.5, 0.5 M HA, 298 K (model output, i.e.
    # EXTRAPOLATED 0.31 pH UNITS ABOVE THE ANCHOR -- read the two GAP
    # sections below before trusting the absolute level):
    #     Y  1.366   La 1.670   Ce 2.872   Pr 3.970   Nd 4.927   Sm 7.227
    #     Eu 6.176   Gd 4.834   Tb 4.822   Dy 4.320   Ho 3.538   Er 3.047
    #     Tm 2.931   Yb 2.954   Lu 2.709
    # The beta values are pH-independent in this model (common b), so they
    # are the anchor's betas at every pH. The absolute D values are not.
    #
    # ---------------------------------------------------------------------
    # THE FREE-EXTRACTANT GAP: `a` EMBEDS THE ANCHOR'S LOADING
    # ---------------------------------------------------------------------
    # Q1 Eq. 2.88 is a cube law in the FREE extractant (HA)o, and Eq. 2.89
    # defines it as (HA)o = [HA]0 - 3(REA3). difflow_ree's model raises the
    # TOTAL extractant concentration to the power n. Those are the same thing
    # only in the dilute limit.
    #
    # At the anchor the organic phase carries about 0.028 mol/L rare earth
    # against a 3:1 stoichiometric capacity of 0.45/3 = 0.150 mol/L, i.e. it
    # is ~19% loaded and the free extractant is ~0.366 mol/L against 0.45
    # total. The `a` values therefore absorb a -19% free-extractant
    # correction. Using them at a much higher or lower loading is an
    # extrapolation the record cannot support, and difflow_ree will not warn.
    #
    # THE SECOND SYSTEM IN Z1 TABLE 4.36 IS NOT USABLE AND WAS NOT USED.
    # It is printed as 0.13 mol/L naphthenic acid with 0.240 mol/L rare earth
    # at pH 4.96, O/A 2/1. Its own D values imply ~0.066 mol/L rare earth in
    # the organic phase against a 3:1 capacity of 0.0433 mol/L -- 153% of
    # capacity, so Eq. 2.89 returns a NEGATIVE free extractant concentration.
    # Something in that column is misprinted. It is recorded here so nobody
    # re-derives a ladder from it.
    #
    # It is worth stating what that costs: with one usable system there is no
    # cross-condition test of b = 3.0 in this record. Carrying the model from
    # system 1 to system 2 as printed mispredicts by 0.40 log units on
    # average, but with two points, three changed variables and one bad
    # column, that number tests the printing at least as much as the physics.
    # b = 3.0 rests on Q1 Sec. 2.4.2.1 alone, over pH 3.8-5.0 and Y 0.1-0.8
    # mol/L, on a free-extractant basis.
    #
    # ---------------------------------------------------------------------
    # THE SAPONIFICATION GAP: THE INDUSTRIAL REACTION RELEASES NH4+, NOT H+
    # ---------------------------------------------------------------------
    # This is the largest known structural error in this record, and it is
    # inherited from difflow_ree's mechanism set, not introduced here.
    #
    # Unsaponified (Z1 Eq. 4.94, Q1 Eq. 2.87):
    #     RE3+ + 3 HL(o)   =  REL3(o) + 3 H+     -> d(log D)/d(pH) = 3
    # 80% saponified, which is what the industry runs and what this record
    # declares (Z1 Eq. 4.95/4.96, Q1 Eq. 2.120):
    #     RE3+ + 3 NH4L(o) =  REL3(o) + 3 NH4+   -> NO PROTON IN THE EQUATION
    #
    # In the saponified system the driving variable is the ammonium activity
    # and the degree of saponification; pH enters only indirectly, through
    # the NH4+/NH3 buffer and through the unsaponified 20% fraction. Z1
    # Fig. 4.43 shows what that does: over pH 4.0 to 5.4 in the 80%-saponified
    # industrial solvent, D rises by roughly one order of magnitude, not the
    # 10^4.2 that a slope of 3 demands.
    #
    # difflow_ree has `cation_exchange` (proton) and `solvating` (neutral).
    # It has NO counter-ion-exchange mechanism. Until it does, this record
    # declares cation_exchange with b = 3.0 and is anchored at a MEASURED
    # point inside the band, which is the least-wrong available option. The
    # practical rule that follows:
    #
    #   *** SEPARATION FACTORS FROM THIS RECORD ARE SOUND ANYWHERE IN THE
    #   *** VALIDITY WINDOW; they are the anchor's measured betas and do not
    #   *** depend on b. ABSOLUTE D VALUES ARE SOUND ONLY NEAR pH 4.19 and
    #   *** degrade fast away from it. Stage counts driven by beta are
    #   *** usable. Solvent inventory and O/A driven by absolute D are not,
    #   *** without re-anchoring at the intended pH.
    #
    # Note that the paper this work is replicating specifies pH 4.5, which is
    # 0.31 pH units above the anchor -- a factor of 8.5 in D at slope 3, and
    # a factor of ~1.3 at the slope Z1 Fig. 4.43 actually shows. That spread
    # is the honest uncertainty on any absolute D at 4.5, and it is why the
    # validity window below stops at 5.0 rather than 5.5.
    #
    # ---------------------------------------------------------------------
    # CAPACITY: THE UNMODIFIED SOLVENT CANNOT REACH ITS OWN STOICHIOMETRY
    # ---------------------------------------------------------------------
    # At 3 HA per RE, 0.5 M naphthenic acid has a stoichiometric capacity of
    # 0.167 mol/L RE. It cannot get there. Q1 Table 2.45 gives the solubility
    # of solid REA3 in kerosene WITHOUT modifier as
    #     La 0.0374 | Pr 0.0374 | Gd 0.0558 | Er 0.0611 | Lu 0.0994 mol/L
    # i.e. 22%-60% of stoichiometric capacity. Above that the rare-earth
    # naphthenate precipitates or forms a third phase. With 15-20% v/v C7-C9
    # mixed alcohol the same solubilities rise to 0.23-0.48 mol/L and the
    # problem goes away; Q1 also reports relative viscosities up to 100x
    # kerosene without modifier. THE ALCOHOL (or petroleum sulfoxide) MODIFIER
    # IS NOT OPTIONAL IN THIS SYSTEM. Every Q1 datum behind this record was
    # measured on a modified solvent.
    # >>> A flowsheet specifying naphthenic acid in a bare aliphatic diluent
    #     with no modifier is specifying a solvent that third-phases before it
    #     is half loaded. difflow_ree has no third-phase model, so nothing in
    #     the code will warn you. <<<
    #
    # ---------------------------------------------------------------------
    # SAPONIFICATION IS ALREADY IN THE `a` VALUES -- DO NOT APPLY IT TWICE
    # ---------------------------------------------------------------------
    # The record ships counter_ion NH4 at degree 0.80 because that is the
    # industrial condition Q1 specifies for yttrium separation ("the
    # saponification ratio of the naphthenic acid at about 80%", Sec 2.4.2.1),
    # saponified with NH4OH or NaOH. Unlike the 0.35 on D2EHPA, that 0.80 is a
    # sourced operating value.
    # BUT: Q1 Eq. 2.87/2.88 -- the source of b = 3.0 and of every beta bound
    # used above -- were themselves measured on the SAPONIFIED, modified
    # solvent. The effect of saponification is therefore ALREADY EMBEDDED in
    # these coefficients. Running SaponifiedSection on top of them
    # DOUBLE-COUNTS it. Use one or the other, not both.
    # NH4 rather than Na is also an effluent decision, not a cosmetic one: it
    # puts ammonium nitrogen in the raffinate. See difflow_ree.economics.
    #
    # ---------------------------------------------------------------------
    # IMPURITIES: Fe, Th AND U ALL EXTRACT *BEFORE* THE RARE EARTHS
    # ---------------------------------------------------------------------
    # Q1's metal-ion extraction order for naphthenic acid is
    #   Fe3+ > Th4+ > Zr4+ > U4+ > In3+ > Tl3+ > ... > Cd2+ > RE3+ > Ni2+ > ...
    # with pH(1/2) for Fe3+ = 3.0, well below the pH 4.5 operating point.
    # Q1 Table 2.49 (equilibrium pH -> D):
    #   pH    1.18    1.67   1.90   2.50   2.80   3.00   3.20
    #   D_Fe  0.21    0.23   0.35   3.05   7.00   8.50   8.90
    #   D_Al    -       -    0.19   0.22   0.32   0.20   0.33
    #   D_RE  0.0016 0.0016 0.0017 0.0018 0.0020 0.0020 0.0021
    # Fe is ~4000x the rare earths by pH 3. The industrial process therefore
    # REMOVES Fe, Al, Th, U UPSTREAM and Q1 says so explicitly. A flowsheet
    # that feeds a Th/U-bearing liquor straight to naphthenic acid at pH 4.5
    # loads the thorium into the solvent ahead of the product, and neither
    # this record nor REEExtractor models that -- REEExtractor gives every
    # untracked species D = 0, i.e. perfectly non-extracted, which for Th and
    # Fe here is the opposite of the truth. No coefficients for Fe/Th/U/Al
    # ship on this record; the table above is documentation, not data the code
    # can read.
    #
    # ---------------------------------------------------------------------
    # MOLECULAR WEIGHT, pKa AND THE FACT THAT THIS IS NOT ONE COMPOUND
    # ---------------------------------------------------------------------
    # Naphthenic acid is a refinery by-product and a MIXTURE, so `formula`
    # is a placeholder and `molecular_weight` is an average that varies
    # between lots. Q1 Table 2.42: average MW 200-300 (Q1 Table 2.1 says
    # 200-400); acid value 180-230 mg KOH/g, which by 56100/acid_value gives
    # MW 244-312. 270 is the middle of the 244-300 overlap of those two
    # ranges. At density 0.96 that makes neat naphthenic acid 3.56 M, so the
    # 0.5 M reference here is 14% v/v -- inside Q1's validated 10-30% v/v
    # window, at its low end.
    # pKa 5.5 is Q1's value. Published pKa values for naphthenic acids scatter
    # widely because the composition does; higher apparent values are reported
    # for two-phase systems. 5.5 is what the rest of this record is consistent
    # with. Q1 also notes Q1 Table 2.42 water solubility < 0.09 g/L at pH 4 --
    # the saponified salt is far more soluble, and solvent loss to the
    # raffinate is a real operating cost this record does not carry.
    #
    # ---------------------------------------------------------------------
    # VALIDITY WINDOW
    # ---------------------------------------------------------------------
    #   pH 4.0-5.5, hydrochloric medium, [HA] 10-30% v/v (0.36-1.07 M at the
    #   MW and density above), saponified ~80% with NH4OH, WITH an alcohol or
    #   petroleum-sulfoxide modifier, 288-313 K, aqueous [RE] below the
    #   capacity limit above.
    # BELOW pH 4: D falls 1000x per pH unit (b = 3) and, at high [RECl3], Q1
    #   Eq. 2.91 says the mechanism CHANGES to neutral coordination of RECl3 --
    #   a different reaction this record does not describe.
    # ABOVE pH 5.6: RE3+ hydrolyzes, the extracted species becomes RE(OH)A2
    #   (Q1 Eq. 2.90), the HA:RE ratio drops below 3, and the solvent
    #   emulsifies. b = 3 is wrong there.
    # ANION: Q1 gives the medium effect as NO3- < Cl- < SO4(2-). These numbers
    #   are CHLORIDE. They will under-predict a sulfate system and
    #   over-predict a nitrate one, by an amount no retrieved source
    #   quantifies.
    # SALTING-OUT AGENTS shift the ladder NON-UNIFORMLY (Q1 Fig. 2.79: adding
    #   NH4NO3/LiNO3 raises heavy-RE D and lowers light-RE D). The anchor is
    #   a chloride system with NO salting-out agent and Z1 Table 4.36 names
    #   none. Do not use this record with a salting-out agent: it would move
    #   the two ends of the ladder in opposite directions, which is exactly
    #   the quantity no retrieved source gives.
    #
    # ---------------------------------------------------------------------
    # USE FOR / DO NOT USE FOR
    # ---------------------------------------------------------------------
    # USE FOR:
    #   - that Y is the least-extracted rare earth here and reports to the
    #     raffinate -- the qualitative fact the whole flowsheet rests on
    #   - SEPARATION FACTORS anywhere in the validity window: these are the
    #     anchor's measured betas and do not depend on b (see THE
    #     SAPONIFICATION GAP)
    #   - absolute D NEAR pH 4.19, where the anchor was measured
    #   - stage counts, which are driven by beta
    #   - trend, sensitivity and gradient-based structure studies
    #   - showing that naphthenic acid cannot separate adjacent lanthanides
    # DO NOT USE FOR:
    #   - any published stage count, sizing, purity or recovery number
    #   - a La/Y split (beta crosses 1; see above)
    #   - the lanthanide-lanthanide elution ORDER (the real one is scrambled)
    #   - temperature studies (d = 0 is a gap, not a measurement)
    #   - sulfate or nitrate media, or any system with a salting-out agent
    #   - an unmodified solvent at realistic loading (it third-phases)
    #   - regressing equilibrium constants against these numbers
    #   - Versatic 10 or any sterically hindered acid (Y inverts)
    #
    # ---------------------------------------------------------------------
    # UNRETRIEVED SOURCES -- THE HIGHEST-VALUE FOLLOW-UP, IN ORDER
    # ---------------------------------------------------------------------
    # The `a` ladder is no longer constructed, so these are no longer needed
    # to build it. Their value now is CORROBORATION AND EXTENSION: a second
    # measured full-series table would test Z1 Table 4.36, which is at
    # present a single unreplicated source for every per-element number in
    # this record. All three are paywalled with no open-access copy and NONE
    # was used. In priority order:
    #
    #   1. Zheng, D., Gray, N.B., Stevens, G.W. (1991), "Comparison of
    #      naphthenic acid, Versatic acid and D2EHPA for the separation of
    #      rare earths", Solvent Extr. Ion Exch. 9(1), 85-102.
    #      DOI 10.1080/07366299108918044.
    #      *** THE RIGHT SYSTEM: naphthenic acid, CHLORIDE medium, La/Dy/Yb/Y.
    #      Four elements spanning the series is enough to replace the slope
    #      AND the level. Get this one first. ***
    #   2. du Preez, A.C. & Preston, J.S. (1992), "The solvent extraction of
    #      rare-earth metals by carboxylic acids", Solvent Extr. Ion Exch.
    #      10(2), 207-230. DOI 10.1080/07366299208918101.
    #      Full La-to-Lu plus Y pH0.5 values for naphthenic acid AND Versatic
    #      10, in xylene from NITRATE media. pH0.5 converts straight into this
    #      record: at D = 1 and equal phase volumes, a = -3*pH0.5. Needs a
    #      nitrate-to-chloride and a xylene-to-aliphatic correction, neither
    #      of which any retrieved source quantifies.
    #   3. Preston, J.S. (1985), "Solvent extraction of metals by carboxylic
    #      acids", Hydrometallurgy 14(2), 171-188.
    #      DOI 10.1016/0304-386X(85)90032-5. Broader, earlier, same group.
    #
    # Q1 Fig. 2.79 (D-vs-Z, three salting-agent levels) remains undigitized.
    # It is no longer needed to LEVEL the ladder -- Z1 Table 4.36 does that
    # with measurements -- but it is still the only source for how the ladder
    # MOVES when a salting-out agent is added, which Q1 says it does
    # non-uniformly (lights down, heavies up). Digitize it before buying
    # anything, and before modelling any NH4Cl-loaded feed.
    ph_coefficients:
      # a = log10(D) - 12.4327, D from Z1 Table 4.36 system 1 (0.45 mol/L
      # naphthenic acid, 0.142 mol/L RE, pH 4.19, O/A 2/1, 25 C).
      # b = 3.0 is Q1 Eq. 2.88. c and d are NOT measured; see below.
      # Trailing comment on each line is the MEASURED D that produced it.
      La: {a: -13.2774, b: 3.0, c: 0.0, d: 0.0}  # D 0.143  beta_La/Y 1.22 -- ANOMALOUS, see La/Y warning
      Ce: {a: -13.0418, b: 3.0, c: 0.0, d: 0.0}  # D 0.246  beta 2.10
      Pr: {a: -12.9012, b: 3.0, c: 0.0, d: 0.0}  # D 0.340  beta 2.91
      Nd: {a: -12.8074, b: 3.0, c: 0.0, d: 0.0}  # D 0.422  beta 3.61 (printed beta 2.35 rejected)
      Sm: {a: -12.6410, b: 3.0, c: 0.0, d: 0.0}  # D 0.619  beta 5.29 -- MAXIMUM of the series
      Eu: {a: -12.7093, b: 3.0, c: 0.0, d: 0.0}  # D 0.529  beta 4.52
      Gd: {a: -12.8157, b: 3.0, c: 0.0, d: 0.0}  # D 0.414  beta 3.54
      Tb: {a: -12.8168, b: 3.0, c: 0.0, d: 0.0}  # D 0.413  beta 3.53
      Dy: {a: -12.8645, b: 3.0, c: 0.0, d: 0.0}  # D 0.370  beta 3.16
      # Ho-Lu are NOT in data/elements.yaml yet. They are written here because
      # a yttrium record without them is useless -- the industrial separation
      # is Y against Ho/Er/Tm/Yb/Lu. They are unreachable until elements.yaml
      # gains them. Unlike the superseded ladder, these are NOT extrapolations:
      # Z1 Table 4.36 measures all five directly.
      Ho: {a: -12.9513, b: 3.0, c: 0.0, d: 0.0}  # D 0.303  beta 2.59
      Er: {a: -13.0161, b: 3.0, c: 0.0, d: 0.0}  # D 0.261  beta 2.23
      Tm: {a: -13.0331, b: 3.0, c: 0.0, d: 0.0}  # D 0.251  beta 2.15
      Yb: {a: -13.0296, b: 3.0, c: 0.0, d: 0.0}  # D 0.253  beta 2.16
      Lu: {a: -13.0672, b: 3.0, c: 0.0, d: 0.0}  # D 0.232  beta 1.98 (printed beta 2.19 rejected)
      # Y is measured like the rest; it is the reference only because every
      # beta in this file is quoted against it. Its D is the LOWEST of the
      # fifteen, which is the entire reason this extractant is used.
      Y:  {a: -13.3645, b: 3.0, c: 0.0, d: 0.0}  # D 0.117  beta 1.00 by definition

    # ALL ZERO = NO DATA. Not a measurement that dD/dT is zero. See the
    # d = 0.0 block above. The true values are probably positive (exothermic).
    temperature_coefficients:  # d values in K
      La: 0.0   # NO DATA
      Ce: 0.0   # NO DATA
      Pr: 0.0   # NO DATA
      Nd: 0.0   # NO DATA
      Sm: 0.0   # NO DATA
      Eu: 0.0   # NO DATA
      Gd: 0.0   # NO DATA
      Tb: 0.0   # NO DATA
      Dy: 0.0   # NO DATA
      Ho: 0.0   # NO DATA
      Er: 0.0   # NO DATA
      Tm: 0.0   # NO DATA
      Yb: 0.0   # NO DATA
      Lu: 0.0   # NO DATA
      Y:  0.0   # NO DATA

    valid_ph_range: [4.0, 5.0]   # Q1's stated slope-3 verification range is pH 3.8-5.0;
                                 # the measured anchor is pH 4.19. See THE SAPONIFICATION GAP.
    valid_temp_range: [288, 313]  # deliberately narrow: there is NO T data
    reference_concentration: 0.5  # 14% v/v at MW 270 / density 0.96
    concentration_exponent: 3.0   # Q1 Eq. 2.88, cube law in FREE extractant
    # The pH at which the `a` ladder above is referenced, and so the condition
    # every quantity derived from this record is evaluated at (#268). 4.5 is
    # the midpoint of the slope-3 verification range and the same pH the
    # saponification block below uses. It is also, checkably, the pH the
    # deleted `typical_K_L` literal had been computed at: deriving
    # `K_L = D(4.5, 0.5 M, 298 K) / (0.5 / 3)` reproduces all fifteen of its
    # entries to four significant figures. Declaring it is what lets those
    # constants be computed rather than stored beside the ladder they came
    # from -- without it, a record that plainly HAS a reference condition
    # cannot say so, and the derivation refuses rather than guessing 4.5.
    reference_pH: 4.5
    # Commodity refinery by-product; the cheapest extractant in this file by
    # an order of magnitude, which is most of why the industry uses it.
    cost_usd_kg: 1.0
    saponification:
      counter_ion: NH4        # Q1: NH4OH or NaOH; NH4 puts N in the raffinate
      degree: 0.80            # Q1 Sec. 2.4.2.1, industrial Y separation
      log10_K: null           # calibrate; no measured constant retrieved
      reference_pH: 4.5
      reference_counter_ion: 0.1

# Diluent properties
diluents:
  kerosene:
    density: 0.80  # g/mL
    viscosity: 1.64  # cP at 25°C
    cost_usd_L: 1.0

  n-heptane:
    density: 0.684
    viscosity: 0.39
    cost_usd_L: 2.5

  Shellsol_D70:
    density: 0.79
    viscosity: 1.7
    cost_usd_L: 1.5

  n-dodecane:
    density: 0.75
    viscosity: 1.34
    cost_usd_L: 2.0

# Modifiers (phase transfer catalysts)
modifiers:
  TBP_modifier:
    description: "TBP added to acidic extractants to improve phase separation"
    typical_concentration: 0.05  # 5% v/v
    effect: "Reduces third phase formation, improves kinetics"

  isodecanol:
    description: "Alcohol modifier for acidic extractants"
    typical_concentration: 0.05
    effect: "Prevents crud formation, improves phase disengagement"

# ---------------------------------------------------------------------------
# PROVENANCE
#
# This is the machine-readable form of the "TWO DIFFERENT KINDS OF NUMBER"
# warning at the head of this file. `pattern` is a dotted path with `*` as a
# single-segment wildcard; the MOST SPECIFIC matching rule wins. `source` is a
# key in sources.yaml. Resolve with:
#
#     >>> from difflow_ree.provenance import explain, audit
#     >>> explain("extractants", "extractants.naphthenic_acid.ph_coefficients.Dy.a")
#     >>> audit("extractants", cls="HAND_TUNED")   # everything with no basis
#
# THE ONE THING TO KNOW: every pH and nitrate coefficient in this file is now
# traceable to a named table. #270 finished that. What is NOT traceable, and
# is tagged HAND_TUNED so that a query rather than a careful reading is enough
# to notice, is the `temperature_coefficients` block of D2EHPA, PC88A and
# Cyanex272 -- thirty numbers, invented to make demos look right, and not
# retirable by any of the sources that refitted the pH blocks, because every
# one of those sources is isothermal. So: D at 298 K is sourced for all five
# reagents; D at any other temperature is sourced for two.
#
# The remaining ESTIMATED fields are the five `cost_usd_kg` and four
# `cost_usd_L` -- order-of-magnitude figures for the economics examples, and
# never a basis for a cost claim.
#
# Read the class, not just the source key. A `source` of CALC with class
# DERIVED means a number computed here from other sources by arithmetic the
# record writes out; the source keys it was computed FROM are named in the
# note beside it and in the record above.
# ---------------------------------------------------------------------------
provenance:
  rules:
    # --- defaults: anything not matched more specifically ------------------
    - {pattern: "extractants.*.*", source: HAND_TUNED}
    - {pattern: "extractants.*.*.*", source: HAND_TUNED}
    - {pattern: "extractants.*.*.*.*", source: HAND_TUNED}

    # --- molecular identity and bulk properties ---------------------------
    # True of the molecule, not of any extraction experiment. Catalogue-grade.
    - {pattern: "extractants.*.full_name",         source: DEF}
    - {pattern: "extractants.*.alternative_names", source: DEF}
    - {pattern: "extractants.*.formula",           source: DEF}
    - {pattern: "extractants.*.type",              source: DEF}
    - {pattern: "extractants.*.mechanism",         source: DEF,
       note: "Normalized from `type` per the mapping at the head of this file."}
    - {pattern: "extractants.*.molecular_weight",  source: CRC}
    - {pattern: "extractants.*.density",           source: CRC}
    - {pattern: "extractants.*.pKa",               source: CRC}

    # --- stoichiometry ----------------------------------------------------
    - {pattern: "extractants.*.stoichiometry.*", source: DEF,
       note: "Follows from the declared mechanism: 3 protons per RE(III) for
              cation exchange, 0 and requires_nitrate for solvating."}

    # --- operating choices, not measurements ------------------------------
    - {pattern: "extractants.*.typical_concentration",    source: CONV}
    - {pattern: "extractants.*.reference_concentration",  source: CONV,
       note: "The concentration at which `a` is defined. A normalization
              choice; changing it changes `a` by n*log10(ratio)."}
    - {pattern: "extractants.*.reference_nitrate",        source: CONV}
    - {pattern: "extractants.*.reference_pH",             source: CONV,
       note: "The pH at which `a` is defined, and so the condition every
              quantity derived from the record is evaluated at (#268). A
              declared basis, like `reference_concentration`: changing it
              moves every derived constant with it."}
    - {pattern: "extractants.*.diluents",                 source: CONV}
    - {pattern: "extractants.*.cost_usd_kg",              source: EST,
       note: "*** NOT A QUOTED PRICE. *** Indicative only, same warning as the
              element prices. Solvent inventory cost is one of the larger
              terms in a TEA; substitute a dated quote before publishing one."}

    # --- saponification (#197) --------------------------------------------
    - {pattern: "extractants.*.saponification.degree", source: CONV,
       note: "A DEFAULT OPERATING POINT, not a property. 0.30-0.50 is the
              industrial range; 0.35 is the mid-range default used here.
              Overridden by a Saponifier, a section, or an optimizer."}
    - {pattern: "extractants.*.saponification.correlation_basis",     source: CONV,
       note: "A DECLARATION about the ph_coefficients above, not a property
              of the reagent: `unsaponified` says those coefficients were
              fitted (or, before #270, tuned) against a proton-exchange
              experiment with no alkali present, so the saponification model
              must be applied ON TOP of them rather than being already inside
              them (#266). True of all three acidic records, including after
              the #270 refits -- X95, PPH63, ZL93 and L14 are all
              unsaponified systems."}
    - {pattern: "extractants.*.saponification.counter_ion",           source: CONV}
    - {pattern: "extractants.*.saponification.reference_pH",          source: CONV}
    - {pattern: "extractants.*.saponification.reference_counter_ion", source: CONV}
    - {pattern: "extractants.*.saponification.log10_K",               source: CALC,
       note: "null ships here on purpose: NO MEASURED SAPONIFICATION CONSTANT
              IS IN THIS REPOSITORY. It is inverted at build time from
              K = S/(1-S) * [H+]/[M+] at the declared reference condition, so
              it restates the declared degree rather than reporting a fit."}

    # ======================================================================
    # (1) HAND-TUNED, NO SOURCE -- the three temperature blocks, and nothing
    #     else. All three pH blocks left this section in #270.
    #
    # None of the three is retirable by the sources that refitted the pH
    # blocks, because every one of those sources is ISOTHERMAL. Retiring
    # them needs a variable-temperature dataset for each reagent.
    # ======================================================================
    - {pattern: "extractants.D2EHPA.temperature_coefficients.*",    source: HAND_TUNED,
       note: "NOT retired by the #270 refit and not retirable by it. X95 and
              PPH63 are both room-temperature determinations with no
              temperature series. Sign unverified, and as written a negative
              d implies ENDOTHERMIC extraction (dH = +29 to +46 kJ/mol),
              which contradicts the comment that used to sit beside them.
              These are the last hand-tuned numbers in the D2EHPA
              correlation: D at 298 K is sourced, D at any other temperature
              is not."}
    - {pattern: "extractants.PC88A.temperature_coefficients.*",     source: HAND_TUNED,
       note: "NOT retired by the #270 refit and not retirable by it. T21 is
              isothermal at 298.0 +/- 0.1 K, so it carries no temperature
              information at all. These are the last hand-tuned numbers in
              the PC88A correlation: D at 298 K is measured, D at any other
              temperature is not."}
    - {pattern: "extractants.Cyanex272.temperature_coefficients.*", source: HAND_TUNED,
       note: "NOT retired by the #270 refit and not retirable by it. ZL93 is
              at 25 +/- 1 C and L14 at room temperature; neither varies it.
              Same unverified sign as D2EHPA above. D at 298 K is sourced,
              D at any other temperature is not."}

    # ======================================================================
    # (2a) LITERATURE-DERIVED -- PC88A pH block, refitted from T21 (#270)
    # ======================================================================
    # The catch-all for the block. More specific rules below override it for
    # the pinned parameters and for the interpolated elements.
    - {pattern: "extractants.PC88A.ph_coefficients.*.*",  source: T21}
    - {pattern: "extractants.PC88A.ph_coefficients.*.a",  source: T21,
       note: "log10(D) at reference_pH = 0 and reference_concentration, on
              the effective-concentration (Alstad) basis. One free parameter
              per element fitted to all 121 digitized points; se 0.011-0.045
              log units. Independently checked against the log Ke T21 prints
              on each figure panel -- never used in the digitization -- which
              it reproduces to within 0.06 log units for all five measured
              elements."}
    - {pattern: "extractants.PC88A.ph_coefficients.*.b",  source: T21,
       note: "PINNED at 3.0, the stoichiometric slope this record declares
              (protons_released: 3) and the slope T21 uses in its own Alstad
              analysis; T21's 22 measured series average 2.863 +/- 0.321
              against it. Not fitted, so this is stoichiometry confirmed by
              T21 rather than a T21 regression coefficient. One slope for
              every element is what makes a separation factor independent of
              pH, as mass action requires."}
    - {pattern: "extractants.PC88A.ph_coefficients.*.c",  source: CONV,
       note: "Zero by choice, not by fit. A quadratic buys 0.00-0.02 log
              units of rms and pays by inflating b to 3.5-5.0 with large
              negative curvature -- a quadratic absorbing scatter over a
              1-2 unit window, not curvature."}
    - {pattern: "extractants.PC88A.ph_coefficients.*.d",  source: CONV,
       note: "Zero because the temperature term lives in
              temperature_coefficients, not because a temperature dependence
              was measured to be absent."}
    # The five elements T21 did not measure. Interpolated, and tagged as
    # derived rather than measured so `audit(cls=...)` counts them honestly.
    - {pattern: "extractants.PC88A.ph_coefficients.Ce.a", source: CALC,
       note: "INTERPOLATED, not measured. Cubic in atomic number through the
              four measured lanthanides (La, Nd, Sm, Dy). Ce sits between
              measured La and Nd, 1.0 log units apart over three steps, so
              the factor it implies is fixed within a few percent by the
              measurements whatever smooth curve is drawn."}
    - {pattern: "extractants.PC88A.ph_coefficients.Pr.a", source: CALC,
       note: "INTERPOLATED, not measured. As Ce above: between measured La
              and Nd, so tightly constrained."}
    - {pattern: "extractants.PC88A.ph_coefficients.Eu.a", source: CALC,
       note: "INTERPOLATED, not measured, and the WEAKEST entries in this
              block along with Gd and Tb: all three lie in the 4-unit gap
              between measured Sm and Dy. The half-filled-shell break at Gd
              is real in this chemistry and a smooth curve cannot represent
              it. Indicative; refit before designing a middle-REE split."}
    - {pattern: "extractants.PC88A.ph_coefficients.Gd.a", source: CALC,
       note: "INTERPOLATED, not measured. See the Eu note -- Gd is the
              element the smooth curve is most likely to be wrong about."}
    - {pattern: "extractants.PC88A.ph_coefficients.Tb.a", source: CALC,
       note: "INTERPOLATED, not measured. See the Eu note."}
    - {pattern: "extractants.PC88A.valid_ph_range",       source: T21,
       note: "[0.1, 2.5], the union of the five per-element pH supports
              (0.12 to 2.46) rounded outward. Both ends are now measured;
              the old 5.5 was an unsourced guess and was also chemically
              empty -- at pH 3 this block puts D(La) at 8e4 and D(Dy) at
              4e8, every element quantitatively in the organic and no
              separation possible."}
    - {pattern: "extractants.PC88A.reference_pH",         source: T21,
       note: "1.33, the minimax over the five per-element supports: no
              single pH lies inside all five, so any anchor is outside
              somebody's, and this is the pH minimizing the worst excursion
              (0.09 pH units). Was 3.5 -- outside four of the five supports
              and outside the validity window."}
    - {pattern: "extractants.PC88A.activity_coefficient_A", source: T21,
       note: "0.473, the Alstad constant for EHEHPA in Shellsol D70, taken
              from T21's own treatment of its data (its Eqs. 3-5). The `a`
              values above were fitted on this form and are only valid with
              it applied."}

    # ======================================================================
    # (2a-bis) The two fields the three acidic records share, and which the
    # #270 refits reach even though they sit outside the pH block.
    # ======================================================================
    - {pattern: "extractants.D2EHPA.concentration_exponent",    source: M76,
       locus: "Q1 Fig. 2.2, p. 191",
       note: "2.38, FITTED (#283): the common slope of log D on log[HDEHP]
              over M76's three nine-point series, 0.0093-0.18 mol/L in
              n-heptane, 2.382 +/- 0.011, rms 0.021. The figure prints
              'lines of slope 2.5'; its drawn lines digitize to 2.37-2.40.
              An Alstad sqrt(C) correction on n = 3 fits worse (rms 0.059,
              curved residuals). Not the stoichiometry: three dimers per
              RE(III) still set the capacity. Unmeasured above 0.18 M; X95's
              La point at 1.0 M agrees with the extrapolation to 0.105."}
    - {pattern: "extractants.PC88A.concentration_exponent",     source: T21,
       locus: "Eqs. 3-5",
       note: "3.0, and unlike the other two this one is FITTED: T21 measures
              six concentration series from 0.041 to 0.82 mol/L as dimer and
              fits them as a cube law in the effective dimer concentration.
              That is also why this is the only record carrying
              activity_coefficient_A."}
    - {pattern: "extractants.Cyanex272.concentration_exponent", source: Z1,
       locus: "Eqs. (4.27)-(4.31), p. 124",
       note: "3.0, the declared stoichiometry, imposed rather than fitted.
              L14's six charges prefer n = 2.40 with b pinned at 3, but pH_eq
              and lg[HA]_free are correlated at r = -0.992 across those rows,
              so the series cannot separate the two exponents. The record
              above states the residual this costs (rms 0.215 in lg D)."}
    - {pattern: "extractants.D2EHPA.valid_temp_range",    source: CONV,
       note: "[283, 333] K is a DECLARED bracket, not a measured one, and it
              is wider than anything behind this record: X95 and PPH63 are
              both single-temperature. It brackets the hand-tuned
              temperature_coefficients, which is the only thing that varies
              with T here. Same status as naphthenic_acid's."}
    - {pattern: "extractants.PC88A.valid_temp_range",     source: CONV,
       note: "[283, 333] K is a DECLARED bracket. T21 is isothermal at
              298.0 +/- 0.1 K, so the range says nothing about where the
              measurements are -- it brackets the hand-tuned
              temperature_coefficients."}
    - {pattern: "extractants.Cyanex272.valid_temp_range", source: CONV,
       note: "[283, 333] K is a DECLARED bracket. ZL93 is at 25 +/- 1 C and
              L14 at room temperature; neither varies it. It brackets the
              hand-tuned temperature_coefficients."}

    # ======================================================================
    # (2a-ter) The other two `concentration_exponent`s. Not part of #270's
    # three records, but the same defect: both had a source named in the
    # record above and neither had a rule, so both were falling through the
    # catch-all and reporting HAND_TUNED. After this, HAND_TUNED in this file
    # means the thirty temperature coefficients and nothing else.
    # ======================================================================
    - {pattern: "extractants.TBP.concentration_exponent", source: GP19,
       locus: "Fig. 1",
       note: "3.0, the stoichiometric 3 of RE(NO3)3 + 3 TBP <-> RE(NO3)3.3TBP,
              corroborated but not set by measurement: GP19 Fig. 1 fits
              log D_Sm = 2.8055*log[TBP]_free - 2.8503 (R^2 = 0.992), i.e. an
              order of 2.81 in FREE TBP. Rounded to the stoichiometric 3
              rather than carrying 2.81, because the model applies the
              exponent to TOTAL TBP -- a distinction the record above flags
              as one of its two caveats on the level, and one that no
              rounding of the exponent can repair."}
    - {pattern: "extractants.naphthenic_acid.concentration_exponent", source: Q1,
       locus: "Eq. 2.88",
       note: "3.0, the cube law in FREE extractant that Eq. 2.88 writes for
              cation exchange of a trivalent ion by a dimerized acid -- the
              same 3 as this record's `b`. Not fitted here: Z1 Table 4.36 is
              at a single extractant concentration, so this record has no
              concentration series behind it either. #267's free-extractant
              solve is what makes the FREE basis this exponent assumes
              actually hold; on a total basis it overpredicts D by 1.34x at
              this record's own anchor."}

    # ======================================================================
    # (2b) LITERATURE-DERIVED -- D2EHPA pH block, refitted for #283
    #
    # LEVEL from M76 (Mason 1976, n-heptane, Y/Tm/Lu, via Q1 Figs. 2.1-2.2),
    # SHAPE from P57 (Peppard 1957, via SN61 Fig. 51). X95's kerosene La
    # point, the level until #283, is held out and met to 0.105 decades. The
    # arithmetic is written out on the record above.
    # ======================================================================
    - {pattern: "extractants.D2EHPA.ph_coefficients.*.*",  source: CALC}
    - {pattern: "extractants.D2EHPA.ph_coefficients.*.a",  source: CALC,
       locus: "M76 via Q1 Figs. 2.1-2.2, p. 191; P57 via SN61 Fig. 51",
       note: "DERIVED: level plus spacing. LEVEL: L = 1.0387, the mean of
