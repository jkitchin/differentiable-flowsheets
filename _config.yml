# Jupyter Book configuration
title: Differentiable Flowsheets
author: Differentiable Flowsheets Contributors
copyright: "2024"
logo: images/difflow-icon.png

# Exclude patterns - files/directories to ignore during build
exclude_patterns:
  - .venv
  - .venv/**
  - .claude
  - .claude/**
  - .pytest_cache
  - .pytest_cache/**
  - papers
  - papers/**
  - src/difflow_cc/docs
  - src/difflow_cc/docs/**
  - src/difflow_cc/DESIGN.md
  - CLAUDE.md
  - RELEASING.md
  - README.org
  - readme.org
  - readme_archive.org
  - tests
  - tests/**
  - papers
  - papers/**
  - "src/difflow_*/README.md"
  - differentiable-flowsheets-ree.md
  - docs/estimation-deliverables.md
  - "**/.ipynb_checkpoints"
  - "**/.ipynb_checkpoints/**"

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: "off"  # Don't execute notebooks during build (they may need special deps)
  timeout: 600

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file for citations
# bibtex_bibfiles:
#   - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/jkitchin/differentiable-flowsheets
  path_to_book: ""
  branch: main

# Add GitHub buttons to your book
html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: true
  home_page_in_navbar: false
  baseurl: "https://kitchingroup.cheme.cmu.edu/differentiable-flowsheets/"

# Launch buttons
launch_buttons:
  notebook_interface: "classic"
  binderhub_url: ""
  colab_url: "https://colab.research.google.com"

# Sphinx configuration
sphinx:
  config:
    html_favicon: images/favicon.png
    # Generate anchors for h1-h3 so in-page "[Text](#slug)" TOC links resolve.
    myst_heading_anchors: 3
    html_theme_options:
      navigation_with_keys: false
