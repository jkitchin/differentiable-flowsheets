<h2 id="why-a-debugger">Why a debugger</h2>
<h1 id="a-failed-solve-tells-you-that-not-where">A failed solve tells you <em>that</em>, not <em>where</em></h1>
<ul>
<li>A recycle that will not close usually fails somewhere specific: a unit returns a NaN on the first pass, one tear field oscillates, a reactor's own solve gives up.</li>
<li><code>fs.solve()</code> warns, and <code>difflow.diagnostics</code> reads the residual history. Both describe the <strong>end</strong> of the solve.</li>
<li>The debugger lets you <strong>watch</strong> the solve: it pauses unit by unit and tear iteration by tear iteration, shows every stream, and stops on breakpoints.</li>
</ul>
<p class="note">It is not <code>pdb</code>: <code>pdb</code> stops on lines of Python. This stops on the flowsheet's own structure, such as <em>before unit R1</em>, <em>at iteration 12</em>, <em>when the residual rises</em> or <em>where the first NaN is born</em>, and its commands speak streams, units and tears.</p>
<footer>difflow · the flowsheet debugger</footer>
</section>

<h2 id="the-example">The example</h2>
<h1 id="an-isomerization-loop-with-a-recycle">An isomerization loop with a recycle</h1>
<p><img src="assets/flowsheet.svg" alt="" style="width:1100px;" /></p>
<div class="cols">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># plant.py</span>
fs = Flowsheet(species_order=species)
fs.add_feed(<span class="hljs-string">&quot;fresh&quot;</span>, make_stream({...}, T=<span class="hljs-number">340.0</span>, P=<span class="hljs-number">101325.0</span>))
fs.add_unit(Unit(<span class="hljs-string">&quot;mixer&quot;</span>, Mixer(species, thermo),
                 [<span class="hljs-string">&quot;fresh&quot;</span>, <span class="hljs-string">&quot;recycle&quot;</span>], [<span class="hljs-string">&quot;reactor_feed&quot;</span>]))
fs.add_unit(Unit(<span class="hljs-string">&quot;reactor&quot;</span>, reactor, [<span class="hljs-string">&quot;reactor_feed&quot;</span>],
                 [<span class="hljs-string">&quot;effluent&quot;</span>], params={<span class="hljs-string">&quot;T_spec&quot;</span>: <span class="hljs-number">340.0</span>}))
fs.add_unit(Unit(<span class="hljs-string">&quot;split&quot;</span>, Splitter(species), [<span class="hljs-string">&quot;effluent&quot;</span>],
                 [<span class="hljs-string">&quot;recycle&quot;</span>, <span class="hljs-string">&quot;product&quot;</span>], params={<span class="hljs-string">&quot;split_frac&quot;</span>: <span class="hljs-number">0.8</span>}))
fs.add_recycle(<span class="hljs-string">&quot;recycle&quot;</span>, <span class="hljs-string">&quot;recycle&quot;</span>)    <span class="hljs-comment"># the tear stream</span>
</code></pre>
<div class="small">
<p>n-hexane → 2-methylpentane in a CSTR; 80 % of the effluent goes back to the mixer.</p>
<p><code>recycle</code> is the <strong>tear</strong>: the solver guesses it, runs the units, compares what comes back, and repeats until the two agree.</p>
<p>All the recordings that follow are real runs of this file.</p>
</div>
</div>
<footer>difflow · the flowsheet debugger</footer>

<h1 id="checkpoints-and-phases">Checkpoints and phases</h1>

<thead>
<tr>
<th>Checkpoint</th>
<th>Fires</th>
<th>Fresh at that point</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>solve_start</code></td>
<td>once, before anything runs</td>
<td>the feeds</td>
</tr>
<tr>
<td><code>before_unit</code> / <code>after_unit</code></td>
<td>around every unit call</td>
<td>the inlets; then the outlets and the unit's <code>info</code></td>
</tr>
<tr>
<td><code>unit_error</code></td>
<td>a unit raised</td>
<td>the inlets that broke it</td>
</tr>
<tr>
<td><code>iteration</code></td>
<td>the tear map was evaluated</td>
<td><code>x</code>, <code>g(x)</code>, the residual, the history</td>
</tr>
<tr>
<td><code>after_accel</code></td>
<td>Wegstein/Anderson made the next guess</td>
<td>the guess (<code>p next</code>)</td>
</tr>
<tr>
<td><code>terminated</code></td>
<td>the solve is about to return</td>
<td>the verdict</td>
</tr>
</tbody>
</table>

<h1 id="where-is-the-nan-born">Where is the NaN born?</h1>
<div class="cols">
<div>
<p>A preheater with a bug: fine above 400 K, NaN below.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">preheat</span>(<span class="hljs-params">stream</span>):

    ...
</code></pre>
<p>The plain solve says only <code>residual: nan</code>: by then every stream is NaN.</p>
<p><code>--on-error</code> runs freely and stops <strong>once</strong>, at the first unit that turns <em>finite</em> inlets into a NaN (or raises, or the solve ends unconverged).</p>
<p>Here: <code>preheat</code>, in the <strong>init</strong> pass, before anything reached the tear.</p>

<h2 id="step-5--try-a-different-guess">Step 5 · try a different guess</h2>
<h1 id="set-tear-streamfield-value"><code>set tear STREAM.FIELD VALUE</code></h1>
<div class="cols-wide">
<div class="term">
<p><img src="assets/05-set-tear.gif" alt="" style="width:720px;" /></p>
</div>
<div class="small">
<p>The one thing the debugger changes: the guess the <strong>next pass</strong> runs on.</p>
<ul>
<li>at an <code>iteration</code> pause it replaces that step</li>
<li>at <code>after_accel</code> it edits the accelerated guess</li>
</ul>
<p>An edit changes the <strong>route</strong>, not the fixed point: here 16 iterations instead of 6, the same product.</p>
<p>The edit is recorded in <code>fs.last_solve_debug_edits</code>, so an edited solve is never mistaken for a plain one.</p>
</div>
</div>

<h2 id="from-python">From Python</h2>
<h1 id="the-same-debugger-in-a-script-or-notebook">The same debugger in a script or notebook</h1>
<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> difflow <span class="hljs-keyword">import</span> debug

<span class="hljs-keyword">with</span> debug.attach():                 <span class="hljs-comment"># a prompt here</span>
    fs.solve(acceleration=<span class="hljs-string">&quot;wegstein&quot;</span>)

<span class="hljs-keyword">with</span> debug.attach(on_error=<span class="hljs-literal">True</span>):    <span class="hljs-comment"># post mortem only</span>
    fs.solve()
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> difflow.debug.runner <span class="hljs-keyword">import</span> DebugRunner

runner = DebugRunner(fs, {<span class="hljs-string">&quot;acceleration&quot;</span>: <span class="hljs-string">&quot;wegstein&quot;</span>})
runner.start()                          <span class="hljs-comment"># pause event</span>
runner.command(<span class="hljs-string">&quot;break on nonfinite&quot;</span>)    <span class="hljs-comment"># result event</span>
runner.command(<span class="hljs-string">&quot;continue&quot;</span>)[<span class="hljs-string">&quot;next&quot;</span>]      <span class="hljs-comment"># the next pause</span>
runner.close()
</code></pre>
</div>
<div class="small">
<p><code>debug.attach()</code> gives the same <code>difflow-dbg&gt;</code> prompt from a script or a notebook.</p>
<p><code>DebugRunner</code> runs the solve on a worker thread and hands back <strong>one event per call</strong>: the shape a server, an editor or an agent needs.</p>
<p>Detached, a solve is exactly what it was: one thread-local read per checkpoint. Attached, it only reads (apart from <code>set tear</code>), and <code>quit</code> raises <code>DebugQuit</code> rather than returning a partial answer.</p>
</div>
</div>
<footer>difflow · the flowsheet debugger</footer>
</section>

<h2 id="step-6--record-a-solve">Step 6 · record a solve</h2>
<h1 id="debugrecord-every-checkpoint-kept"><code>debug.record</code>: every checkpoint, kept</h1>
<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> difflow.debug.record <span class="hljs-keyword">import</span> summarize, state_at

s = summarize(trace)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">80 frames, 6 iterations, reads as: converged
frame  13  iter 0  4.25e-01  recycle.F_n_hexane
frame  20  iter 1  3.40e-01  recycle.F_n_hexane
frame  28  iter 2  6.52e-04  recycle.F_2_methylpentane
frame  36  iter 3  2.37e-04  recycle.F_n_hexane
frame  44  iter 4  2.24e-07  recycle.F_n_hexane

</div>
<div class="small">
<p>A recording solves once with nobody at the prompt.</p>
<p>Each frame holds only what that step wrote (the feeds, a unit's outlets, the tear iterate), so <code>state_at(trace, i)</code> is every stream at frame <code>i</code>.</p>

<h2 id="for-agents">For agents</h2>
<h1 id="the-same-debugger-as-mcp-tools">The same debugger as MCP tools</h1>
<div class="cols">
<div class="small">
<p><code>difflow mcp</code> serves:</p>
<table>
<thead>
<tr>
<th>Tool</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td><code>debug_guide</code></td>
<td>the contract + the handshake</td>
</tr>
<tr>
<td><code>debug_start</code></td>
<td>pause before the first pass, or <code>on_error</code></td>
</tr>
<tr>
<td><code>debug_command</code></td>
<td>any command; a resume returns the next stop</td>
</tr>
<tr>
<td><code>debug_wait</code> / <code>debug_pause</code></td>
<td>follow / stop a running solve</td>
</tr>
<tr>
<td><code>debug_record</code></td>
<td>a solve, summarized per iteration</td>
</tr>
<tr>
<td><code>debug_trace_frame</code></td>
<td>one frame in full</td>
</tr>
<tr>
<td><code>debug_whatif</code></td>
<td>a replay, compared: <code>same_answer</code></td>
</tr>
</tbody>
</table>
</div>
<div class="small">
<p>The <code>fix_convergence</code> prompt uses them when the findings alone do not say why:</p>
<ol>
<li><code>debug_start</code></li>
<li><code>break on nonfinite</code>, <code>break on residual_rise</code>, <code>continue</code></li>
<li>at the stop: <code>print tear</code>, <code>print history</code>, <code>diagnose</code></li>
<li><code>print</code> the unit at fault and its inlets</li>
<li>report the unit and the stream; <code>debug_stop</code></li>
</ol>
<p>Each solve runs on a <strong>copy</strong>: debugging never changes the session's flowsheet.</p>
</div>
</div>
<footer>difflow · the flowsheet debugger</footer>

<tr>

<tr>

<thead>
<tr>
<th>To</th>

</tr>
</tbody>
</table>

<h2 id="limits-and-where-to-read-more">Limits, and where to read more</h2>
<h1 id="what-it-can-and-cannot-step">What it can and cannot step</h1>
<ul>
<li><strong>Steps</strong> the eager tear iteration: <code>acceleration=&quot;anderson&quot;</code> (the default) and <code>&quot;wegstein&quot;</code>. <code>&quot;none&quot;</code> iterates inside optimistix: the debugger sees its start and end only.</li>
<li><strong>Nothing fires under <code>jax.grad</code> or <code>jit</code></strong>: a traced solve is traced once, not run.</li>
<li><strong>A unit is one step.</strong> Its own inner solve (a CSTR's Newton iteration) is not stepped; what it reports in <code>info</code> is shown, and <code>break on inner_unconverged</code> stops on it.</li>
<li><strong>It edits tear values only</strong>, never parameters.</li>
</ul>
<p class="note"><code>docs/debugger.md</code> · <code>examples/69_flowsheet_debugger.ipynb</code> · <code>docs/agents.md</code> · the editor app comes with the difflow book.</p>
